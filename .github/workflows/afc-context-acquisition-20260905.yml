name: AFC Context Acquisition 2026-09-05

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/afc-context-acquisition-20260905.yml'

permissions:
  contents: read

concurrency:
  group: afc-context-acquisition-20260905
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task:
          - shanghai_metroflow_corrected
          - nyc_permitted_events_historical
          - mbta_headways_2020
          - sydney_opal_release3_2020
    env:
      GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
    steps:
      - name: Check durable-storage configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GDRIVE_CONFIG_B64:-}" ]]; then
            echo 'Missing GDRIVE_RCLONE_CONFIG_B64; abort before heavy download.' >&2
            exit 3
          fi

      - name: Checkout public fetchers
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          rclone version | head -n 2

      - name: Restore temporary rclone config
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_FILE="$RUNNER_TEMP/rclone.conf"
          umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$CONFIG_FILE"
          REMOTE_NAME="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$CONFIG_FILE")"
          if [[ -z "$REMOTE_NAME" ]]; then
            echo 'No rclone remote section found.' >&2
            exit 4
          fi
          echo "config_file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"
          echo "remote_name=$REMOTE_NAME" >> "$GITHUB_OUTPUT"

      - name: Mirror corrected Shanghai MetroFlow release
        if: matrix.task == 'shanghai_metroflow_corrected'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fetchers/research_record_direct.py \
            --provider figshare \
            --record-id 33436675 \
            --dataset-id metroflow_shanghai_corrected_33436675 \
            --drive-path transport_data_lake/01_rail/CN_Shanghai_MetroFlow/corrected_33436675 \
            --config '${{ steps.storage.outputs.config_file }}' \
            --remote '${{ steps.storage.outputs.remote_name }}'

      - name: Mirror NYC permitted-event history
        if: matrix.task == 'nyc_permitted_events_historical'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fetchers/socrata_direct.py \
            --domain data.cityofnewyork.us \
            --dataset-id bkfu-528j \
            --name 'NYC Permitted Event Information - Historical' \
            --drive-path transport_data_lake/04_mobility_demand/US_NYC/NYC_Permitted_Event_Historical \
            --config '${{ steps.storage.outputs.config_file }}' \
            --remote '${{ steps.storage.outputs.remote_name }}' \
            --chunk-rows 100000

      - name: Mirror MBTA Rapid Transit Headways 2020
        if: matrix.task == 'mbta_headways_2020'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fetchers/arcgis_feature_layer_direct.py \
            --layer-url 'https://services1.arcgis.com/ceiitspzDAHrdGO1/ArcGIS/rest/services/MBTA_Rapid_Transit_Headways_2020/FeatureServer/0' \
            --dataset-id mbta_rapid_transit_headways_2020 \
            --name 'MBTA Rapid Transit Headways 2020' \
            --filename Rapid_Transit_Headways_2020.csv \
            --drive-path transport_data_lake/01_rail/US_MA_MBTA/02_actual_operations/2020/headways \
            --config '${{ steps.storage.outputs.config_file }}' \
            --remote '${{ steps.storage.outputs.remote_name }}' \
            --chunk-size 1000

      - name: Mirror Sydney Opal Release 3 package
        if: matrix.task == 'sydney_opal_release3_2020'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fetchers/ckan_package_direct.py \
            --base 'https://opendata.transport.nsw.gov.au/data' \
            --package 'opal-tap-on-and-tap-off-release-3-2020' \
            --dataset-id sydney_opal_release3_2020_reacquire \
            --drive-path transport_data_lake/01_rail/AU_Sydney_Opal/04_demand_od/2020/release3_reacquire \
            --config '${{ steps.storage.outputs.config_file }}' \
            --remote '${{ steps.storage.outputs.remote_name }}'

      - name: Clean temporary storage configuration
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then
            shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"
          fi

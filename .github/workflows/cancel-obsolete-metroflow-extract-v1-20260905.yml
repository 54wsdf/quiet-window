name: Cancel Obsolete MetroFlow Extract V1 2026-09-05

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-obsolete-metroflow-extract-v1-20260905.yml'

permissions:
  contents: read
  actions: write

jobs:
  cancel-obsolete-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel obsolete V1 run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/54wsdf/quiet-window/actions/runs/33906833746/cancel')"
          cat /tmp/resp || true
          if [[ "$code" != '202' && "$code" != '409' ]]; then
            echo "Unexpected cancel HTTP status: $code" >&2
            exit 1
          fi
          echo "Cancel request status: $code"

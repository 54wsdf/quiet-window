name: Rescue Metro 2025 Estimated OD Artifact to Transferable Chunks
on:
  push:
    branches: [metro-artifact-rescue-20261122]
    paths:
      - '.github/workflows/metro-artifact-rescue-20261122.yml'
permissions:
  actions: read
  contents: read
jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Download 2025 estimated OD source artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '14776167381'
          run-id: '45044957634'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: incoming
          merge-multiple: true
      - name: Validate original source SHA256 and prepare 64 MiB recovery manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,math
          source=Path('incoming/nyc_od_2025.csv.gz')
          manifest=Path('incoming/manifest.json')
          assert source.is_file() and manifest.is_file(), 'Missing expected incoming files'
          m=json.loads(manifest.read_text())
          assert m['task']=='nyc_od_2025' and m['status']=='COLLECTED',m
          match=[v for v in m['items'] if v.get('file')==source.name]
          assert len(match)==1 and match[0].get('sha256'),'No original SHA256'
          out=Path('out'); (out/'parts').mkdir(parents=True,exist_ok=True)
          h=hashlib.sha256();entries=[];n=0
          with source.open('rb') as f:
              while (b:=f.read(64*1024*1024)):
                  h.update(b)
                  name=f'{source.name}.part{n:03}'
                  entries.append({'name':name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
                  n+=1
          assert h.hexdigest()==match[0]['sha256'],f'Original SHA256 mismatch: {h.hexdigest()} != {match[0]["sha256"]}'
          assert len(entries)==67,f'Expected 67 parts but got {len(entries)}'
          (out/'original_manifest.json').write_bytes(manifest.read_bytes())
          recovery={'task':'nyc_od_2025','source_run_id':45044957634,'source_artifact_id':14776167381,'original_file':source.name,'original_bytes':source.stat().st_size,'original_sha256':h.hexdigest(),'parts':entries,'reassemble':'cat '+' '.join(e['name'] for e in entries)+' > '+source.name,'note':'Each 64MiB data chunk is in a separate Actions Artifact ZIP; extract each and concatenate by ascending part number. SHA256 matches source.'}
          (out/'recovery_manifest.json').write_text(json.dumps(recovery,indent=2)+'\n')
          print('VERIFIED',source.name,source.stat().st_size,'PARTS',len(entries),'SHA',h.hexdigest(),flush=True)
          PY
      - name: Upload original and recovery manifests
        uses: actions/upload-artifact@v4
        with:
          name: rescued_nyc_od_2025_manifest
          path: |
            out/original_manifest.json
            out/recovery_manifest.json
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Prepare chunk 000 and release previous chunk
        shell: bash
        run: |
          rm -f out/parts/*
          python - <<'PY'
          from pathlib import Path
          n=0; source=Path('incoming/nyc_od_2025.csv.gz'); dest=Path('out/parts/nyc_od_2025.csv.gz.part000')
          with source.open('rb') as f:
              f.seek(n*67108864)
              data=f.read(67108864)
          assert data, 'Missing data for chunk 000'
          dest.write_bytes(data)
          print('READY',dest,len(data),flush=True)
          PY
      - name: Upload chunk 000

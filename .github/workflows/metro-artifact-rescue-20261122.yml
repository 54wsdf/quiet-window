name: Rescue Metro Historical Hourly Artifact to Transferable Chunks
on:
  push:
    branches: [metro-artifact-rescue-20261122]
    paths:
      - '.github/workflows/metro-artifact-rescue-20261122.yml'
permissions:
  actions: read
  contents: read
jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Retrieve historical hourly artifact from source run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '14774585863'
          run-id: '45044957634'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: incoming
          merge-multiple: true
      - name: Verify original SHA256 and split into 64 MiB chunks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          manifest=Path('incoming/manifest.json')
          assert manifest.exists(), 'Missing source manifest'
          m=json.loads(manifest.read_text())
          assert m['task']=='nyc_hourly_2020_2024' and m['status']=='COLLECTED', m
          sources=list(Path('incoming').glob('*.csv.gz'))
          assert len(sources)==1, f'Unexpected csv.gz sources: {sources}'
          source=sources[0]
          match=[v for v in m['items'] if v.get('file')==source.name]
          assert len(match)==1 and match[0].get('sha256'),f'Missing SHA256 record for {source.name}'
          expected=match[0]['sha256']
          out=Path('out'); (out/'parts').mkdir(parents=True,exist_ok=True)
          total=hashlib.sha256(); entries=[]
          with source.open('rb') as f:
              i=0
              while (buf:=f.read(64*1024*1024)):
                  total.update(buf)
                  name=f'{source.name}.part{i:03}'
                  (out/'parts'/name).write_bytes(buf)
                  entries.append({'name':name,'bytes':len(buf),'sha256':hashlib.sha256(buf).hexdigest()})
                  i+=1
          assert total.hexdigest()==expected, f'Original SHA256 mismatch {total.hexdigest()} != {expected}'
          assert len(entries)<=48 and len(entries)>=45, f'Unexpected chunk count: {len(entries)}'
          (out/'original_manifest.json').write_bytes(manifest.read_bytes())
          recovery={'task':'nyc_hourly_2020_2024','source_run_id':45044957634,'source_artifact_id':14774585863,'original_file':source.name,'original_bytes':source.stat().st_size,'original_sha256':total.hexdigest(),'parts':entries,'reassemble':'cat '+ ' '.join(e['name'] for e in entries)+' > '+source.name,'note':'Each part is inside one GitHub Artifact ZIP; extract parts and concatenate in ascending index order.'}
          (out/'recovery_manifest.json').write_text(json.dumps(recovery,indent=2)+'\n')
          print('RECOVERED', source.name,source.stat().st_size,'PARTS',len(entries),'SHA',total.hexdigest(),flush=True)
          PY
      - name: Upload original and recovery manifests
        uses: actions/upload-artifact@v4
        with:
          name: rescued_nyc_hourly_2020_2024_manifest
          path: |
            out/original_manifest.json
            out/recovery_manifest.json
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Upload data chunk 000
        uses: actions/upload-artifact@v4
        with:
          name: rescued_nyc_hourly_2020_2024_part000
          path: out/parts/*.part000
          retention-days: 3
          compression-level: 0
          if-no-files-found: ignore

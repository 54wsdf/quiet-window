name: MPPD G1B Full Network Weak Latent Service Init 2026-09-04

on:
  push:
    paths:
      - '.github/workflows/mppd-g1b-full-network-weak-latent-service-init-20260904.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g1b-weak-latent-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      ROOT_DRIVE: ResearchData/rail_transit/metro_transfer_afc_ats_bridge/20260903/seoul
      OUT_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904/g1b_weak_latent_service_init
    steps:
      - name: Checkout execution code
        uses: actions/checkout@v4

      - name: Restore complete-network Seoul inputs
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GDRIVE_CONFIG_B64:-}" || exit 3
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          python -m pip install --disable-pip-version-check networkx
          C="$RUNNER_TEMP/rclone.conf"; umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          echo "config_file=$C" >> "$GITHUB_OUTPUT"
          echo "remote_name=$R" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/g1b/out"
          rclone copyto "$R:$ROOT_DRIVE/passenger/20260902/TAIMS_20260902.zip" "$RUNNER_TEMP/g1b/TAIMS.zip" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$ROOT_DRIVE/99_manifests/seoul_p1c_line_aware_crosswalk_20260903.json" "$RUNNER_TEMP/g1b/p1c.json" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$ROOT_DRIVE/processed/service_events/20260829/am_fresh_service_event_candidates_0700_1000.csv" "$RUNNER_TEMP/g1b/service.csv" --config "$C" --retries 6 --low-level-retries 15 --transfers 1

      - name: Build weak latent service support for unresolved line-directions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"
          python -m py_compile \
            scripts/mppd_g0_full_network_coverage_20260904.py \
            scripts/mppd_g1_full_network_service_bootstrap_20260904.py \
            scripts/mppd_g1b_full_network_weak_latent_service_init_20260904.py
          /usr/bin/time -v python scripts/mppd_g1b_full_network_weak_latent_service_init_20260904.py \
            --taims "$RUNNER_TEMP/g1b/TAIMS.zip" \
            --p1c "$RUNNER_TEMP/g1b/p1c.json" \
            --service "$RUNNER_TEMP/g1b/service.csv" \
            --out "$RUNNER_TEMP/g1b/out" \
            2>&1 | tee "$RUNNER_TEMP/g1b/out/g1b_execution.log"

      - name: Persist G1B outputs
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.prep.outputs.config_file }}
          REMOTE_NAME: ${{ steps.prep.outputs.remote_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/g1b/out"
          test -f g1b_full_network_weak_latent_service_init_summary.json
          test -f g1b_weak_latent_service_field.json
          for f in *; do
            rclone copyto "$f" "$REMOTE_NAME:$OUT_DRIVE/$f" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          done
          rclone lsf "$REMOTE_NAME:$OUT_DRIVE" --config "$CONFIG_FILE" | sort

      - name: Clean protected configuration
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.prep.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then
            shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"
          fi

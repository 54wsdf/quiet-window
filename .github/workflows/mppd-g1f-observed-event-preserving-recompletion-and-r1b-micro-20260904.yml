name: MPPD G1F Observed Event Preserving Recompletion and R1B Micro 2026-09-04

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/mppd_g1f_observed_event_preserving_service_recompletion_20260904.py
      - .github/workflows/mppd-g1f-observed-event-preserving-recompletion-and-r1b-micro-20260904.yml

permissions:
  contents: read

jobs:
  g1f-recompletion-and-r1b-micro:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      SEOUL_ROOT: ResearchData/rail_transit/metro_transfer_afc_ats_bridge/20260903/seoul
      BASE_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904
      ROUTE_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904/r0_full_network_route_ensemble_g0h_gtxa
      G1D_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904/g1d_gtxa_date_aware_service_init
      OUT_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904/g1f_observed_event_preserving_recompletion
    steps:
      - name: Checkout execution code
        uses: actions/checkout@v4

      - name: Restore G1D and R1B paired inputs
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GDRIVE_CONFIG_B64:-}" || exit 3
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          python -m pip install --disable-pip-version-check --quiet networkx scipy numpy
          C="$RUNNER_TEMP/rclone.conf"; umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          echo "config_file=$C" >> "$GITHUB_OUTPUT"; echo "remote_name=$R" >> "$GITHUB_OUTPUT"
          ROOT="$RUNNER_TEMP/g1f"; mkdir -p "$ROOT/g1f" "$ROOT/r1b"
          rclone copyto "$R:$SEOUL_ROOT/99_manifests/seoul_p1c_line_aware_crosswalk_20260903.json" "$ROOT/p1c.json" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$G1D_DRIVE/seoul_20260829_0700_1000_service_state_initialization_v3_gtxa_date_aware.json" "$ROOT/service_init_g1d.json" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$BASE_DRIVE/g0h_gtxa_corrected_cohort_rebuild/seoul_20260829_0700_1000_afc_time_cohorts_g0h.csv.gz" "$ROOT/cohorts.csv.gz" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$ROUTE_DRIVE/r0_full_network_route_ensemble_candidates.jsonl.gz" "$ROOT/routes.jsonl.gz" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          cd "$ROOT"; sha256sum p1c.json service_init_g1d.json cohorts.csv.gz routes.jsonl.gz > input_sha256.txt

      - name: Build G1F observed-event-preserving service substrate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/g1f"
          python -m py_compile scripts/mppd_g1f_observed_event_preserving_service_recompletion_20260904.py
          python -m scripts.mppd_g1f_observed_event_preserving_service_recompletion_20260904 \
            --p1c "$ROOT/p1c.json" \
            --service-init "$ROOT/service_init_g1d.json" \
            --topology-patch manifests/mppd_seoul_topology_patch_g0e_20260904.json \
            --gtxa-overlay manifests/mppd_seoul_gtxa_crosswalk_overlay_g0h_20260904.json \
            --max-variants-per-state 3 \
            --out "$ROOT/g1f" | tee "$ROOT/g1f/g1f_execution.log"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'g1f'/'g1f'
          s=json.loads((root/'g1f_observed_event_preserving_service_recompletion_summary.json').read_text())
          m=s['manifest']
          assert s['status']=='G1F_OBSERVED_EVENT_PRESERVING_SERVICE_RECOMPLETION_COMPLETED'
          assert m['observed_event_preservation_global_pass'] is True
          assert int(m['emitted_invariant_violation_count'])==0
          svc=json.loads((root/'seoul_20260829_0700_1000_service_state_initialization_v5_observed_event_preserving_recompletion.json').read_text())
          assert svc['schema']=='mppd.city-day-service-state-initialization.v5-observed-event-preserving-corrected-recompletion'
          for st in svc['states']:
              if st.get('evidence_class')=='SERVICE_TRAJECTORY_COMPLETION_HYPOTHESIS':
                  assert st.get('path',{}).get('observed_event_preservation_pass') is True
          PY

      - name: Run paired R1B V4 micro on G1F
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/g1f"
          python -m py_compile scripts/mppd_r1b_first_bidirectional_joint_update_v4_residual_records_20260904.py
          /usr/bin/time -v python -m scripts.mppd_r1b_first_bidirectional_joint_update_v4_residual_records_20260904 \
            --p1c "$ROOT/p1c.json" \
            --cohorts "$ROOT/cohorts.csv.gz" \
            --routes "$ROOT/routes.jsonl.gz" \
            --service-init "$ROOT/g1f/seoul_20260829_0700_1000_service_state_initialization_v5_observed_event_preserving_recompletion.json" \
            --topology-patch manifests/mppd_seoul_topology_patch_g0e_20260904.json \
            --gtxa-overlay manifests/mppd_seoul_gtxa_crosswalk_overlay_g0h_20260904.json \
            --sample-mod 50 --max-cohorts 1500 --beam 6 --max-skip 2 --min-service-usage 10 \
            --out "$ROOT/r1b" 2>&1 | tee "$ROOT/r1b/r1b_g1f_micro_v4_execution.log"
          cp "$ROOT/input_sha256.txt" "$ROOT/g1f/g1f_input_sha256.txt"
          cp "$ROOT/r1b/r1b_first_bidirectional_joint_update_smoke_summary.json" "$ROOT/g1f/r1b_g1f_micro_v4_summary.json"
          cp "$ROOT/r1b/r1b_weighted_failure_residual_cohorts_e0.jsonl.gz" "$ROOT/g1f/r1b_g1f_micro_v4_residual_e0.jsonl.gz"
          cp "$ROOT/r1b/r1b_weighted_failure_residual_cohorts_e1.jsonl.gz" "$ROOT/g1f/r1b_g1f_micro_v4_residual_e1.jsonl.gz"
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'g1f'; out=root/'g1f'
          g=json.loads((out/'g1f_observed_event_preserving_service_recompletion_summary.json').read_text())
          r=json.loads((out/'r1b_g1f_micro_v4_summary.json').read_text())
          assert r['schema']=='mppd.r1b-first-bidirectional-joint-update-smoke.v4-residual-records'
          for phase in ('E0_passenger_posterior','E1_passenger_posterior'):
              assert r['iteration'][phase]['failure_mass_conservation_pass'] is True
          gates=r['r1b_minimum_gate']; assert all(gates.values())
          manifest={'schema':'mppd.g1f-observed-event-preserving-recompletion-execution-manifest.v1','date':'2026-09-04','status':'G1F_AND_PAIRED_R1B_MICRO_COMPLETED','execution_sha':os.environ.get('GITHUB_SHA'),'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),'g1f_manifest':g['manifest'],'r1b_micro_scope':r['scope'],'r1b_micro_E0':r['iteration']['E0_passenger_posterior'],'r1b_micro_E1':r['iteration']['E1_passenger_posterior'],'r1b_micro_redistribution':r['iteration']['posterior_redistribution'],'output_files':{},'scientific_boundary':['G1F changes only latent service completion hypotheses generated from G1D retained roots; no independent service root is created.','Every emitted G1F completion preserves all original source-root station events exactly.','R1B micro is paired to previous deterministic sample but is still a micro qualification, not population authority.'],'no_email_notification_logic':True}
          for p in sorted(out.iterdir()):
              if p.is_file() and p.name!='g1f_execution_manifest.json': manifest['output_files'][p.name]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'g1f_execution_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          print(json.dumps({'g1f_manifest':g['manifest'],'R1B_E0':r['iteration']['E0_passenger_posterior'],'R1B_E1':r['iteration']['E1_passenger_posterior'],'redistribution':r['iteration']['posterior_redistribution']},ensure_ascii=False,indent=2))
          PY
          cd "$ROOT/g1f"; find . -maxdepth 1 -type f ! -name output_sha256.txt -print0 | sort -z | xargs -0 sha256sum > output_sha256.txt
          cat g1f_observed_event_preserving_service_recompletion_summary.json >> "$GITHUB_STEP_SUMMARY"
          cat r1b_g1f_micro_v4_summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Persist G1F and paired micro outputs
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.prep.outputs.config_file }}
          REMOTE_NAME: ${{ steps.prep.outputs.remote_name }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/g1f/g1f"
          for f in "$ROOT"/*; do test -s "$f"; rclone copyto "$f" "$REMOTE_NAME:$OUT_DRIVE/$(basename "$f")" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15 --transfers 1; done
          rclone lsf "$REMOTE_NAME:$OUT_DRIVE" --config "$CONFIG_FILE" | sort

      - name: Clean protected configuration
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.prep.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"; fi

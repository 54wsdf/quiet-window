name: MPPD N3 Segment-Conditioned Smoke 2026-09-04

on:
  push:
    paths:
      - '.github/workflows/mppd-n3-segment-conditioned-smoke-20260904.yml'
      - 'scripts/mppd_n3_segment_conditioned_smoke_20260904.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      ROOT_DRIVE: ResearchData/rail_transit/metro_transfer_afc_ats_bridge/20260903/seoul
      OUT_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904/n3_segment_conditioned_smoke
    steps:
      - uses: actions/checkout@v4
      - name: Prepare inputs
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          python -m pip install --disable-pip-version-check numpy scipy
          C="$RUNNER_TEMP/rclone.conf"; umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          echo "config_file=$C" >> "$GITHUB_OUTPUT"; echo "remote_name=$R" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/n3segsmoke/out"; cd "$RUNNER_TEMP/n3segsmoke"
          rclone copyto "$R:$ROOT_DRIVE/passenger/20260902/TAIMS_20260902.zip" TAIMS.zip --config "$C" --retries 6 --low-level-retries 15
          rclone copyto "$R:$ROOT_DRIVE/99_manifests/seoul_p1c_line_aware_crosswalk_20260903.json" p1c.json --config "$C" --retries 6 --low-level-retries 15
          rclone copyto "$R:$ROOT_DRIVE/processed/service_events/20260829/am_fresh_service_event_candidates_0700_1000.csv" service.csv --config "$C" --retries 6 --low-level-retries 15
      - name: Run one-target segment-conditioned normalized likelihood
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"
          python -m py_compile scripts/mppd_n3_shared_kernel_joint_likelihood_20260904.py scripts/mppd_n3_normalized_schedule_likelihood_20260904.py scripts/mppd_n3_segment_conditioned_normalized_likelihood_20260904.py scripts/mppd_n3_segment_conditioned_smoke_20260904.py
          python scripts/mppd_n3_segment_conditioned_smoke_20260904.py \
            --taims "$RUNNER_TEMP/n3segsmoke/TAIMS.zip" \
            --p1c "$RUNNER_TEMP/n3segsmoke/p1c.json" \
            --service "$RUNNER_TEMP/n3segsmoke/service.csv" \
            --out "$RUNNER_TEMP/n3segsmoke/out"
      - name: Persist smoke result
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.prep.outputs.config_file }}
          REMOTE_NAME: ${{ steps.prep.outputs.remote_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/n3segsmoke/out"
          for f in *; do rclone copyto "$f" "$REMOTE_NAME:$OUT_DRIVE/$f" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15; done
          rclone lsf "$REMOTE_NAME:$OUT_DRIVE" --config "$CONFIG_FILE" | sort
      - name: Clean protected config
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.prep.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"; fi

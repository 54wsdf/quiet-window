name: MPPD N3 Targeted Line2 Joint Likelihood 2026-09-04

on:
  push:
    paths:
      - '.github/workflows/mppd-n3-targeted-line2-joint-likelihood-20260904.yml'
      - 'scripts/mppd_n3_targeted_line2_joint_likelihood_20260904.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-targeted-n3:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      ROOT_DRIVE: ResearchData/rail_transit/metro_transfer_afc_ats_bridge/20260903/seoul
      OUT_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904/n3_targeted_line2_joint_likelihood
    steps:
      - uses: actions/checkout@v4
      - name: Prepare inputs
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          python -m pip install --disable-pip-version-check numpy scipy
          C="$RUNNER_TEMP/rclone.conf"; umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          echo "config_file=$C" >> "$GITHUB_OUTPUT"; echo "remote_name=$R" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/n3t/out"; cd "$RUNNER_TEMP/n3t"
          rclone copyto "$R:$ROOT_DRIVE/passenger/20260902/TAIMS_20260902.zip" TAIMS.zip --config "$C" --retries 6 --low-level-retries 15
          rclone copyto "$R:$ROOT_DRIVE/99_manifests/seoul_p1c_line_aware_crosswalk_20260903.json" p1c.json --config "$C" --retries 6 --low-level-retries 15
          rclone copyto "$R:$ROOT_DRIVE/processed/service_events/20260829/am_fresh_service_event_candidates_0700_1000.csv" service.csv --config "$C" --retries 6 --low-level-retries 15
      - name: Run targeted Line2 shared-kernel hidden-service scoring
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"
          python -m py_compile scripts/mppd_n3_shared_kernel_joint_likelihood_20260904.py scripts/mppd_n3_targeted_line2_joint_likelihood_20260904.py
          python scripts/mppd_n3_targeted_line2_joint_likelihood_20260904.py \
            --taims "$RUNNER_TEMP/n3t/TAIMS.zip" \
            --p1c "$RUNNER_TEMP/n3t/p1c.json" \
            --service "$RUNNER_TEMP/n3t/service.csv" \
            --out "$RUNNER_TEMP/n3t/out"
      - name: Persist targeted N3 output
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.prep.outputs.config_file }}
          REMOTE_NAME: ${{ steps.prep.outputs.remote_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/n3t/out"
          test "$(find . -maxdepth 1 -type f | wc -l)" -gt 0
          for f in *; do rclone copyto "$f" "$REMOTE_NAME:$OUT_DRIVE/$f" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15; done
          rclone lsf "$REMOTE_NAME:$OUT_DRIVE" --config "$CONFIG_FILE" | sort
      - name: Clean protected config
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.prep.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"; fi

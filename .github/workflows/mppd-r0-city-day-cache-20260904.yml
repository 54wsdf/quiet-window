name: MPPD R0 City Day Cache 2026-09-04

on:
  push:
    paths:
      - '.github/workflows/mppd-r0-city-day-cache-20260904.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r0-city-day-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      ROOT_DRIVE: ResearchData/rail_transit/metro_transfer_afc_ats_bridge/20260903/seoul
      OUT_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904/r0_city_day_cache
    steps:
      - name: Checkout execution code
        uses: actions/checkout@v4

      - name: Restore Seoul passenger and topology inputs
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GDRIVE_CONFIG_B64:-}" || exit 3
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          python -m pip install --disable-pip-version-check networkx
          C="$RUNNER_TEMP/rclone.conf"; umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          echo "config_file=$C" >> "$GITHUB_OUTPUT"
          echo "remote_name=$R" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/r0cache/out"
          rclone copyto "$R:$ROOT_DRIVE/passenger/20260902/TAIMS_20260902.zip" "$RUNNER_TEMP/r0cache/TAIMS.zip" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$ROOT_DRIVE/99_manifests/seoul_p1c_line_aware_crosswalk_20260903.json" "$RUNNER_TEMP/r0cache/p1c.json" --config "$C" --retries 6 --low-level-retries 15 --transfers 1

      - name: Build reusable lossless city-day cohort cache
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"
          python -m py_compile scripts/mppd_g0_full_network_coverage_20260904.py scripts/mppd_r0_city_day_cache_20260904.py
          /usr/bin/time -v python scripts/mppd_r0_city_day_cache_20260904.py \
            --taims "$RUNNER_TEMP/r0cache/TAIMS.zip" \
            --p1c "$RUNNER_TEMP/r0cache/p1c.json" \
            --out "$RUNNER_TEMP/r0cache/out" \
            2>&1 | tee "$RUNNER_TEMP/r0cache/out/r0_cache_execution.log"

      - name: Persist city-day cache
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.prep.outputs.config_file }}
          REMOTE_NAME: ${{ steps.prep.outputs.remote_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r0cache/out"
          test -f seoul_20260829_0700_1000_afc_time_cohorts.csv.gz
          for f in *; do
            rclone copyto "$f" "$REMOTE_NAME:$OUT_DRIVE/$f" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          done
          rclone lsf "$REMOTE_NAME:$OUT_DRIVE" --config "$CONFIG_FILE" | sort

      - name: Clean protected configuration
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.prep.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then
            shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"
          fi

name: MPPD R1 Hangzhou Passenger-Aware Operating Repair Frontier 2026-09-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mppd-r1-hz-operating-repair-frontier-20260907.yml'
      - 'scripts/mppd_r1_hz_operating_authority.py'
      - 'scripts/mppd_r1_hz_operating_audit.py'
      - 'scripts/mppd_r1_hz_operating_repair_frontier.py'
      - 'scripts/mppd_r1_hz_count_free_passenger_coverage.py'
      - 'tests/test_mppd_r1_hz_operating_repair_frontier.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mppd-r1-hz-operating-repair-frontier-20260907
  cancel-in-progress: false

env:
  GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
  SOURCE_DRIVE: rail_transit/CN_HZ_Tianchi_2019/r1_count_free_service_v2_2019-01-04_20260906
  DOMAIN_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_full_service_day_domain_20260905
  ROUTE_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_r1b_2019-01-04_20260905
  BASELINE_PASSENGER_DRIVE: rail_transit/CN_HZ_Tianchi_2019/r1_count_free_passenger_feedback_2019-01-04_20260906
  OUT_DRIVE: rail_transit/CN_HZ_Tianchi_2019/r1_joint_rebuild_2019-01-04_20260906/operating_repair_frontier_v1
  SHARD_COUNT: '8'
  LABELS: 'pw_0p0 pw_0p5 pw_1p0 pw_2p0 pw_4p0'

jobs:
  unit-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile and test exact weighted repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet scipy pytest
          python -m py_compile scripts/mppd_r1_hz_operating_repair_frontier.py
          PYTHONPATH="$PWD" python -m pytest -q tests/test_mppd_r1_hz_operating_repair_frontier.py

  prepare-frontier:
    needs: unit-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install solver and storage client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet scipy
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          mkdir -p "$RUNNER_TEMP/r1frontier/input" "$RUNNER_TEMP/r1frontier/out"
      - name: Fetch exact 1841 service world and its passenger feedback
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/rclone.conf"; umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          echo "config_file=$C" >> "$GITHUB_OUTPUT"; echo "remote_name=$R" >> "$GITHUB_OUTPUT"
          cd "$RUNNER_TEMP/r1frontier/input"
          rclone copyto "$R:$SOURCE_DRIVE/HZ_2019-01-04_R1_COUNT_FREE_SERVICE_DISCOVERY_V2.json" services.json --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$BASELINE_PASSENGER_DRIVE/HZ_2019-01-04_R1_COUNT_FREE_PASSENGER_FEEDBACK.json" passenger.json --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          python - <<'PY'
          import json
          s=json.load(open('services.json',encoding='utf-8')); p=json.load(open('passenger.json',encoding='utf-8'))
          assert s['inferred_service_trajectory_count']==1841
          assert p['count_free_service_trajectory_count']==1841
          assert abs(p['resolved_share']-0.4963105933229201)<1e-12
          assert isinstance(p['trajectory_assignment_mass'],dict)
          PY
      - name: Solve full-day passenger-aware structural frontier
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python "$GITHUB_WORKSPACE/scripts/mppd_r1_hz_operating_repair_frontier.py" \
            --services "$RUNNER_TEMP/r1frontier/input/services.json" \
            --passenger-feedback "$RUNNER_TEMP/r1frontier/input/passenger.json" \
            --output-dir "$RUNNER_TEMP/r1frontier/out" \
            --weights 0 0.5 1 2 4
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'r1frontier/out/frontier.json'
          x=json.loads(p.read_text(encoding='utf-8'))
          assert len(x['candidates'])==5
          assert all(r['remaining_headway_conflicts']==0 for r in x['candidates'])
          print(json.dumps([{'label':r['label'],'N':r['service_count_after'],'removed':r['removed_service_count'],'removed_assignment_share':r['removed_assignment_mass_share']} for r in x['candidates']],ensure_ascii=False,indent=2))
          PY
      - name: Persist and upload frontier service worlds
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
          REMOTE_NAME: ${{ steps.storage.outputs.remote_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r1frontier/out"
          for F in *.json; do rclone copyto "$F" "$REMOTE_NAME:$OUT_DRIVE/structural/$F" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15 --transfers 1; done
      - uses: actions/upload-artifact@v4
        with:
          name: hz-r1-operating-repair-frontier-worlds
          path: ${{ runner.temp }}/r1frontier/out/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Clean protected configuration
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"; fi

  passenger-shard:
    needs: prepare-frontier
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install passenger runtime and storage client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pyarrow
          sudo apt-get update -qq; sudo apt-get install -y -qq rclone
          mkdir -p "$RUNNER_TEMP/r1frontier_pass/worlds" "$RUNNER_TEMP/r1frontier_pass/out"
      - uses: actions/download-artifact@v5
        with:
          name: hz-r1-operating-repair-frontier-worlds
          path: ${{ runner.temp }}/r1frontier_pass/worlds
      - name: Fetch cohorts and route support
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/rclone.conf"; umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          echo "config_file=$C" >> "$GITHUB_OUTPUT"
          cd "$RUNNER_TEMP/r1frontier_pass"
          rclone copyto "$R:$DOMAIN_DRIVE/cohorts/2019-01-04.journey_cohorts.parquet" cohorts.parquet --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$ROUTE_DRIVE/expanded_route_support_k32.json" routes.json --config "$C" --retries 6 --low-level-retries 15 --transfers 1
      - name: Re-evaluate every frontier world on this passenger shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r1frontier_pass"
          for LABEL in $LABELS; do
            PYTHONPATH="$GITHUB_WORKSPACE" python "$GITHUB_WORKSPACE/scripts/mppd_r1_hz_count_free_passenger_coverage.py" shard \
              --cohorts cohorts.parquet --routes routes.json --services "worlds/services_${LABEL}.json" \
              --shard-index "$SHARD" --shard-count "$SHARD_COUNT" --output "out/${LABEL}_shard_${SHARD}.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-passenger-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/r1frontier_pass/out/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Clean protected configuration
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"; fi

  merge-frontier:
    needs: passenger-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install merge runtime and storage client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pyarrow
          sudo apt-get update -qq; sudo apt-get install -y -qq rclone
          mkdir -p "$RUNNER_TEMP/r1frontier_merge/all" "$RUNNER_TEMP/r1frontier_merge/worlds" "$RUNNER_TEMP/r1frontier_merge/out"
      - uses: actions/download-artifact@v5
        with:
          pattern: frontier-passenger-shard-*
          path: ${{ runner.temp }}/r1frontier_merge/all
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          name: hz-r1-operating-repair-frontier-worlds
          path: ${{ runner.temp }}/r1frontier_merge/worlds
      - name: Merge all five passenger worlds and build frontier manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r1frontier_merge"
          for LABEL in $LABELS; do
            mkdir -p "tmp_$LABEL"
            cp all/${LABEL}_shard_*.json "tmp_$LABEL/"
            for F in tmp_$LABEL/${LABEL}_shard_*.json; do B=$(basename "$F"); mv "$F" "tmp_$LABEL/${B#${LABEL}_}"; done
            PYTHONPATH="$GITHUB_WORKSPACE" python "$GITHUB_WORKSPACE/scripts/mppd_r1_hz_count_free_passenger_coverage.py" merge --input-dir "tmp_$LABEL" --output "out/passenger_${LABEL}.json"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'r1frontier_merge'
          structural=json.loads((root/'worlds/frontier.json').read_text(encoding='utf-8'))
          by_label={r['label']:r for r in structural['candidates']}
          rows=[]
          baseline=0.4963105933229201
          for label in os.environ['LABELS'].split():
            p=json.loads((root/f'out/passenger_{label}.json').read_text(encoding='utf-8'))
            s=by_label[label]
            rows.append({
              'label':label,'passenger_weight':s['passenger_weight'],'service_count':s['service_count_after'],
              'removed_service_count':s['removed_service_count'],'removed_assignment_mass_share':s['removed_assignment_mass_share'],
              'resolved_mass':p['resolved_mass'],'resolved_share':p['resolved_share'],'resolved_share_change_vs_1841':p['resolved_share']-baseline,
              'failure_mass':p['failure_mass'],'remaining_headway_conflicts':s['remaining_headway_conflicts'],
              'direction_balance':s['direction_balance_after'],
            })
          manifest={
            'schema':'mppd.r1-hz-passenger-aware-operating-repair-frontier-result.v1',
            'status':'PASSENGER_AWARE_OPERATING_REPAIR_FRONTIER_REEVALUATED_NO_FINAL_N_SELECTED',
            'git_sha':os.environ['GITHUB_SHA'],'baseline_service_count':1841,'baseline_resolved_share':baseline,
            'candidates':rows,
            'semantics':{'planned_timetable_used':False,'all_candidates_headway_legal':True,'depot_boundary_resolution_applied':False,'candidate_world_is_final_r1':False},
          }
          (root/'out/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - name: Persist frontier comparison
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/rclone.conf"; umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          echo "config_file=$C" >> "$GITHUB_OUTPUT"
          cd "$RUNNER_TEMP/r1frontier_merge/out"
          for F in *.json; do rclone copyto "$F" "$R:$OUT_DRIVE/passenger/$F" --config "$C" --retries 6 --low-level-retries 15 --transfers 1; done
      - uses: actions/upload-artifact@v4
        with:
          name: hz-r1-passenger-aware-operating-repair-frontier-final
          path: ${{ runner.temp }}/r1frontier_merge/out/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Clean protected configuration
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"; fi

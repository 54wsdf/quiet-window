name: MPPD R1 Joint Reconstruction Contract

on:
  push:
    branches: [main]
    paths:
      - 'scripts/mppd_r1_joint_reconstruction_validate.py'
      - 'scripts/mppd_r1_hz_joint_full_day.py'
      - 'scripts/mppd_r1_hz_joint_service_projection.py'
      - 'scripts/mppd_r1_hz_event_level_joint.py'
      - 'scripts/mppd_r1_hz_clean_joint.py'
      - 'scripts/mppd_r1_hz_clean_projected.py'
      - 'scripts/mppd_r1_hz_projected_event_merge.py'
      - 'scripts/mppd_r1_hz_fast_projected.py'
      - 'tests/test_mppd_r1_joint_reconstruction_validate.py'
      - '.github/workflows/mppd-r1-joint-reconstruction-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install solver runtime
        run: python -m pip install --disable-pip-version-check --quiet numpy pyarrow
      - name: Compile R1 code
        run: |
          python -m py_compile scripts/mppd_r1_joint_reconstruction_validate.py
          python -m py_compile scripts/mppd_r1_hz_joint_full_day.py
          python -m py_compile scripts/mppd_r1_hz_joint_service_projection.py
          python -m py_compile scripts/mppd_r1_hz_event_level_joint.py
          python -m py_compile scripts/mppd_r1_hz_clean_joint.py
          python -m py_compile scripts/mppd_r1_hz_clean_projected.py
          python -m py_compile scripts/mppd_r1_hz_projected_event_merge.py
          python -m py_compile scripts/mppd_r1_hz_fast_projected.py
      - name: Run deterministic validator self-test
        run: python scripts/mppd_r1_joint_reconstruction_validate.py self-test
      - name: Run scientific gate tests
        run: python tests/test_mppd_r1_joint_reconstruction_validate.py
      - name: Exercise canonical CLI with independent authority
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          p=Path('scripts/mppd_r1_joint_reconstruction_validate.py')
          spec=importlib.util.spec_from_file_location('r1v',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          Path('/tmp/r1_joint_fixture.json').write_text(json.dumps(m.fixture()),encoding='utf-8')
          Path('/tmp/r1_authority.json').write_text(json.dumps(m.authority_fixture()),encoding='utf-8')
          PY
          python scripts/mppd_r1_joint_reconstruction_validate.py validate --input /tmp/r1_joint_fixture.json --authority /tmp/r1_authority.json --out /tmp/r1_joint_report.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/r1_joint_report.json',encoding='utf-8'))
          assert x['status']=='QUALIFIED_R1_JOINT_RECONSTRUCTION'
          assert all(x['qualification_gates'].values())
          print(json.dumps(x,ensure_ascii=False,indent=2))
          PY

name: MPPD R1 RTTP Bridge Contract Qualification 2026-09-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mppd-r1-rttp-provider-qualification-20260907.yml'
      - 'scripts/mppd_r1_rttp_bridge.py'
      - 'scripts/mppd_r1_rttp_projection.py'
      - 'scripts/mppd_r1_joint_model.py'
      - 'scripts/mppd_r1_hz_network_authority.py'
      - 'tests/test_mppd_r1_rttp_bridge.py'
      - 'tests/test_mppd_r1_rttp_bridge_hardening.py'
      - 'tests/test_mppd_r1_rttp_projection.py'
      - 'contracts/MPPD_R1_RTTP_PROVIDER_LOCK.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  RTTP_REPOSITORY: 54wsdf/rail-transit-timetable-platform
  RTTP_PROVIDER_SHA: d812bb9a55a6c8763effb05e07b3a77309f0da5b
  RTTP_PROVIDER_CONTRACT: rttp.mppd-r1-provider.v0.2

jobs:
  bridge-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout MPPD R1
        uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify exact provider lock agreement
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python - <<'PY'
          import json
          from pathlib import Path
          from scripts.mppd_r1_rttp_bridge import provider_lock

          code = provider_lock()
          disk = json.loads(Path('contracts/MPPD_R1_RTTP_PROVIDER_LOCK.json').read_text(encoding='utf-8'))['provider']
          assert code['repository'] == disk['repository'] == '54wsdf/rail-transit-timetable-platform'
          assert code['commit_sha'] == disk['commit_sha'] == 'd812bb9a55a6c8763effb05e07b3a77309f0da5b'
          assert code['provider_contract'] == disk['contract_version'] == 'rttp.mppd-r1-provider.v0.2'
          assert len(code['commit_sha']) == 40
          assert 'circulation_trip_bounds_use_first_departure_and_last_arrival' in disk['qualified_source_features']
          PY

      - name: Compile and test the fail-closed bridge
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pytest
          python -m py_compile \
            scripts/mppd_r1_rttp_bridge.py \
            scripts/mppd_r1_rttp_projection.py \
            scripts/mppd_r1_joint_model.py \
            tests/test_mppd_r1_rttp_bridge.py \
            tests/test_mppd_r1_rttp_bridge_hardening.py \
            tests/test_mppd_r1_rttp_projection.py
          PYTHONPATH="$PWD" python -m pytest -q \
            tests/test_mppd_r1_rttp_bridge.py \
            tests/test_mppd_r1_rttp_bridge_hardening.py \
            tests/test_mppd_r1_rttp_projection.py

      - name: Exercise real Hangzhou network authority to portable RTTP substrate payload
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python - <<'PY'
          from scripts.mppd_r1_hz_network_authority import build_authority
          from scripts.mppd_r1_rttp_bridge import (
              RTTP_PROVIDER_CONTRACT,
              RTTP_PROVIDER_SHA,
              network_authority_to_provider_payload,
          )

          authority = build_authority({
              'status': 'QUALIFIED_LINE_AWARE_ROUTE_SUPPORT',
              'route_support': {},
          })
          payload = network_authority_to_provider_payload(
              authority,
              network_authority_ref='quiet-window:network-authority:bridge-qualification',
          )
          assert len(payload['routes']) == 8
          assert payload['provider_contract'] == RTTP_PROVIDER_CONTRACT
          assert payload['semantics']['canonical_timetable_materialized'] is False
          assert payload['semantics']['service_pattern_materialized'] is False
          assert payload['semantics']['service_instance_count_materialized'] is False
          assert payload['semantics']['physical_route_structure_only'] is True
          assert payload['metadata']['planned_absolute_times_used'] is False
          assert payload['metadata']['planned_trip_count_used'] is False
          assert payload['metadata']['planned_trip_ids_used'] is False
          print({
              'status': 'R1_RTTP_BRIDGE_CONTRACT_PASS',
              'provider_sha_lock': RTTP_PROVIDER_SHA,
              'provider_runtime_qualified_here': False,
              'provider_runtime_boundary': 'RTTP_SOURCE_NOT_ACCESSIBLE_TO_QUIET_WINDOW_GITHUB_TOKEN',
              'route_structures': len(payload['routes']),
          })
          PY
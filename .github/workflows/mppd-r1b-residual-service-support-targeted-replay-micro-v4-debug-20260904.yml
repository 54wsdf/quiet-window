name: MPPD R1B Residual Service Support Targeted Replay Micro V4 Debug 2026-09-04

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/mppd_r1b_residual_service_support_targeted_replay_20260904.py
      - .github/workflows/mppd-r1b-residual-service-support-targeted-replay-micro-v4-debug-20260904.yml

permissions:
  contents: read

jobs:
  targeted-replay-micro-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      SEOUL_ROOT: ResearchData/rail_transit/metro_transfer_afc_ats_bridge/20260903/seoul
      ROUTE_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904/r0_full_network_route_ensemble_g0h_gtxa
      G1E_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904/g1e_corrected_service_recompletion
      R1B_V4_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904/r1b_g1e_residual_record_micro_v4
      OUT_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904/r1b_residual_service_support_targeted_replay_micro_v4_debug
    steps:
      - name: Checkout execution code
        uses: actions/checkout@v4
      - name: Restore micro residual authority
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GDRIVE_CONFIG_B64:-}" || exit 3
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          python -m pip install --disable-pip-version-check --quiet networkx scipy numpy
          C="$RUNNER_TEMP/rclone.conf"; umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          echo "config_file=$C" >> "$GITHUB_OUTPUT"; echo "remote_name=$R" >> "$GITHUB_OUTPUT"
          ROOT="$RUNNER_TEMP/r1b_targeted_micro"; mkdir -p "$ROOT/out" "$ROOT/classify"
          rclone copyto "$R:$SEOUL_ROOT/99_manifests/seoul_p1c_line_aware_crosswalk_20260903.json" "$ROOT/p1c.json" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$ROUTE_DRIVE/r0_full_network_route_ensemble_candidates.jsonl.gz" "$ROOT/routes.jsonl.gz" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$G1E_DRIVE/seoul_20260829_0700_1000_service_state_initialization_v4_corrected_recompletion.json" "$ROOT/service_g1e.json" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$R1B_V4_DRIVE/r1b_first_bidirectional_joint_update_smoke_summary.json" "$ROOT/r1b_v4_summary.json" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$R1B_V4_DRIVE/r1b_weighted_failure_residual_cohorts_e1.jsonl.gz" "$ROOT/residual_e1.jsonl.gz" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
      - name: Replay micro residuals
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/r1b_targeted_micro"
          python -m py_compile scripts/mppd_r1b_residual_service_support_targeted_replay_20260904.py scripts/mppd_r1b_missing_service_support_proposal_audit_20260904.py
          python -m scripts.mppd_r1b_residual_service_support_targeted_replay_20260904 \
            --p1c "$ROOT/p1c.json" --routes "$ROOT/routes.jsonl.gz" --service-init "$ROOT/service_g1e.json" --r1b-summary "$ROOT/r1b_v4_summary.json" --residual-cohorts "$ROOT/residual_e1.jsonl.gz" \
            --topology-patch manifests/mppd_seoul_topology_patch_g0e_20260904.json --gtxa-overlay manifests/mppd_seoul_gtxa_crosswalk_overlay_g0h_20260904.json --beam 6 --max-skip 2 --out "$ROOT/out" | tee "$ROOT/out/targeted_replay_micro.log"
          python -m scripts.mppd_r1b_missing_service_support_proposal_audit_20260904 \
            --p1c "$ROOT/p1c.json" --service-init "$ROOT/service_g1e.json" --r1b-summary "$ROOT/r1b_v4_summary.json" \
            --topology-patch manifests/mppd_seoul_topology_patch_g0e_20260904.json --gtxa-overlay manifests/mppd_seoul_gtxa_crosswalk_overlay_g0h_20260904.json --nearby-edges 3 --out "$ROOT/classify" | tee "$ROOT/out/classifier_micro.log"
          cp "$ROOT/classify/r1b_missing_service_support_proposal_audit_summary.json" "$ROOT/out/direction_aware_support_classification.json"
          python - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'r1b_targeted_micro'/'out'
          r=json.loads((out/'r1b_residual_service_support_targeted_replay_summary.json').read_text())
          c=json.loads((out/'direction_aware_support_classification.json').read_text())
          cons=r['replay_consistency']
          assert abs(float(cons['failure_mass_conservation_error']))<=1e-6,cons
          assert float(cons['finite_candidate_recovered_mass'])==0.0,cons
          assert float(cons['weighted_mean_failure_reason_probability_l1'])<=1e-9,cons
          cmap={x['line']+'|'+x['origin']+'|'+x['destination']:x for x in c.get('top_segments',[])}
          joined=[]; tiers={}
          for x in r.get('top_missing_segments',[]):
              cc=cmap.get(x['segment'],{}); cl=cc.get('classification','NOT_CLASSIFIED')
              if cl in ('DIRECTION_COMPATIBLE_EXISTING_ROOT_INTERIOR_HOLE_CANDIDATE','DIRECTION_COMPATIBLE_ROOT_VARIANT_FRAGMENTATION_CANDIDATE','DIRECTION_COMPATIBLE_NEAR_EXISTING_ROOT_EXTENSION_CANDIDATE'): tier='EXISTING_ROOT_SUPPORT_PROPOSAL_AUDIT_ELIGIBLE'
              elif cl=='VIABLE_SUPPORT_ALREADY_PRESENT_CONTRADICTION_AUDIT': tier='IMPLEMENTATION_OR_DEDUP_CONTRADICTION_AUDIT'
              elif cl=='OPPOSITE_DIRECTION_SUPPORT_ONLY': tier='SAME_DIRECTION_SUPPORT_EVIDENCE_REQUIRED'
              elif cl in ('NO_DIRECTION_COMPATIBLE_ROOT_SUPPORT','NO_NEARBY_EXISTING_ROOT_SUPPORT'): tier='STRICT_NEW_LATENT_ROOT_GATE'
              else: tier='UNCLASSIFIED_REQUIRES_DEEPER_AUDIT'
              y={**x,'direction_aware_classification':cl,'proposal_tier':tier}; joined.append(y); tiers[tier]=tiers.get(tier,0.0)+float(x['pressure_mass'])
          result={'schema':'mppd.r1b-targeted-replay-micro-debug.v1','date':'2026-09-04','status':'R1B_TARGETED_REPLAY_MICRO_DEBUG_COMPLETED','replay_consistency':cons,'proposal_tier_pressure':tiers,'segments':joined,'no_email_notification_logic':True}
          (out/'targeted_replay_micro_debug_join.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          cd "$ROOT/out"; find . -maxdepth 1 -type f ! -name output_sha256.txt -print0 | sort -z | xargs -0 sha256sum > output_sha256.txt
      - name: Persist micro replay debug outputs
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.prep.outputs.config_file }}
          REMOTE_NAME: ${{ steps.prep.outputs.remote_name }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/r1b_targeted_micro/out"
          for f in "$ROOT"/*; do test -s "$f"; rclone copyto "$f" "$REMOTE_NAME:$OUT_DRIVE/$(basename "$f")" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15 --transfers 1; done
      - name: Clean protected configuration
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.prep.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"; fi

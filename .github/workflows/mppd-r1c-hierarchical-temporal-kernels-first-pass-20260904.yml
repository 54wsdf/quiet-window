name: MPPD R1C Hierarchical Temporal Kernels First Pass 2026-09-04

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/mppd_r1c_hierarchical_temporal_kernels_first_pass_20260904.py
      - .github/workflows/mppd-r1c-hierarchical-temporal-kernels-first-pass-20260904.yml

permissions:
  contents: read

jobs:
  r1c-hierarchical-temporal-kernels-first-pass:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      SEOUL_ROOT: ResearchData/rail_transit/metro_transfer_afc_ats_bridge/20260903/seoul
      BASE_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904
      ROUTE_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904/r0_full_network_route_ensemble_g0h_gtxa
      G1F_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904/g1f_observed_event_preserving_recompletion
      OUT_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904/r1c_hierarchical_temporal_kernels_first_pass
    steps:
      - name: Checkout execution code
        uses: actions/checkout@v4
      - name: Restore exact paired G1F substrate
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GDRIVE_CONFIG_B64:-}" || exit 3
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          python -m pip install --disable-pip-version-check --quiet networkx scipy numpy
          C="$RUNNER_TEMP/rclone.conf"; umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          echo "config_file=$C" >> "$GITHUB_OUTPUT"; echo "remote_name=$R" >> "$GITHUB_OUTPUT"
          ROOT="$RUNNER_TEMP/r1c"; mkdir -p "$ROOT/out"
          rclone copyto "$R:$SEOUL_ROOT/99_manifests/seoul_p1c_line_aware_crosswalk_20260903.json" "$ROOT/p1c.json" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$BASE_DRIVE/g0h_gtxa_corrected_cohort_rebuild/seoul_20260829_0700_1000_afc_time_cohorts_g0h.csv.gz" "$ROOT/cohorts.csv.gz" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$ROUTE_DRIVE/r0_full_network_route_ensemble_candidates.jsonl.gz" "$ROOT/routes.jsonl.gz" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$G1F_DRIVE/seoul_20260829_0700_1000_service_state_initialization_v5_observed_event_preserving_recompletion.json" "$ROOT/service_g1f.json" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          cd "$ROOT"; sha256sum p1c.json cohorts.csv.gz routes.jsonl.gz service_g1f.json > input_sha256.txt
      - name: Run R1C first hierarchical pass
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/r1c"
          python -m py_compile scripts/mppd_r1c_hierarchical_temporal_kernels_first_pass_20260904.py
          /usr/bin/time -v python -m scripts.mppd_r1c_hierarchical_temporal_kernels_first_pass_20260904 \
            --p1c "$ROOT/p1c.json" --cohorts "$ROOT/cohorts.csv.gz" --routes "$ROOT/routes.jsonl.gz" --service-init "$ROOT/service_g1f.json" \
            --topology-patch manifests/mppd_seoul_topology_patch_g0e_20260904.json --gtxa-overlay manifests/mppd_seoul_gtxa_crosswalk_overlay_g0h_20260904.json \
            --sample-mod 50 --beam 8 --max-skip 2 --min-service-usage 25 --out "$ROOT/out" \
            2>&1 | tee "$ROOT/out/r1c_hierarchical_temporal_kernels_first_pass_execution.log"
          cp "$ROOT/input_sha256.txt" "$ROOT/out/input_sha256.txt"
          python - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'r1c'/'out'
          p=out/'r1b_first_bidirectional_joint_update_smoke_summary.json'
          s=json.loads(p.read_text())
          assert s['schema']=='mppd.r1c-hierarchical-temporal-kernels-first-pass.v1'
          assert s['status']=='R1C_FIRST_FORMAL_HIERARCHICAL_TEMPORAL_KERNEL_PASS_COMPLETED'
          assert int(s['scope']['sample_mod'])==50
          assert int(s['scope']['sample_cohort_count'])==11061
          assert abs(float(s['scope']['sample_passenger_mass'])-12457.0)<=1e-9
          assert s['inputs']['service_schema']=='mppd.city-day-service-state-initialization.v5-observed-event-preserving-corrected-recompletion'
          assert s['inputs']['service_manifest']['observed_event_preservation_global_pass'] is True
          for phase in ('E0_passenger_posterior','E1_passenger_posterior'):
              assert s['iteration'][phase]['failure_mass_conservation_pass'] is True
          assert all(s['r1b_minimum_gate'].values())
          h=s['iteration']['M_kernel_update']['diagnostics']['r1c_hierarchy']
          assert int(h['access_context_count']) > 0, h
          assert int(h['egress_context_count']) > 0, h
          assert int(h['transfer_movement_count']) > 0, h
          manifest={'schema':'mppd.r1c-hierarchical-temporal-kernels-first-pass-execution-manifest.v1','date':'2026-09-04','status':'R1C_FIRST_FORMAL_HIERARCHICAL_PASS_COMPLETED','execution_sha':os.environ.get('GITHUB_SHA'),'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),'scope':s['scope'],'hierarchy':h,'E0':s['iteration']['E0_passenger_posterior'],'E1':s['iteration']['E1_passenger_posterior'],'redistribution':s['iteration']['posterior_redistribution'],'r1b_minimum_gate':s['r1b_minimum_gate'],'output_files':{},'scientific_boundary':['First formal R1C K=1 hierarchical pass on deterministic 1-of-50 full-network-domain sample, not final multi-day kernel authority.','No service support is added; G1F service support and unresolved residuals remain explicit.','A/E K=1 is a first-pass simplification only; all kernel objects remain mixture-capable.','Transfer K=1 remains movement-conditioned and mixture-capable; component selection requires later held-out qualification.'],'no_email_notification_logic':True}
          for f in sorted(out.iterdir()):
              if f.is_file() and f.name!='execution_manifest.json': manifest['output_files'][f.name]={'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()}
          (out/'execution_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          print(json.dumps({'hierarchy':h,'E0':manifest['E0'],'E1':manifest['E1'],'redistribution':manifest['redistribution']},ensure_ascii=False,indent=2))
          PY
          cd "$ROOT/out"; find . -maxdepth 1 -type f ! -name output_sha256.txt -print0 | sort -z | xargs -0 sha256sum > output_sha256.txt
          cat r1b_first_bidirectional_joint_update_smoke_summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Persist R1C outputs
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.prep.outputs.config_file }}
          REMOTE_NAME: ${{ steps.prep.outputs.remote_name }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/r1c/out"
          for f in "$ROOT"/*; do test -s "$f"; rclone copyto "$f" "$REMOTE_NAME:$OUT_DRIVE/$(basename "$f")" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15 --transfers 1; done
          rclone lsf "$REMOTE_NAME:$OUT_DRIVE" --config "$CONFIG_FILE" | sort
      - name: Clean protected configuration
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.prep.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"; fi

name: MPPD R1C Proxy Filtered Context Aware Consistency 2026-09-05

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/mppd_r1c_proxy_filtered_context_aware_consistency_20260905.py
      - .github/workflows/mppd-r1c-proxy-filtered-context-aware-consistency-20260905.yml

permissions:
  contents: read

jobs:
  r1c-proxy-filtered-context-aware-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      SEOUL_ROOT: ResearchData/rail_transit/metro_transfer_afc_ats_bridge/20260903/seoul
      BASE_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904
      ROUTE_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904/r0_full_network_route_ensemble_g0h_gtxa
      G1F_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904/g1f_observed_event_preserving_recompletion
      OUT_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904/r1c_proxy_filtered_context_aware_consistency
    steps:
      - name: Checkout execution code
        uses: actions/checkout@v4
      - name: Restore exact paired G1F substrate
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GDRIVE_CONFIG_B64:-}" || exit 3
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          python -m pip install --disable-pip-version-check --quiet networkx scipy numpy
          C="$RUNNER_TEMP/rclone.conf"; umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          echo "config_file=$C" >> "$GITHUB_OUTPUT"; echo "remote_name=$R" >> "$GITHUB_OUTPUT"
          ROOT="$RUNNER_TEMP/r1c_proxy_filtered"; mkdir -p "$ROOT/out"
          rclone copyto "$R:$SEOUL_ROOT/99_manifests/seoul_p1c_line_aware_crosswalk_20260903.json" "$ROOT/p1c.json" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$BASE_DRIVE/g0h_gtxa_corrected_cohort_rebuild/seoul_20260829_0700_1000_afc_time_cohorts_g0h.csv.gz" "$ROOT/cohorts.csv.gz" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$ROUTE_DRIVE/r0_full_network_route_ensemble_candidates.jsonl.gz" "$ROOT/routes.jsonl.gz" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$G1F_DRIVE/seoul_20260829_0700_1000_service_state_initialization_v5_observed_event_preserving_recompletion.json" "$ROOT/service_g1f.json" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          cd "$ROOT"; sha256sum p1c.json cohorts.csv.gz routes.jsonl.gz service_g1f.json > input_sha256.txt
      - name: Run exact paired defect-correction qualification
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/r1c_proxy_filtered"
          python -m py_compile scripts/mppd_r1c_proxy_filtered_context_aware_consistency_20260905.py
          /usr/bin/time -v python -m scripts.mppd_r1c_proxy_filtered_context_aware_consistency_20260905 \
            --p1c "$ROOT/p1c.json" --cohorts "$ROOT/cohorts.csv.gz" --routes "$ROOT/routes.jsonl.gz" --service-init "$ROOT/service_g1f.json" \
            --topology-patch manifests/mppd_seoul_topology_patch_g0e_20260904.json --gtxa-overlay manifests/mppd_seoul_gtxa_crosswalk_overlay_g0h_20260904.json \
            --sample-mod 50 --beam 8 --max-skip 2 --min-service-usage 25 --out "$ROOT/out" \
            2>&1 | tee "$ROOT/out/execution.log"
          cp "$ROOT/input_sha256.txt" "$ROOT/out/input_sha256.txt"
          python - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'r1c_proxy_filtered'/'out'
          s=json.loads((out/'r1b_first_bidirectional_joint_update_smoke_summary.json').read_text())
          assert s['schema']=='mppd.r1c-hierarchical-temporal-kernels.v3-proxy-filtered-context-aware-offsets'
          assert int(s['scope']['sample_mod'])==50 and int(s['scope']['sample_cohort_count'])==11061 and abs(float(s['scope']['sample_passenger_mass'])-12457.0)<1e-9
          assert s['inputs']['service_manifest']['observed_event_preservation_global_pass'] is True
          assert all(s['r1b_minimum_gate'].values())
          assert s['iteration']['E0_passenger_posterior']['failure_mass_conservation_pass'] and s['iteration']['E1_passenger_posterior']['failure_mass_conservation_pass']
          pf=s['iteration']['M_kernel_update']['diagnostics']['station_only_egress_proxy_filter']
          assert pf['excluded_factor_count'] > 0 and pf['excluded_posterior_weight'] > 0
          assert s['r1c_design']['station_only_proxy_in_egress_kernel_fit'] is False
          manifest={'schema':'mppd.r1c-proxy-filtered-context-aware-consistency-execution-manifest.v1','date':'2026-09-05','status':'R1C_PROXY_FILTERED_CONTEXT_AWARE_CONSISTENCY_COMPLETED','execution_sha':os.environ.get('GITHUB_SHA'),'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),'proxy_filter':pf,'E0':s['iteration']['E0_passenger_posterior'],'E1':s['iteration']['E1_passenger_posterior'],'kernels':s['iteration']['M_kernel_update']['kernels_after'],'service_timing':s['iteration']['M_service_timing_update'],'redistribution':s['iteration']['posterior_redistribution'],'r1b_minimum_gate':s['r1b_minimum_gate'],'performance':s['performance'],'output_files':{},'no_email_notification_logic':True}
          for p in sorted(out.iterdir()):
              if p.is_file() and p.name!='execution_manifest.json': manifest['output_files'][p.name]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'execution_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          print(json.dumps({'proxy_filter':pf,'E1':manifest['E1'],'global_egress':manifest['kernels']['egress'],'service_timing':{'root_count_with_offset_decision':manifest['service_timing']['root_count_with_offset_decision'],'moved_root_count':manifest['service_timing']['moved_root_count'],'moved_event_count':manifest['service_timing']['moved_event_count']},'redistribution':manifest['redistribution']},ensure_ascii=False,indent=2))
          PY
          cd "$ROOT/out"; find . -maxdepth 1 -type f ! -name output_sha256.txt -print0 | sort -z | xargs -0 sha256sum > output_sha256.txt
      - name: Persist corrected authority candidate
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.prep.outputs.config_file }}
          REMOTE_NAME: ${{ steps.prep.outputs.remote_name }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/r1c_proxy_filtered/out"
          for f in "$ROOT"/*; do test -s "$f"; rclone copyto "$f" "$REMOTE_NAME:$OUT_DRIVE/$(basename "$f")" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15 --transfers 1; done
          rclone lsf "$REMOTE_NAME:$OUT_DRIVE" --config "$CONFIG_FILE" | sort
      - name: Clean protected configuration
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.prep.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"; fi

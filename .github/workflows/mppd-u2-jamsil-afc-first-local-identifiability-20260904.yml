name: MPPD U2 Jamsil AFC-First Local Identifiability 2026-09-04

on:
  push:
    paths:
      - '.github/workflows/mppd-u2-jamsil-afc-first-local-identifiability-20260904.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identifiability:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      ROOT_DRIVE: ResearchData/rail_transit/metro_transfer_afc_ats_bridge/20260903/seoul
      OUT_DRIVE: ResearchData/rail_transit/mppd_core_closure_20260904/u2_jamsil_afc_first_local_identifiability
    outputs:
      n: ${{ steps.run.outputs.n }}
      win: ${{ steps.run.outputs.win }}
      tie: ${{ steps.run.outputs.tie }}
      loss: ${{ steps.run.outputs.loss }}
      base_med: ${{ steps.run.outputs.base_med }}
      afc_med: ${{ steps.run.outputs.afc_med }}
      afc_p90: ${{ steps.run.outputs.afc_p90 }}
      zero: ${{ steps.run.outputs.zero }}
      near60: ${{ steps.run.outputs.near60 }}
      near120: ${{ steps.run.outputs.near120 }}

    steps:
      - name: Restore strict AFC cohort and partial service anchors
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone jq
          C="$RUNNER_TEMP/rclone.conf"; umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          echo "config_file=$C" >> "$GITHUB_OUTPUT"; echo "remote_name=$R" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/u2id/out"; cd "$RUNNER_TEMP/u2id"
          rclone copyto "$R:$ROOT_DRIVE/passenger/20260902/TAIMS_20260902.zip" TAIMS.zip --config "$C" --retries 6 --low-level-retries 15
          rclone copyto "$R:$ROOT_DRIVE/99_manifests/seoul_p1c_line_aware_crosswalk_20260903.json" p1c.json --config "$C" --retries 6 --low-level-retries 15
          rclone copyto "$R:$ROOT_DRIVE/processed/service_events/20260829/am_fresh_service_event_candidates_0700_1000.csv" paired.csv --config "$C" --retries 6 --low-level-retries 15

      - name: Build AFC-first local passenger-support surfaces
        id: run
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/u2id"
          python - <<'PY'
          import csv,io,json,math,os as osmod,statistics,zipfile
          from collections import Counter,defaultdict
          from datetime import datetime,timedelta
          from pathlib import Path

          IN_LINE='1008';OUT_LINE='1002';IN_TRANSFER='1008000814';OUT_TRANSFER='1002000216'
          RAIL={'201','202','203','204','205','206','208','209','210','231','232','235','236','237','290'};STRICT={'A_TRANSFER_CODE_LINE_NAME','B_UNIQUE_NAME','C_NAME_PREFIX_LINE'}
          START=datetime(2026,8,29,7);ENTRY_END=datetime(2026,8,29,8,30);TARGET_START=datetime(2026,8,29,7,20);TARGET_END=datetime(2026,8,29,9,30)
          SHIFTS=list(range(-300,301,30));AMAX=(1200,2700);KMIN=(158,240);EMAX=(300,600,900);OUT=Path('out')
          def detect(raw):
              for e in ('utf-8-sig','utf-8','cp949','euc-kr'):
                  try:raw.decode(e);return e
                  except UnicodeDecodeError:pass
              return 'cp949'
          def zr(z,n):
              f=z.open(n);h=f.read(262144);f.close();e=detect(h);return io.TextIOWrapper(z.open(n),encoding=e,errors='replace',newline='')
          def z4(s):
              d=''.join(ch for ch in str(s or '') if ch.isdigit());return d.zfill(4) if d and len(d)<=4 else (d[-4:] if d else '')
          def dt(v):
              d=''.join(ch for ch in str(v or '') if ch.isdigit())
              try:return datetime.strptime(d[:14],'%Y%m%d%H%M%S') if len(d)>=14 else None
              except:return None
          def med(v):return statistics.median(v) if v else None
          def q(v,p):
              if not v:return None
              b=sorted(v);return b[round((len(b)-1)*p)]

          p1c=json.loads(Path('p1c.json').read_text());cw={x['out_stn_num']:x for x in p1c['canonical_entries'] if x.get('tier') in STRICT}
          trains=defaultdict(lambda:defaultdict(list))
          with open('paired.csv',encoding='utf-8',newline='') as f:
              for row in csv.DictReader(f):
                  line=(row.get('subway_id') or '').strip()
                  if line not in {IN_LINE,OUT_LINE}:continue
                  tr=(row.get('btrain_no') or '').strip();st=(row.get('statn_id') or '').strip();a=dt(row.get('arrival_detect_time'));d=dt(row.get('departure_detect_time'))
                  if tr and st and a and d:trains[(line,tr)][st].append((a,d))
          for k in trains:
              for st in trains[k]:trains[k][st]=sorted(set(trains[k][st]))

          inbound=defaultdict(list)
          for (line,tr),sts in trains.items():
              if line!=IN_LINE or IN_TRANSFER not in sts:continue
              for ia,idp in sts[IN_TRANSFER]:
                  for os,evs in sts.items():
                      if os==IN_TRANSFER:continue
                      prior=[(oa,od) for oa,od in evs if od<ia and 0<(ia-od).total_seconds()<=7200]
                      if prior:
                          oa,od=max(prior,key=lambda x:x[1]);inbound[os].append((od,ia,tr))
          for os in inbound:inbound[os]=sorted(set(inbound[os]))

          out_train={};by_sig=defaultdict(list)
          for (line,tr),sts in trains.items():
              if line!=OUT_LINE or OUT_TRANSFER not in sts:continue
              deps=[d for a,d in sts[OUT_TRANSFER]]
              if not deps:continue
              dep=min(deps);down=[]
              for ds,evs in sts.items():
                  if ds==OUT_TRANSFER:continue
                  aft=[a for a,d in evs if a>dep and 0<(a-dep).total_seconds()<=7200]
                  if aft:down.append((min(aft),ds))
              down.sort()
              if not down:continue
              sig=down[0][1];runtime={ds:(a-dep).total_seconds() for a,ds in down};out_train[tr]={'dep':dep,'sig':sig,'runtime':runtime};by_sig[sig].append((dep,tr))
          for sig in by_sig:by_sig[sig].sort()

          passengers=[]
          with zipfile.ZipFile('TAIMS.zip') as z:
              f=zr(z,'VW_KSCC_DX_CARD.csv');r=csv.DictReader(f)
              for row in r:
                  if (row.get('TRNS_MNS_CD') or '').strip() not in RAIL:continue
                  a=cw.get(z4(row.get('RIDE_BSST_ID')));b=cw.get(z4(row.get('ALGH_BSST_ID')))
                  if not a or not b or a.get('service_subway_id')!=IN_LINE or b.get('service_subway_id')!=OUT_LINE:continue
                  t0=dt(row.get('RIDE_DTM'));t1=dt(row.get('ALGH_DTM'));os=a.get('service_statn_id');ds=b.get('service_statn_id')
                  if not t0 or not t1 or not os or not ds or not (START<=t0<ENTRY_END) or t1<t0 or (t1-t0).total_seconds()>10800:continue
                  if os in inbound:passengers.append((t0,t1,os,ds))
              f.close()

          params=[(A,K,E) for A in AMAX for K in KMIN for E in EMAX]
          rows=[]
          for sig,seq in by_sig.items():
              if len(seq)<4:continue
              for i in range(1,len(seq)-1):
                  true_dep,tr=seq[i]
                  if not (TARGET_START<=true_dep<TARGET_END):continue
                  visible=[(d,t) for d,t in seq if t!=tr]
                  prev_dep=max(d for d,t in visible if d<true_dep) if any(d<true_dep for d,t in visible) else None
                  next_dep=min(d for d,t in visible if d>true_dep) if any(d>true_dep for d,t in visible) else None
                  if prev_dep is None or next_dep is None:continue
                  midpoint=prev_dep+(next_dep-prev_dep)/2
                  rtpool=defaultdict(list)
                  for _,otr in visible:
                      for ds,rt in out_train[otr]['runtime'].items():rtpool[ds].append(rt)
                  rtmed={ds:statistics.median(v) for ds,v in rtpool.items() if len(v)>=2}
                  if len(rtmed)<3:continue
                  relevant=[p for p in passengers if p[3] in rtmed]
                  if len(relevant)<20:continue

                  combo_scores={par:[] for par in params}
                  for shift in SHIFTS:
                      cdep=true_dep+timedelta(seconds=shift)
                      for A,K,E in params:
                          support=0
                          for t0,t1,os,ds in relevant:
                              carr=cdep+timedelta(seconds=rtmed[ds])
                              if carr>t1+timedelta(seconds=59) or (t1-carr).total_seconds()>E:continue
                              inc=[x for x in inbound[os] if t0<=x[0]<=t0+timedelta(seconds=A)]
                              if not inc:continue
                              passenger_support=False
                              for idep,iarr,itr in inc:
                                  ready=iarr+timedelta(seconds=K)
                                  if cdep<ready:continue
                                  earlier=[d for d,otr in visible if ready<=d<cdep]
                                  if earlier:continue
                                  passenger_support=True;break
                              if passenger_support:support+=1
                          combo_scores[(A,K,E)].append(support)

                  robust=[]
                  for j,shift in enumerate(SHIFTS):
                      vals=[]
                      for par,scores in combo_scores.items():
                          lo=min(scores);hi=max(scores);vals.append(0.0 if hi==lo else (scores[j]-lo)/(hi-lo))
                      robust.append(sum(vals)/len(vals))
                  best=max(robust);best_shifts=[s for s,v in zip(SHIFTS,robust) if abs(v-best)<1e-12];best_shift=min(best_shifts,key=abs)
                  afc_err=abs(best_shift);base_err=abs((midpoint-true_dep).total_seconds())
                  true_score=robust[SHIFTS.index(0)];rank=1+sum(v>true_score+1e-12 for v in robust)
                  flat=max(robust)-min(robust)<1e-9
                  rows.append({'train':tr,'direction_signature':sig,'true_departure':true_dep.isoformat(),'visible_prev':prev_dep.isoformat(),'visible_next':next_dep.isoformat(),'midpoint_error_sec':base_err,'afc_robust_best_shift_sec':best_shift,'afc_robust_abs_error_sec':afc_err,'true_shift_robust_score':true_score,'true_shift_rank_of_21':rank,'robust_curve_range':max(robust)-min(robust),'flat_curve':flat,'relevant_passengers':len(relevant),'runtime_destinations':len(rtmed),'outcome':'WIN' if afc_err<base_err else ('LOSS' if afc_err>base_err else 'TIE')})

          wins=sum(x['outcome']=='WIN' for x in rows);ties=sum(x['outcome']=='TIE' for x in rows);losses=sum(x['outcome']=='LOSS' for x in rows);errs=[x['afc_robust_abs_error_sec'] for x in rows];base=[x['midpoint_error_sec'] for x in rows]
          result={'schema':'mppd.u2-jamsil-afc-first-local-identifiability.v1','date':'2026-09-04','status':'AFC_FIRST_LOCAL_IDENTIFIABILITY_DIAGNOSTIC_COMPLETED','target_count':len(rows),'wins_vs_midpoint':wins,'ties_vs_midpoint':ties,'losses_vs_midpoint':losses,'midpoint_error_sec':{'median':med(base),'p90':q(base,.9),'max':max(base) if base else None},'afc_robust_peak_error_sec':{'median':med(errs),'p90':q(errs,.9),'max':max(errs) if errs else None,'within60_share':sum(e<=60 for e in errs)/len(errs) if errs else None,'within120_share':sum(e<=120 for e in errs)/len(errs) if errs else None},'flat_curve_count':sum(x['flat_curve'] for x in rows),'targets':rows,'parameter_family':{'access_max_sec':list(AMAX),'transfer_min_sec':list(KMIN),'egress_max_sec':list(EMAX),'candidate_shift_sec':SHIFTS},'scientific_boundary':['This is a local identifiability diagnostic: the ±300 s evaluation window is centered on the held target truth, so it is not a deployable free-search estimator.','No BMS-fixed complete passenger chain is required. Line-8 direct events are partial upstream anchors; other Line-2 trains provide visible service gates and a leave-one running-time template.','The target Line-2 departure is used only to define the local evaluation coordinate and compute final error; passenger support at each candidate does not read the target time.','Movement parameters are broad feasibility families rather than fitted point estimates.','No raw card identifiers are persisted.'],'next_gate':'If AFC-first robust support peaks consistently near truth and beats midpoint, convert the local surface into a gap-bounded hidden-service estimator with fold-specific kernel calibration. If not, transfer passenger evidence is not yet sufficiently identifying under current partial-anchor semantics.'}
          (OUT/'u2_jamsil_afc_first_local_identifiability_summary.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          with open(osmod.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"n={len(rows)}\nwin={wins}\ntie={ties}\nloss={losses}\nbase_med={med(base) if base else 0}\nafc_med={med(errs) if errs else 0}\nafc_p90={q(errs,.9) if errs else 0}\nzero={sum(x['flat_curve'] for x in rows)}\nnear60={sum(e<=60 for e in errs)/len(errs) if errs else 0}\nnear120={sum(e<=120 for e in errs)/len(errs) if errs else 0}\n")
          print(json.dumps({k:v for k,v in result.items() if k!='targets'},ensure_ascii=False,indent=2))
          PY

      - name: Persist diagnostic result
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.prep.outputs.config_file }}
          REMOTE_NAME: ${{ steps.prep.outputs.remote_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/u2id/out"
          for f in *; do rclone copyto "$f" "$REMOTE_NAME:$OUT_DRIVE/$f" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15; done
          rclone lsf "$REMOTE_NAME:$OUT_DRIVE" --config "$CONFIG_FILE" | sort

      - name: Clean protected config
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.prep.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"; fi

  summary:
    needs: identifiability
    runs-on: ubuntu-24.04
    name: "U2ID n=${{ needs.identifiability.outputs.n }} W/T/L=${{ needs.identifiability.outputs.win }}/${{ needs.identifiability.outputs.tie }}/${{ needs.identifiability.outputs.loss }} midpointMed=${{ needs.identifiability.outputs.base_med }} afcMed=${{ needs.identifiability.outputs.afc_med }} afcP90=${{ needs.identifiability.outputs.afc_p90 }} within60=${{ needs.identifiability.outputs.near60 }} within120=${{ needs.identifiability.outputs.near120 }} flat=${{ needs.identifiability.outputs.zero }}"
    steps:
      - run: echo u2-identifiability-summary
name: OpenCity M02 Tempe Count Column Debug 20260908

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/opencity-m02-tempe-count-column-debug-20260908.yml'

permissions:
  contents: read

jobs:
  debug-columns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check --quiet pandas python-calamine
      - name: Inspect full 20-column Tempe count tables
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,tempfile,time,urllib.parse,urllib.request
          from pathlib import Path
          import pandas as pd
          base='https://gis.tempe.gov/traffic-counts/folders/0_On_Continental%20Dr_From_College_To_McAllister/'
          files=[
            'Vol10_0_continental%20btwn%20college%20&%20mcallister(ebwb).xlsx',
            'Vol16_0%20Continental%20Dr%20btwn%20College%20Ave%20and%20McAllister%20Ave%20(ebwb).xlsx',
          ]
          tmp=Path(tempfile.mkdtemp())
          def cv(v):
              try:
                  if pd.isna(v): return None
              except Exception: pass
              if hasattr(v,'isoformat'):
                  try:return v.isoformat()
                  except Exception:pass
              return str(v)
          for encoded in files:
              url=base+encoded; dest=tmp/urllib.parse.unquote(encoded).replace('/','_')
              req=urllib.request.Request(url,headers={'User-Agent':'OpenCity-Organizer-Reproducibility/2.0'})
              with urllib.request.urlopen(req,timeout=90) as r: dest.write_bytes(r.read())
              print('\nFILE',dest.name)
              xl=pd.ExcelFile(dest,engine='calamine')
              for sheet in xl.sheet_names:
                  df=pd.read_excel(dest,sheet_name=sheet,header=None,engine='calamine')
                  print('SHEET',sheet,'SHAPE',df.shape)
                  for i in list(range(0,10))+list(range(30,43))+list(range(54,62)):
                      if i>=len(df): continue
                      row=[cv(v) for v in df.iloc[i,:20].tolist()]
                      print(f'R{i:02d}',json.dumps(row,ensure_ascii=False))
                  for col in (1,2,18,19):
                      vals=[]
                      for i in range(6,min(54,len(df))):
                          try:
                              v=float(df.iloc[i,col])
                              if pd.notna(v): vals.append(v)
                          except Exception: pass
                      print('COL',col,'N',len(vals),'SUM',sum(vals),'HEAD',vals[:8],'AM06_09',sum(vals[24:36]) if len(vals)>=36 else None)
          PY

name: OpenCity M02 Tempe History Link Discovery 20260908

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/opencity-m02-tempe-history-link-discovery-20260908.yml'

permissions:
  contents: read

jobs:
  discover-history-link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect ArcGIS popup template and probe historical-count folders
        shell: bash
        env:
          ITEM_ID: 40ffc90766394604a11206e2369e74d9
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          import urllib.error

          UA='OpenCity-Organizer-Reproducibility/2.0'
          item_id = os.environ['ITEM_ID']

          def get_bytes(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.status, r.geturl(), r.headers.get('Content-Type',''), r.read()

          def get_json(url):
              return json.loads(get_bytes(url)[3].decode('utf-8'))

          meta = get_json(f'https://www.arcgis.com/sharing/rest/content/items/{item_id}?f=json')
          data = get_json(f'https://www.arcgis.com/sharing/rest/content/items/{item_id}/data?f=json')
          print('ITEM_META')
          print(json.dumps({k: meta.get(k) for k in ['id','title','type','owner','created','modified','access']}, indent=2))

          template=None
          layer_url=None
          for layer in data.get('operationalLayers', []):
              if layer.get('title') == 'Traffic Count Segments':
                  layer_url=layer.get('url')
                  popup=layer.get('popupInfo') or {}
                  text=(popup.get('description') or '')
                  m=re.search(r"href=['\"]([^'\"]*traffic-counts/folders/[^'\"]+)['\"]", text, re.I)
                  if m: template=html.unescape(m.group(1))
                  print('POPUP_TEMPLATE=', template)
                  print('LAYER_URL=', layer_url)

          if not template or not layer_url:
              raise SystemExit('MISSING_POPUP_TEMPLATE_OR_LAYER')

          q=urllib.parse.urlencode({
              'where':'StreetNode IS NOT NULL',
              'outFields':'OBJECTID,StreetNode,StreetOn,StreetFrom,StreetTo,CaptureDate,DirectionFirst,DirectionSecond',
              'returnGeometry':'false',
              'orderByFields':'StreetNode ASC',
              'resultRecordCount':'12',
              'f':'json'
          })
          features=get_json(layer_url + '/query?' + q).get('features',[])
          if not features:
              raise SystemExit('NO_FEATURES')

          href_re=re.compile(r'href=["\']([^"\']+)["\']', re.I)
          ok=0
          for feat in features:
              a=feat.get('attributes') or {}
              rendered=template
              for field in ('StreetNode','StreetOn','StreetFrom','StreetTo'):
                  value=a.get(field)
                  if field=='StreetNode' and isinstance(value,float) and value.is_integer(): value=int(value)
                  rendered=rendered.replace('{'+field+'}', '' if value is None else str(value))
              # Quote only the folder-name path component while retaining scheme/host/path separators.
              prefix='https://gis.tempe.gov/traffic-counts/folders/'
              folder=rendered[len(prefix):] if rendered.startswith(prefix) else rendered.rsplit('/',1)[-1]
              url=prefix + urllib.parse.quote(folder, safe='_-.()')
              print('\nPROBE_FEATURE')
              print(json.dumps(a,ensure_ascii=False,indent=2))
              print('FOLDER_URL=',url)
              try:
                  status, final_url, ctype, body=get_bytes(url)
                  ok += 1
                  print('HTTP_STATUS=',status)
                  print('FINAL_URL=',final_url)
                  print('CONTENT_TYPE=',ctype)
                  print('BODY_BYTES=',len(body))
                  text=body[:200000].decode('utf-8',errors='replace')
                  hrefs=href_re.findall(text)
                  print('HREF_COUNT=',len(hrefs))
                  for h in hrefs[:30]: print('HREF=',html.unescape(h))
                  print('BODY_PREFIX=',text[:3000].replace('\n',' '))
              except urllib.error.HTTPError as e:
                  print('HTTP_ERROR=',e.code,e.reason)
              except Exception as e:
                  print('FETCH_ERROR=',type(e).__name__,str(e))

          print('\nSUCCESSFUL_FOLDER_PROBES=',ok)
          if ok == 0:
              raise SystemExit('NO_HISTORICAL_FOLDER_RESPONDED')
          PY

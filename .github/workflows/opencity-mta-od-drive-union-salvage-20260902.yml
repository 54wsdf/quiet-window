name: OpenCity MTA OD Drive union salvage 20260902

on:
  workflow_run:
    workflows: ["Public registry backfill 20260902"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencity-mta-od-drive-union-salvage-20260902
  cancel-in-progress: false

env:
  GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
  CANONICAL_OD_FOLDER_ID: 1KhB316vUHPTEtwdWPN4138TttTW67jGO

jobs:
  salvage:
    # Automatic invocation is bound to the already-running deterministic acquisition.
    # workflow_dispatch remains available for an idempotent retry of Drive consolidation.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.id == 33615833576 }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Configure fixed Drive transport
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GDRIVE_CONFIG_B64:-}" || { echo 'GDRIVE_RCLONE_CONFIG_B64 missing'; exit 3; }
          python -m pip install --disable-pip-version-check requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          CFG="$RUNNER_TEMP/rclone.conf"
          umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$CFG"
          REMOTE_NAME="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$CFG")"
          test -n "$REMOTE_NAME"
          echo "config=$CFG" >> "$GITHUB_OUTPUT"
          echo "remote=$REMOTE_NAME" >> "$GITHUB_OUTPUT"

      - name: Union all observed shard folders by Drive folder ID
        shell: bash
        env:
          CFG: ${{ steps.storage.outputs.config }}
          R: ${{ steps.storage.outputs.remote }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/mta_od_union_salvage"
          mkdir -p "$OUT"
          python opencity_exec/mta_od_drive_union_salvage_20260902.py \
            --config "$CFG" \
            --remote "$R" \
            --source-folder-id 1DEamJPCebt6rIhhW3Qpivxh_DG4cTMut \
            --source-folder-id 1E359BirG1whXGaRgCYEGhoSslaReMEe5 \
            --source-folder-id 12jzAigIsi5q5OUUuz0MlMuhUFpimtYzu \
            --source-folder-id 1mFq1mCUDB-RRpG2VoSFt8syxWGGDoOjI \
            --source-folder-id 130kSsP6Zfe0naibmgYloRUv5BP0Z8849 \
            --dest-folder-id "$CANONICAL_OD_FOLDER_ID" \
            --output "$OUT"
          test -s "$OUT/ACQUIRED_MANIFEST.json"
          python - "$OUT/ACQUIRED_MANIFEST.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['state']=='ACQUIRED'
          assert d['source_row_count']==72639113
          assert d['ordering_contract']=='$order=:id'
          assert d['expected_chunks']==1453 and d['actual_chunks']==1453
          assert len(d['parts'])==1453
          assert sum(x['rows'] for x in d['parts'])==72639113
          assert [x['index'] for x in d['parts']]==list(range(1453))
          assert all(len(x['sha256'])==64 for x in d['parts'])
          print('OD_UNION_ACQUIRED')
          PY

      - name: Emit canonical closure coordinates
        shell: bash
        run: |
          echo "MTA OD canonical folder id: $CANONICAL_OD_FOLDER_ID"
          echo "Dataset: 28vm-gjqr"
          echo "Rows: 72,639,113"
          echo "Chunks: 1,453 x 50k (last partial)"
          echo 'Ordering: $order=:id'

      - name: Cleanup credential material
        if: always()
        shell: bash
        env:
          CFG: ${{ steps.storage.outputs.config }}
        run: |
          if [[ -n "${CFG:-}" && -f "$CFG" ]]; then
            shred -u "$CFG" 2>/dev/null || rm -f "$CFG"
          fi

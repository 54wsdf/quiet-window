name: OpenCity MTA OD resume preflight 20260902

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/opencity-mta-od-resume-preflight-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
  ROOT: transport_challenges/OpenCity_Traffic_Challenge_2026
  DATASET_ID: 28vm-gjqr
  CHUNK: '100000'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Configure Drive transport
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GDRIVE_CONFIG_B64:-}" || { echo 'GDRIVE_RCLONE_CONFIG_B64 missing'; exit 3; }
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone jq
          python -m pip install --disable-pip-version-check requests
          CFG="$RUNNER_TEMP/rclone.conf"; umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$CFG"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$CFG")"; test -n "$R"
          echo "config=$CFG" >> "$GITHUB_OUTPUT"; echo "remote=$R" >> "$GITHUB_OUTPUT"

      - name: Inventory existing OD parts and copy terminal part
        id: parts
        shell: bash
        env:
          CFG: ${{ steps.storage.outputs.config }}
          R: ${{ steps.storage.outputs.remote }}
        run: |
          set -euo pipefail
          PART_DIR="$ROOT/01_public_reference_data/US_NY_MTA/04_demand_od/subway_od_2026/parts"
          rclone lsf "$R:$PART_DIR" --config "$CFG" --files-only --include '28vm-gjqr.part-*.csv' | sort > "$RUNNER_TEMP/parts.txt"
          python - "$RUNNER_TEMP/parts.txt" "$GITHUB_OUTPUT" <<'PY'
          import re,sys
          p,out=sys.argv[1:]
          names=[x.strip() for x in open(p) if x.strip()]
          rx=re.compile(r'^28vm-gjqr\.part-(\d{5})\.csv$')
          idx=[]
          for n in names:
              m=rx.match(n)
              if not m: continue
              idx.append(int(m.group(1)))
          if not idx: raise SystemExit('no OD parts found')
          idx=sorted(set(idx)); missing=sorted(set(range(idx[-1]+1))-set(idx))
          if missing: raise SystemExit('multipart gap(s): '+','.join(map(str,missing[:50])))
          if idx[0]!=0: raise SystemExit(f'first part is {idx[0]}, expected 0')
          with open(out,'a') as f:
              f.write(f'max_index={idx[-1]}\npart_count={len(idx)}\nlatest=28vm-gjqr.part-{idx[-1]:05d}.csv\n')
          print({'part_count':len(idx),'max_index':idx[-1],'missing':0})
          PY
          LATEST="28vm-gjqr.part-$(printf '%05d' '${{ steps.parts.outputs.max_index }}').csv"
          rclone copyto "$R:$PART_DIR/$LATEST" "$RUNNER_TEMP/$LATEST" --config "$CFG" --retries 5 --low-level-retries 10
          test -s "$RUNNER_TEMP/$LATEST"

      - name: Compare existing terminal part against current official Socrata ordering
        id: compat
        shell: bash
        env:
          MAX_INDEX: ${{ steps.parts.outputs.max_index }}
          PART_COUNT: ${{ steps.parts.outputs.part_count }}
          LATEST: ${{ steps.parts.outputs.latest }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/$LATEST" "$RUNNER_TEMP/preflight.json" "$GITHUB_OUTPUT" <<'PY'
          import csv,datetime,hashlib,json,os,sys
          from pathlib import Path
          import requests
          latest=Path(sys.argv[1]); report=Path(sys.argv[2]); ghout=sys.argv[3]
          dataset='28vm-gjqr'; chunk=100000; max_index=int(os.environ['MAX_INDEX']); offset=max_index*chunk
          base=f'https://data.ny.gov/resource/{dataset}'
          s=requests.Session(); s.headers['User-Agent']='OpenCity-MTA-OD-resume-preflight/20260902'
          cnt=s.get(base+'.json',params={'$select':'count(*)'},timeout=120); cnt.raise_for_status(); total=int(cnt.json()[0]['count'])
          meta=s.get(f'https://data.ny.gov/api/views/{dataset}',timeout=120); meta.raise_for_status(); metadata=meta.json()
          with latest.open(newline='',encoding='utf-8-sig') as f:
              r=csv.DictReader(f); header=r.fieldnames or []; first=next(r); n=1; last=first
              for row in r: last=row; n+=1
          if n!=chunk: raise SystemExit(f'latest stored part row count {n}, expected {chunk}')
          scalar=[x for x in header if x not in {'origin_point','destination_point'}]
          def live_row(off):
              q=s.get(base+'.json',params={'$limit':1,'$offset':off},timeout=180); q.raise_for_status(); a=q.json()
              if len(a)!=1: raise SystemExit(f'live row missing at offset {off}')
              return a[0]
          lf=live_row(offset); ll=live_row(offset+chunk-1)
          def mism(stored,live):
              return {k:{'stored':stored.get(k),'live':live.get(k)} for k in scalar if str(stored.get(k,''))!=str(live.get(k,''))}
          mf=mism(first,lf); ml=mism(last,ll)
          compatible=(not mf and not ml)
          sha=hashlib.sha256(latest.read_bytes()).hexdigest()
          rep={
            'state':'COMPATIBLE' if compatible else 'INCOMPATIBLE',
            'evidence_class':'public_data registry / official public source',
            'provider':'MTA Open Data via data.ny.gov Socrata',
            'dataset_id':dataset,
            'source_resource_url':base+'.csv',
            'source_metadata_url':f'https://data.ny.gov/api/views/{dataset}',
            'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'existing_part_count':int(os.environ['PART_COUNT']),'max_existing_part_index':max_index,
            'latest_part':latest.name,'latest_part_rows':n,'latest_part_bytes':latest.stat().st_size,'latest_part_sha256':sha,
            'latest_part_offset_start':offset,'latest_part_offset_end':offset+chunk-1,
            'live_total_rows':total,
            'live_metadata':{k:metadata.get(k) for k in ['id','name','rowsUpdatedAt','dataUpdatedAt','metadataUpdatedAt','publicationDate']},
            'scalar_fields_compared':scalar,'first_row_mismatches':mf,'last_row_mismatches':ml,
            'resume_next_index':max_index+1,'resume_next_offset':(max_index+1)*chunk,
            'resume_allowed':compatible and total>(max_index+1)*chunk,
            'terminal_or_count_check': total <= (max_index+1)*chunk
          }
          report.write_text(json.dumps(rep,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(rep,indent=2))
          with open(ghout,'a') as f:
              f.write(f"compatible={'true' if compatible else 'false'}\nlive_total={total}\n")
          if not compatible: raise SystemExit('existing multipart natural-order contract no longer matches current live Socrata resource')
          PY

      - name: Persist preflight record to canonical OD parent
        if: always()
        shell: bash
        env:
          CFG: ${{ steps.storage.outputs.config }}
          R: ${{ steps.storage.outputs.remote }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/preflight.json" || exit 0
          DEST="$ROOT/01_public_reference_data/US_NY_MTA/04_demand_od/subway_od_2026/MTA_OD_RESUME_PREFLIGHT_20260902.json"
          rclone copyto "$RUNNER_TEMP/preflight.json" "$R:$DEST" --config "$CFG" --retries 5 --low-level-retries 10

      - name: Cleanup credential material
        if: always()
        shell: bash
        env:
          CFG: ${{ steps.storage.outputs.config }}
        run: |
          if [[ -n "${CFG:-}" && -f "$CFG" ]]; then shred -u "$CFG" 2>/dev/null || rm -f "$CFG"; fi

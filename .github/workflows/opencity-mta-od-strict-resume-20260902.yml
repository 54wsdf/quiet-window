name: OpenCity MTA OD strict resume 20260902

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/opencity-mta-od-strict-resume-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

# This workflow is intentionally superseded by the already-running canonical
# deterministic acquisition run 33615833576.  Keeping the same concurrency
# group with cancel-in-progress=true causes this no-op run to stop the duplicate
# legacy-resume run that was accidentally launched after the canonical run.
concurrency:
  group: opencity-mta-od-strict-resume-20260902
  cancel-in-progress: true

jobs:
  superseded:
    runs-on: ubuntu-latest
    steps:
      - name: Do not duplicate the canonical MTA OD acquisition
        run: |
          echo 'SUPERSEDED: canonical active OD acquisition is quiet-window run 33615833576.'
          echo 'The legacy 562-part chain remains continuity-validated evidence only.'

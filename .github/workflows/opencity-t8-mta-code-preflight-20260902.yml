name: OpenCity T8 MTA code preflight 20260902

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/opencity-t8-mta-code-preflight-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch canonical T8 source and print immutable interface
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/54wsdf/knowledge-hub/main/domains/academic-research/projects/open-city-traffic-challenge-rehearsal/code/t8_mta_public_registry.py'
          curl -fL --retry 5 "$URL" -o /tmp/t8_mta_public_registry.py
          echo "CANONICAL_URL=$URL"
          echo "CANONICAL_SHA256=$(sha256sum /tmp/t8_mta_public_registry.py | awk '{print $1}')"
          python -m pip install --disable-pip-version-check numpy pandas
          echo '__HELP_BEGIN__'
          python /tmp/t8_mta_public_registry.py --help
          echo '__HELP_END__'

name: Public Resource Snapshot

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: Snapshot artifact name
        required: true
        type: string
      sources:
        description: Semicolon-separated filename|https-url entries
        required: true
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download public resources and calculate checksums
        shell: bash
        env:
          INPUT_SOURCES: ${{ inputs.sources }}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, re, sys, urllib.request, urllib.parse
          root = pathlib.Path("payload")
          root.mkdir(exist_ok=True)
          report = {"retrieved_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(), "files": [], "errors": []}
          entries = [x.strip() for x in os.environ.get("INPUT_SOURCES", "").split(";") if x.strip()]
          if not 1 <= len(entries) <= 25:
              raise SystemExit("Expected 1-25 source entries")
          for entry in entries:
              try:
                  name, url = entry.split("|", 1)
                  name, url = name.strip(), url.strip()
                  if not re.fullmatch(r"[A-Za-z0-9_.-]+", name) or name.startswith(".") or ".." in name:
                      raise ValueError("Invalid file name")
                  parsed = urllib.parse.urlparse(url)
                  if parsed.scheme != "https" or not parsed.hostname:
                      raise ValueError("Only public HTTPS URLs are supported")
                  target = root / name
                  req = urllib.request.Request(url, headers={"User-Agent": "PublicResourceSnapshot/1.0"})
                  h, size = hashlib.sha256(), 0
                  with urllib.request.urlopen(req, timeout=120) as response, target.open("wb") as fout:
                      for block in iter(lambda: response.read(1024 * 1024), b""):
                          size += len(block)
                          if size > 600_000_000:
                              raise ValueError("File exceeds 600MB bound")
                          h.update(block)
                          fout.write(block)
                  report["files"].append({"filename": name, "source_url": url, "bytes": size, "sha256": h.hexdigest()})
                  print("ACQUIRED", name, size, h.hexdigest())
              except Exception as ex:
                  report["errors"].append({"source": entry[:200], "error": str(ex)[:300]})
                  print("FAILED", entry[:120], str(ex)[:200])
                  if "target" in locals() and target.exists():
                      target.unlink()
          (root / "manifest.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          if not report["files"]:
              sys.exit("No files downloaded")
          PY
      - name: Upload immutable snapshot bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: payload/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

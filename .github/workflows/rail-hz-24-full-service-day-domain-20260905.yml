name: Rail HZ 24 Complete Full-Service-Day Domain 2026-09-05

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rail-hz-24-full-service-day-domain-20260905.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rail-hz-24-full-service-day-domain-20260905
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      AFC_SOURCE_DRIVE: rail_transit/CN_HZ_Tianchi_2019/raw_afc_gzip
      OUT_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_full_service_day_domain_20260905

    steps:
      - name: Checkout worker code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate worker and install runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/rail_hz_full_service_day_cohorts_20260905.py
          python -m pip install --disable-pip-version-check --quiet pandas pyarrow
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Restore protected storage configuration
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GDRIVE_CONFIG_B64:-}" || { echo 'Missing GDRIVE_RCLONE_CONFIG_B64' >&2; exit 3; }
          C="$RUNNER_TEMP/rclone.conf"
          umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"
          test -n "$R"
          echo "config_file=$C" >> "$GITHUB_OUTPUT"
          echo "remote_name=$R" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/hz24/cohorts" "$RUNNER_TEMP/hz24/summaries"

      - name: Build 24 complete 04:00-to-04:00 service days with all consecutive journeys
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
          REMOTE_NAME: ${{ steps.storage.outputs.remote_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hz24"
          rclone copyto "$REMOTE_NAME:$AFC_SOURCE_DRIVE/record_2019-01-01.csv.gz" current.csv.gz --config "$CONFIG_FILE" --retries 6 --low-level-retries 15 --transfers 1
          for d in $(seq -w 1 24); do
            n=$(printf '%02d' $((10#$d + 1)))
            rclone copyto "$REMOTE_NAME:$AFC_SOURCE_DRIVE/record_2019-01-$n.csv.gz" next.csv.gz --config "$CONFIG_FILE" --retries 6 --low-level-retries 15 --transfers 1
            date="2019-01-$d"
            echo "building complete full service day $date [04:00,next 04:00)"
            python "$GITHUB_WORKSPACE/scripts/rail_hz_full_service_day_cohorts_20260905.py" day \
              --current current.csv.gz \
              --next-file next.csv.gz \
              --service-date "$date" \
              --cohorts-output "cohorts/$date.journey_cohorts.parquet" \
              --summary-output "summaries/$date.service_day_summary.json"
            mv next.csv.gz current.csv.gz
          done
          rm -f current.csv.gz
          test "$(find summaries -maxdepth 1 -name '*.service_day_summary.json' | wc -l)" -eq 24
          test "$(find cohorts -maxdepth 1 -name '*.journey_cohorts.parquet' | wc -l)" -eq 24

      - name: Aggregate formal full-service-day passenger domain
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hz24"
          python "$GITHUB_WORKSPACE/scripts/rail_hz_full_service_day_cohorts_20260905.py" aggregate \
            --summary-dir summaries \
            --output HZ24_FULL_SERVICE_DAY_PASSENGER_DOMAIN_SUMMARY_20260905.json

      - name: Persist privacy-safe cohort factors and summaries
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
          REMOTE_NAME: ${{ steps.storage.outputs.remote_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hz24"
          rclone copy HZ24_FULL_SERVICE_DAY_PASSENGER_DOMAIN_SUMMARY_20260905.json "$REMOTE_NAME:$OUT_DRIVE" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          rclone copy summaries "$REMOTE_NAME:$OUT_DRIVE/summaries" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          rclone copy cohorts "$REMOTE_NAME:$OUT_DRIVE/cohorts" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15 --transfers 4
          echo 'persisted formal service-day products:'
          rclone lsf "$REMOTE_NAME:$OUT_DRIVE" --config "$CONFIG_FILE" --recursive --files-only | sort | tail -n 60

      - name: Clean protected configuration
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then
            shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"
          fi

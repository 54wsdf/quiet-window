name: Rail HZ 25-Day Service Field Init 2026-09-05

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rail-hz-25day-service-field-init-20260905
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      AFC_SOURCE_DRIVE: rail_transit/CN_HZ_Tianchi_2019/raw_afc_gzip
      STATIC_SOURCE_DRIVE: rail_transit/CN_HZ_Tianchi_2019/timetable_topology_aux
      SUBSTRATE_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_cityday_substrate_20260905
      OUT_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_service_field_init_20260905

    steps:
      - name: Checkout worker code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate worker and install runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/rail_hz_daily_service_field_init_20260905.py
          python -m py_compile scripts/rail_hz_service_root_completion_20260905.py
          python -m pip install --disable-pip-version-check --quiet numpy openpyxl
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          rclone version | head -n 2

      - name: Restore protected durable-storage configuration
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GDRIVE_CONFIG_B64:-}" || { echo 'Missing GDRIVE_RCLONE_CONFIG_B64' >&2; exit 3; }
          CONFIG_FILE="$RUNNER_TEMP/rclone.conf"
          umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$CONFIG_FILE"
          REMOTE_NAME="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$CONFIG_FILE")"
          test -n "$REMOTE_NAME"
          echo "config_file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"
          echo "remote_name=$REMOTE_NAME" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/hz_service/days"

      - name: Require qualified 25-day city-day substrate
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
          REMOTE_NAME: ${{ steps.storage.outputs.remote_name }}
        run: |
          set -euo pipefail
          rclone copyto "$REMOTE_NAME:$SUBSTRATE_DRIVE/HZ25_CITYDAY_SUBSTRATE_SUMMARY_20260905.json" "$RUNNER_TEMP/hz_service/substrate_summary.json" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'hz_service/substrate_summary.json'
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['status']=='QUALIFIED_HZ25_CITY_DAY_SUBSTRATE', x['status']
          assert x['coverage']['days']==25
          assert x['scope_invariants']['peak_window_filter'] is False
          assert x['scope_invariants']['line_filter'] is False
          assert x['scope_invariants']['passenger_subsample'] is False
          print('qualified city-day substrate confirmed')
          PY

      - name: Build relative line-direction service priors
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
          REMOTE_NAME: ${{ steps.storage.outputs.remote_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hz_service"
          rclone copyto "$REMOTE_NAME:$STATIC_SOURCE_DRIVE/Train Timetable.xlsx" 'Train Timetable.xlsx' --config "$CONFIG_FILE" --retries 6 --low-level-retries 15 --transfers 1
          python "$GITHUB_WORKSPACE/scripts/rail_hz_daily_service_field_init_20260905.py" prior \
            --timetable 'Train Timetable.xlsx' \
            --output relative_service_prior.json
          rm -f 'Train Timetable.xlsx'
          python - <<'PY'
          import json
          x=json.load(open('relative_service_prior.json',encoding='utf-8'))
          expected={'B_main:Down','B_main:Up','B_branch:Down','B_branch:Up','C_main:Down','C_main:Up','A_main:Down','A_main:Up'}
          present={k for k,v in x['path_sequence_counts'].items() if v>0}
          missing=sorted(expected-present)
          if missing: raise SystemExit(f'missing full-route structural sequences: {missing}')
          edges=x['edges']; missing_edges=[e for e in edges if e['arrival_to_arrival_lag_sec_median'] is None]
          if missing_edges: raise SystemExit(f'missing directed relative priors: {len(missing_edges)}')
          print('relative priors qualified:', len(edges), 'directed edges')
          PY

      - name: Initialize one full-day passenger-facing service field per date
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
          REMOTE_NAME: ${{ steps.storage.outputs.remote_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hz_service"
          for d in $(seq -w 1 25); do
            src="record_2019-01-$d.csv.gz"
            echo "initializing full day $src"
            rclone copyto "$REMOTE_NAME:$AFC_SOURCE_DRIVE/$src" input.csv.gz --config "$CONFIG_FILE" --retries 6 --low-level-retries 15 --transfers 1
            rclone copyto "$REMOTE_NAME:$SUBSTRATE_DRIVE/days/record_2019-01-$d.cityday.json" substrate_day.json --config "$CONFIG_FILE" --retries 6 --low-level-retries 15 --transfers 1
            python "$GITHUB_WORKSPACE/scripts/rail_hz_daily_service_field_init_20260905.py" day \
              --input input.csv.gz \
              --source-file "$src" \
              --prior relative_service_prior.json \
              --substrate substrate_day.json \
              --npz-output "days/record_2019-01-$d.service_init.npz" \
              --json-output "days/record_2019-01-$d.service_init.json"
            python "$GITHUB_WORKSPACE/scripts/rail_hz_service_root_completion_20260905.py" day \
              --day-npz "days/record_2019-01-$d.service_init.npz" \
              --day-json "days/record_2019-01-$d.service_init.json" \
              --prior relative_service_prior.json \
              --output "days/record_2019-01-$d.service_roots.json"
            rm -f input.csv.gz substrate_day.json
          done
          test "$(find days -maxdepth 1 -name '*.service_init.json' | wc -l)" -eq 25
          test "$(find days -maxdepth 1 -name '*.service_init.npz' | wc -l)" -eq 25
          test "$(find days -maxdepth 1 -name '*.service_roots.json' | wc -l)" -eq 25

      - name: Aggregate and enforce day-specific initialization gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hz_service"
          python "$GITHUB_WORKSPACE/scripts/rail_hz_daily_service_field_init_20260905.py" aggregate \
            --days-dir days \
            --prior relative_service_prior.json \
            --output HZ25_SERVICE_FIELD_INIT_SUMMARY_20260905.json
          python "$GITHUB_WORKSPACE/scripts/rail_hz_service_root_completion_20260905.py" aggregate \
            --days-dir days \
            --output HZ25_SERVICE_ROOT_COMPLETION_SUMMARY_20260905.json

      - name: Persist safe initialized service states to durable storage
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
          REMOTE_NAME: ${{ steps.storage.outputs.remote_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hz_service"
          rclone copy relative_service_prior.json "$REMOTE_NAME:$OUT_DRIVE" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          rclone copy HZ25_SERVICE_FIELD_INIT_SUMMARY_20260905.json "$REMOTE_NAME:$OUT_DRIVE" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          rclone copy HZ25_SERVICE_ROOT_COMPLETION_SUMMARY_20260905.json "$REMOTE_NAME:$OUT_DRIVE" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          rclone copy days "$REMOTE_NAME:$OUT_DRIVE/days" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          echo 'persisted service-init products:'
          rclone lsf "$REMOTE_NAME:$OUT_DRIVE" --config "$CONFIG_FILE" --recursive --files-only | sort | tail -n 90

      - name: Clean protected configuration
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then
            shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"
          fi

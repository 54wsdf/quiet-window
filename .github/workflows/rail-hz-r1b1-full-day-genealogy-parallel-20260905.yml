name: MPPD R1 HZ Projected Event-Feedback Probe 2026-09-06

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rail-hz-r1b1-full-day-genealogy-parallel-20260905.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
  SOURCE_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_r1b_distributed_2019-01-04_20260905
  SINGLE_DAY_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_2019-01-04_20260905
  EVENT_BASE_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_r1_joint_event_level_full_day_2019-01-04_20260906
  OUT_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_r1_joint_projected_probe_2019-01-04_20260906
  TARGET_DATE: '2019-01-04'
  PYTHONPATH: ${{ github.workspace }}

jobs:
  projected-shard4:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --disable-pip-version-check --quiet numpy pyarrow
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          python -m py_compile scripts/mppd_r1_hz_clean_projected.py scripts/mppd_r1_hz_projected_event_merge.py
      - name: Project all passenger constraints to train-station events
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/rclone.conf"; umask 077; printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          W="$RUNNER_TEMP/proj4"; mkdir -p "$W"; cd "$W"
          rclone copyto "$R:$SOURCE_DRIVE/shards/part-04.parquet" cohorts.parquet --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$SOURCE_DRIVE/static/routes.json" routes.json --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$SINGLE_DAY_DRIVE/record_$TARGET_DATE.service_roots.json" roots.json --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$EVENT_BASE_DRIVE/params/event_params1.json" params.json --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          python "$GITHUB_WORKSPACE/scripts/mppd_r1_hz_clean_projected.py" \
            --cohorts cohorts.parquet --roots roots.json --routes routes.json --params params.json \
            --out-stats projected4.stats.json --shard-index 4
          python - <<'PY'
          import json
          x=json.load(open('projected4.stats.json',encoding='utf-8'))
          print(json.dumps({'passenger_mass':x['passenger_mass'],'resolved_mass':x['resolved_mass'],'resolved_share':x['resolved_mass']/x['passenger_mass'],'cohort_count':x['cohort_count'],'resolved_cohort_count':x['resolved_cohort_count'],'event_projection_anchor_count':len(x['event_projection_stats']),'diagnostics':x['diagnostics']},ensure_ascii=False,indent=2))
          PY
          rclone copyto projected4.stats.json "$R:$OUT_DRIVE/projected4.stats.json" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          shred -u "$C" 2>/dev/null || rm -f "$C"

name: MPPD R1 HZ Projected Event-Feedback 1K Closed Probe 2026-09-06

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rail-hz-r1b1-full-day-genealogy-parallel-20260905.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
  SOURCE_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_r1b_distributed_2019-01-04_20260905
  SINGLE_DAY_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_2019-01-04_20260905
  EVENT_BASE_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_r1_joint_event_level_full_day_2019-01-04_20260906
  TARGET_DATE: '2019-01-04'
  PYTHONPATH: ${{ github.workspace }}

jobs:
  closed-1k:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --disable-pip-version-check --quiet numpy pyarrow
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          python -m py_compile scripts/mppd_r1_hz_clean_projected.py scripts/mppd_r1_hz_projected_event_merge.py scripts/mppd_r1_hz_clean_joint.py
      - name: Run projected feedback and exact shared-timetable check
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/rclone.conf"; umask 077; printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          W="$RUNNER_TEMP/proj1kclosed"; mkdir -p "$W"; cd "$W"
          rclone copyto "$R:$SOURCE_DRIVE/shards/part-04.parquet" cohorts-full.parquet --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$SOURCE_DRIVE/static/routes.json" routes.json --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$SINGLE_DAY_DRIVE/record_$TARGET_DATE.service_roots.json" roots.json --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$EVENT_BASE_DRIVE/params/event_params1.json" params0.json --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          python - <<'PY'
          import pyarrow.parquet as pq
          t=pq.read_table('cohorts-full.parquet').slice(0,1000)
          pq.write_table(t,'cohorts.parquet',compression='zstd')
          print('sample_rows',t.num_rows)
          PY
          python "$GITHUB_WORKSPACE/scripts/mppd_r1_hz_clean_projected.py" \
            --cohorts cohorts.parquet --roots roots.json --routes routes.json --params params0.json \
            --out-stats projected.stats.json --shard-index 4
          python "$GITHUB_WORKSPACE/scripts/mppd_r1_hz_projected_event_merge.py" \
            --stats projected.stats.json --old-params params0.json --roots roots.json \
            --out-params params1.json --out-summary projected_merge.json
          python "$GITHUB_WORKSPACE/scripts/mppd_r1_hz_clean_joint.py" \
            --cohorts cohorts.parquet --roots roots.json --routes routes.json --params params1.json \
            --out-stats exact.stats.json --shard-index 4
          python - <<'PY'
          import json
          p=json.load(open('projected.stats.json',encoding='utf-8'))
          m=json.load(open('projected_merge.json',encoding='utf-8'))
          e=json.load(open('exact.stats.json',encoding='utf-8'))
          out={
            'passenger_mass':p['passenger_mass'],
            'projected_resolved_mass':p['resolved_mass'],
            'projected_resolved_share':p['resolved_mass']/p['passenger_mass'],
            'shared_exact_resolved_mass':e['resolved_mass'],
            'shared_exact_resolved_share':e['resolved_mass']/e['passenger_mass'],
            'event_projection_anchor_count':len(p['event_projection_stats']),
            'shared_event_abs_offset_median_s':m['service_event_abs_offset_median_s'],
            'shared_event_abs_offset_p90_s':m['service_event_abs_offset_p90_s'],
            'shared_event_abs_offset_max_s':m['service_event_abs_offset_max_s'],
            'shared_event_bound_hits':m['service_event_offset_bound_hits'],
            'exact_diagnostics':e['diagnostics'],
          }
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          shred -u "$C" 2>/dev/null || rm -f "$C"

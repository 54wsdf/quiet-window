name: Rail HZ R1B2 Event Service Posterior Parallel 2026-09-05

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rail-hz-r1b2-event-service-posterior-parallel-20260905.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
  SOURCE_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_r1b_distributed_2019-01-04_20260905
  GENEALOGY_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_r1b1_genealogy_2019-01-04_20260905
  SINGLE_DAY_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_2019-01-04_20260905
  OUT_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_r1b2_event_service_2019-01-04_20260905
  TARGET_DATE: '2019-01-04'
  PYTHONPATH: ${{ github.workspace }}

jobs:
  event-evidence:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install and validate runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pyarrow
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          python -m py_compile scripts/rail_hz_r1b2_event_service_posterior_20260905.py
      - name: Map one genealogy partition onto service events
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/rclone.conf"; umask 077; printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          I=$(printf '%02d' ${{ matrix.shard }})
          W="$RUNNER_TEMP/r1b2-$I"; mkdir -p "$W"; cd "$W"
          rclone copyto "$R:$GENEALOGY_DRIVE/partitions/genealogy-$I.edges.parquet" edges.parquet --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$SOURCE_DRIVE/static/routes.json" routes.json --config "$C" --retries 6 --low-level-retries 15
          rclone copyto "$R:$SINGLE_DAY_DRIVE/record_$TARGET_DATE.service_roots.json" roots.json --config "$C" --retries 6 --low-level-retries 15
          python "$GITHUB_WORKSPACE/scripts/rail_hz_r1b2_event_service_posterior_20260905.py" extract-shard \
            --edges edges.parquet --routes routes.json --roots roots.json \
            --out-events "r1b2-$I.events.parquet" --out-summary "r1b2-$I.summary.json" --shard-index ${{ matrix.shard }}
          python - <<'PY'
          import json, glob
          x=json.load(open(glob.glob('r1b2-*.summary.json')[0],encoding='utf-8'))
          assert x['status']=='QUALIFIED_R1B2_EVENT_EVIDENCE_SHARD'
          assert all(x['qualification_gates'].values())
          print(json.dumps(x,ensure_ascii=False,indent=2))
          PY
          rclone copy "r1b2-$I.events.parquet" "$R:$OUT_DRIVE/event_aggregates" --config "$C" --retries 6 --low-level-retries 15
          rclone copy "r1b2-$I.summary.json" "$R:$OUT_DRIVE/summaries" --config "$C" --retries 6 --low-level-retries 15
          shred -u "$C" 2>/dev/null || rm -f "$C"

  merge-event-posterior:
    needs: event-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pyarrow
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          python -m py_compile scripts/rail_hz_r1b2_event_service_posterior_20260905.py
      - name: Merge the full-day event-level service posterior substrate
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/rclone.conf"; umask 077; printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          W="$RUNNER_TEMP/r1b2-merge"; mkdir -p "$W"; cd "$W"
          mkdir -p event_aggregates summaries
          rclone copy "$R:$OUT_DRIVE/event_aggregates" event_aggregates --config "$C" --retries 6 --low-level-retries 15
          rclone copy "$R:$OUT_DRIVE/summaries" summaries --config "$C" --retries 6 --low-level-retries 15
          rclone copyto "$R:$SINGLE_DAY_DRIVE/record_$TARGET_DATE.service_roots.json" roots.json --config "$C" --retries 6 --low-level-retries 15
          rclone copyto "$R:$GENEALOGY_DRIVE/global/HZ_2019-01-04_R1B1_GENEALOGY_GLOBAL.json" genealogy_global.json --config "$C" --retries 6 --low-level-retries 15
          test "$(find event_aggregates -name 'r1b2-*.events.parquet' | wc -l)" -eq 8
          test "$(find summaries -name 'r1b2-*.summary.json' | wc -l)" -eq 8
          E=(); for f in $(find event_aggregates -name 'r1b2-*.events.parquet' | sort); do E+=(--event-file "$f"); done
          S=(); for f in $(find summaries -name 'r1b2-*.summary.json' | sort); do S+=(--summary "$f"); done
          python "$GITHUB_WORKSPACE/scripts/rail_hz_r1b2_event_service_posterior_20260905.py" merge-global \
            "${E[@]}" "${S[@]}" --roots roots.json --genealogy-global genealogy_global.json \
            --out-events HZ_2019-01-04_R1B2_EVENT_SERVICE_POSTERIOR_SEED.parquet \
            --out-summary HZ_2019-01-04_R1B2_EVENT_SERVICE_POSTERIOR_SUMMARY.json
          python - <<'PY'
          import json
          x=json.load(open('HZ_2019-01-04_R1B2_EVENT_SERVICE_POSTERIOR_SUMMARY.json',encoding='utf-8'))
          assert x['status']=='QUALIFIED_R1B2_EVENT_LEVEL_SERVICE_POSTERIOR_SUBSTRATE'
          assert all(x['qualification_gates'].values())
          print(json.dumps(x,ensure_ascii=False,indent=2))
          PY
          rclone copy HZ_2019-01-04_R1B2_EVENT_SERVICE_POSTERIOR_SEED.parquet "$R:$OUT_DRIVE/global" --config "$C" --retries 6 --low-level-retries 15
          rclone copy HZ_2019-01-04_R1B2_EVENT_SERVICE_POSTERIOR_SUMMARY.json "$R:$OUT_DRIVE/global" --config "$C" --retries 6 --low-level-retries 15
          shred -u "$C" 2>/dev/null || rm -f "$C"

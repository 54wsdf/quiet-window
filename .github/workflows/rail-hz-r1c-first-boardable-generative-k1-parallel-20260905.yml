name: Rail HZ R1C First-Boardable Generative K1 Parallel 2026-09-05

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rail-hz-r1c-first-boardable-generative-k1-parallel-20260905.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
  R1B_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_r1b3_fixed_joint_2019-01-04_20260905
  R1C_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_r1c_transfer_2019-01-04_20260905
  PYTHONPATH: ${{ github.workspace }}

jobs:
  prepare-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prepare canonical R1C fit tree
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          C="$RUNNER_TEMP/rclone.conf"; umask 077; printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          rclone mkdir "$R:$R1C_DRIVE/generative_k1" --config "$C"
          for n in 0 1 2 3 4 5 6 7 8; do I=$(printf '%02d' "$n"); rclone mkdir "$R:$R1C_DRIVE/generative_k1/movement-$I" --config "$C"; done
          rclone mkdir "$R:$R1C_DRIVE/generative_k1/global" --config "$C"
          shred -u "$C" 2>/dev/null || rm -f "$C"

  fit-movement:
    needs: prepare-storage
    strategy:
      fail-fast: false
      matrix:
        movement_index: [0,1,2,3,4,5,6,7,8]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet numpy scipy pyarrow
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          python -m py_compile scripts/rail_hz_r1c_first_boardable_generative_fit_20260905.py
      - name: Fit one physical transfer movement over the complete service day
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/rclone.conf"; umask 077; printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          I=$(printf '%02d' ${{ matrix.movement_index }}); W="$RUNNER_TEMP/r1c-fit-$I"; mkdir -p "$W"; cd "$W"
          rclone copyto "$R:$R1B_DRIVE/global_v3_strict/HZ_2019-01-04_R1B3J_ROOT_EVENTS_STRICT.jsonl.gz" schedule.jsonl.gz --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$R1C_DRIVE/substrate/HZ_2019-01-04_R1C_TRANSFER_INTERVAL_SUBSTRATE.parquet" substrate.parquet --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          python "$GITHUB_WORKSPACE/scripts/rail_hz_r1c_first_boardable_generative_fit_20260905.py" fit-movement --schedule schedule.jsonl.gz --substrate substrate.parquet --movement-index ${{ matrix.movement_index }} --out result.json
          python - <<'PY'
          import json
          x=json.load(open('result.json',encoding='utf-8'))
          assert x['status']=='QUALIFIED_R1C_MOVEMENT_GENERATIVE_K1_FIT'
          assert x['scientific_semantics']['service_timetable_frozen_from_r1b'] is True
          assert x['scientific_semantics']['service_feedback_to_r1b'] is False
          print(json.dumps(x,ensure_ascii=False,indent=2))
          PY
          rclone copyto result.json "$R:$R1C_DRIVE/generative_k1/movement-$I/result.json" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          shred -u "$C" 2>/dev/null || rm -f "$C"

  merge:
    needs: fit-movement
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install merge runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet numpy scipy pyarrow
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          python -m py_compile scripts/rail_hz_r1c_first_boardable_generative_fit_20260905.py
      - name: Merge nine movement/time posterior products
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/rclone.conf"; umask 077; printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          W="$RUNNER_TEMP/r1c-merge"; mkdir -p "$W"; cd "$W"; IN=()
          for n in 0 1 2 3 4 5 6 7 8; do I=$(printf '%02d' "$n"); rclone copyto "$R:$R1C_DRIVE/generative_k1/movement-$I/result.json" "$I.json" --config "$C" --retries 6 --low-level-retries 15 --transfers 1; IN+=(--input "$I.json"); done
          python "$GITHUB_WORKSPACE/scripts/rail_hz_r1c_first_boardable_generative_fit_20260905.py" merge "${IN[@]}" --out HZ_2019-01-04_R1C_GENERATIVE_K1_FULL_DAY.json
          python - <<'PY'
          import json
          x=json.load(open('HZ_2019-01-04_R1C_GENERATIVE_K1_FULL_DAY.json',encoding='utf-8'))
          assert x['status']=='QUALIFIED_R1C_FULL_DAY_MOVEMENT_TIME_GENERATIVE_K1_BASELINE'
          assert all(x['qualification_gates'].values())
          print(json.dumps(x,ensure_ascii=False,indent=2))
          PY
          rclone copyto HZ_2019-01-04_R1C_GENERATIVE_K1_FULL_DAY.json "$R:$R1C_DRIVE/generative_k1/global/HZ_2019-01-04_R1C_GENERATIVE_K1_FULL_DAY.json" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          shred -u "$C" 2>/dev/null || rm -f "$C"

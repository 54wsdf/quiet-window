name: Rail HZ R1C Transfer Interval Substrate Full-Day 2026-09-05

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rail-hz-r1c-transfer-interval-substrate-full-day-20260905.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
  FIXED_JOINT_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_r1b3_fixed_joint_2019-01-04_20260905
  FACTOR_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_r1b3_fixed_joint_2019-01-04_20260905
  OUT_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_r1c_transfer_2019-01-04_20260905
  PYTHONPATH: ${{ github.workspace }}

jobs:
  build-transfer-interval-substrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pyarrow
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          python -m py_compile scripts/rail_hz_r1c_transfer_interval_substrate_20260905.py
      - name: Build all full-day movement interval observations from frozen strict R1B
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/rclone.conf"; umask 077; printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          rclone mkdir "$R:$OUT_DRIVE" --config "$C"
          rclone mkdir "$R:$OUT_DRIVE/substrate" --config "$C"
          W="$RUNNER_TEMP/r1c-substrate"; mkdir -p "$W/factors"; cd "$W"
          rclone copyto "$R:$FIXED_JOINT_DRIVE/global_v3_strict/HZ_2019-01-04_R1B3J_ROOT_EVENTS_STRICT.jsonl.gz" schedule.jsonl.gz --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          T=()
          for n in 0 1 2 3 4 5 6 7; do I=$(printf '%02d' "$n"); mkdir -p "factors/$I"; rclone copyto "$R:$FACTOR_DRIVE/factors/shard-$I/transfer.parquet" "factors/$I/transfer.parquet" --config "$C" --retries 6 --low-level-retries 15 --transfers 1; T+=(--transfer "factors/$I/transfer.parquet"); done
          python "$GITHUB_WORKSPACE/scripts/rail_hz_r1c_transfer_interval_substrate_20260905.py" --schedule schedule.jsonl.gz "${T[@]}" --out HZ_2019-01-04_R1C_TRANSFER_INTERVAL_SUBSTRATE.parquet --summary HZ_2019-01-04_R1C_TRANSFER_INTERVAL_SUBSTRATE_SUMMARY.json
          python - <<'PY'
          import json
          x=json.load(open('HZ_2019-01-04_R1C_TRANSFER_INTERVAL_SUBSTRATE_SUMMARY.json',encoding='utf-8'))
          assert x['status']=='QUALIFIED_R1C_TRANSFER_INTERVAL_SUBSTRATE'
          assert all(x['qualification_gates'].values())
          assert x['scientific_semantics']['service_feedback_to_r1b'] is False
          print(json.dumps(x,ensure_ascii=False,indent=2))
          PY
          rclone copyto HZ_2019-01-04_R1C_TRANSFER_INTERVAL_SUBSTRATE.parquet "$R:$OUT_DRIVE/substrate/HZ_2019-01-04_R1C_TRANSFER_INTERVAL_SUBSTRATE.parquet" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto HZ_2019-01-04_R1C_TRANSFER_INTERVAL_SUBSTRATE_SUMMARY.json "$R:$OUT_DRIVE/substrate/HZ_2019-01-04_R1C_TRANSFER_INTERVAL_SUBSTRATE_SUMMARY.json" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          shred -u "$C" 2>/dev/null || rm -f "$C"

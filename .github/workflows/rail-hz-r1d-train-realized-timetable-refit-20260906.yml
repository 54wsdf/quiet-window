name: Rail HZ R1D Train Realized Timetable Refit 2026-09-06

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rail-hz-r1d-train-realized-timetable-refit-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
  SOURCE_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_r1b_distributed_2019-01-04_20260905
  SINGLE_DAY_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_2019-01-04_20260905
  R1D_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_r1d_crossfit_2019-01-04_20260906
  PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prepare train-refit output tree
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          C="$RUNNER_TEMP/rclone.conf"; umask 077; printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          for n in 0 1 2 3 4 5 6 7; do I=$(printf '%02d' "$n"); rclone mkdir "$R:$R1D_DRIVE/train_refit/factors/shard-$I" --config "$C"; rclone mkdir "$R:$R1D_DRIVE/train_refit/root_mass/shard-$I" --config "$C"; done
          rclone mkdir "$R:$R1D_DRIVE/train_refit/root_mass/global" --config "$C"
          rclone mkdir "$R:$R1D_DRIVE/train_refit/timetable" --config "$C"
          shred -u "$C" 2>/dev/null || rm -f "$C"

  train-factors:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pyarrow
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          python -m py_compile scripts/rail_hz_r1d_train_fixed_factor_aggregate_20260906.py
      - name: Aggregate train-only AFC-genealogy factors
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/rclone.conf"; umask 077; printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          I=$(printf '%02d' ${{ matrix.shard }}); W="$RUNNER_TEMP/r1d-factors-$I"; mkdir -p "$W"; cd "$W"
          rclone copyto "$R:$R1D_DRIVE/split/train/part-$I.parquet" train.parquet --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$SOURCE_DRIVE/static/routes.json" routes.json --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          python "$GITHUB_WORKSPACE/scripts/rail_hz_r1d_train_fixed_factor_aggregate_20260906.py" --genealogy train.parquet --routes routes.json --shard-index ${{ matrix.shard }} --out-access access.parquet --out-egress egress.parquet --out-transfer transfer.parquet --out-summary summary.json
          python - <<'PY'
          import json
          x=json.load(open('summary.json',encoding='utf-8'))
          assert x['status']=='QUALIFIED_R1D_TRAIN_FIXED_FACTOR_AGGREGATE_SHARD'
          assert x['mapping_failure_mass']==0
          assert x['scientific_semantics']['heldout_passenger_evidence_used'] is False
          PY
          for f in access.parquet egress.parquet transfer.parquet summary.json; do rclone copyto "$f" "$R:$R1D_DRIVE/train_refit/factors/shard-$I/$f" --config "$C" --retries 6 --low-level-retries 15 --transfers 1; done
          shred -u "$C" 2>/dev/null || rm -f "$C"

  train-root-mass:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pyarrow
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - name: Aggregate train-only root usage mass for one partition
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/rclone.conf"; umask 077; printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          I=$(printf '%02d' ${{ matrix.shard }}); W="$RUNNER_TEMP/r1d-root-$I"; mkdir -p "$W"; cd "$W"
          rclone copyto "$R:$R1D_DRIVE/split/train/part-$I.parquet" train.parquet --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          python "$GITHUB_WORKSPACE/scripts/rail_hz_r1d_train_root_mass_20260906.py" shard --genealogy train.parquet --shard-index ${{ matrix.shard }} --out root.json
          rclone copyto root.json "$R:$R1D_DRIVE/train_refit/root_mass/shard-$I/root.json" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          shred -u "$C" 2>/dev/null || rm -f "$C"

  merge-root-mass:
    needs: train-root-mass
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pyarrow
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - name: Merge train root usage mass
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/rclone.conf"; umask 077; printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          W="$RUNNER_TEMP/r1d-root-merge"; mkdir -p "$W"; cd "$W"; ARGS=()
          for n in 0 1 2 3 4 5 6 7; do I=$(printf '%02d' "$n"); rclone copyto "$R:$R1D_DRIVE/train_refit/root_mass/shard-$I/root.json" "root-$I.json" --config "$C" --retries 6 --low-level-retries 15 --transfers 1; ARGS+=(--input "root-$I.json"); done
          python "$GITHUB_WORKSPACE/scripts/rail_hz_r1d_train_root_mass_20260906.py" merge "${ARGS[@]}" --out-parquet root_mass.parquet --out-summary root_mass_summary.json
          rclone copyto root_mass.parquet "$R:$R1D_DRIVE/train_refit/root_mass/global/root_mass.parquet" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto root_mass_summary.json "$R:$R1D_DRIVE/train_refit/root_mass/global/root_mass_summary.json" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          shred -u "$C" 2>/dev/null || rm -f "$C"

  solve-train-timetable:
    needs: [train-factors, merge-root-mass]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install solver runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet numpy scipy pyarrow
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          python -m py_compile scripts/rail_hz_r1d_train_realized_timetable_solver_20260906.py
      - name: Refit actual timetable from train passengers only
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/rclone.conf"; umask 077; printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          W="$RUNNER_TEMP/r1d-timetable"; mkdir -p "$W/factors"; cd "$W"
          rclone copyto "$R:$SINGLE_DAY_DRIVE/record_2019-01-04.service_roots.json" roots.json --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$SINGLE_DAY_DRIVE/2019-01-04.service_init.json" service_init.json --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$R1D_DRIVE/train_refit/root_mass/global/root_mass.parquet" root_mass.parquet --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          A=();E=();T=()
          for n in 0 1 2 3 4 5 6 7; do I=$(printf '%02d' "$n"); mkdir -p "factors/$I"; for f in access.parquet egress.parquet transfer.parquet; do rclone copyto "$R:$R1D_DRIVE/train_refit/factors/shard-$I/$f" "factors/$I/$f" --config "$C" --retries 6 --low-level-retries 15 --transfers 1; done; A+=(--access "factors/$I/access.parquet"); E+=(--egress "factors/$I/egress.parquet"); T+=(--transfer "factors/$I/transfer.parquet"); done
          python "$GITHUB_WORKSPACE/scripts/rail_hz_r1d_train_realized_timetable_solver_20260906.py" --roots roots.json --service-init service_init.json --root-mass root_mass.parquet "${A[@]}" "${E[@]}" "${T[@]}" --out-physical-events TRAIN_PHYSICAL_EVENTS.jsonl.gz --out-root-events TRAIN_ROOT_EVENTS.jsonl.gz --out-summary TRAIN_TIMETABLE_SUMMARY.json
          python - <<'PY'
          import json
          x=json.load(open('TRAIN_TIMETABLE_SUMMARY.json',encoding='utf-8'))
          assert x['status']=='QUALIFIED_R1D_TRAIN_REALIZED_TIMETABLE_REFIT_CONDITIONAL'
          assert all(x['qualification_gates'].values())
          assert x['scientific_semantics']['heldout_passengers_used_for_parameter_estimation'] is False
          assert x['scientific_semantics']['full_data_matched_afc_pulse_absolute_anchors_used'] is False
          print(json.dumps(x,ensure_ascii=False,indent=2))
          PY
          for f in TRAIN_PHYSICAL_EVENTS.jsonl.gz TRAIN_ROOT_EVENTS.jsonl.gz TRAIN_TIMETABLE_SUMMARY.json; do rclone copyto "$f" "$R:$R1D_DRIVE/train_refit/timetable/$f" --config "$C" --retries 6 --low-level-retries 15 --transfers 1; done
          shred -u "$C" 2>/dev/null || rm -f "$C"

name: Rail HZ Single-Day Parallel Prep Qualification 2026-09-05

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rail-hz-single-day-parallel-prep-qualification-20260905.yml'
      - 'scripts/rail_hz_r1b_distributed_exact_20260905.py'
      - 'scripts/rail_hz_r1c_full_service_day_input_contract_20260905.py'
      - 'scripts/rail_hz_single_day_r1b_science_report_20260905.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rail-hz-single-day-parallel-prep-qualification-20260905
  cancel-in-progress: false

jobs:
  qualify-prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout worker code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile and install lightweight runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/rail_hz_r1b_distributed_exact_20260905.py
          python -m py_compile scripts/rail_hz_r1c_full_service_day_input_contract_20260905.py
          python -m py_compile scripts/rail_hz_single_day_r1b_science_report_20260905.py
          python -m pip install --disable-pip-version-check --quiet numpy pandas pyarrow

      - name: Qualify lossless cohort partitioning and merge algebra
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prep/parts"
          cd "$RUNNER_TEMP/prep"
          python - <<'PY'
          import pandas as pd
          n=103
          df=pd.DataFrame({
            'origin_line':['B']*n,
            'origin_station':[0]*n,
            'destination_line':['B']*n,
            'destination_station':[1]*n,
            'entry_sec':list(range(n)),
            'exit_sec':[x+300 for x in range(n)],
            'passenger_mass':[(x%4)+1 for x in range(n)],
          })
          df.to_parquet('cohorts.parquet',index=False)
          print('source rows',len(df),'mass',int(df.passenger_mass.sum()))
          PY
          python "$GITHUB_WORKSPACE/scripts/rail_hz_r1b_distributed_exact_20260905.py" split \
            --source cohorts.parquet --out-dir parts --shards 4 --manifest split.json
          python - <<'PY'
          import json, glob, pandas as pd
          x=json.load(open('split.json',encoding='utf-8'))
          assert x['row_conservation_pass'] and x['split_rows']==103
          mass=sum(pd.read_parquet(p).passenger_mass.sum() for p in glob.glob('parts/*.parquet'))
          assert abs(mass-x['split_passenger_mass'])<1e-9
          print('lossless partition PASS',x['parts'])
          PY
          cat > e0a.json <<'EOF'
          {"metrics":{"cohort_count":2,"finite_cohort_count":1,"passenger_mass":4,"finite_posterior_mass":3,"finite_posterior_share":0.75,"no_route_support_mass":0,"time_or_service_incompatible_mass":1,"station_only_supported_mass":0,"weighted_mean_route_entropy":0.2,"weighted_mean_top_route_probability":0.8,"weighted_mean_min_local_beam_retained_fraction":0.99,"mass_conservation_pass":true},"factor_stats":{"access":{"w":3,"sum_log":15,"sum_log2":75},"transfer":{"w":2,"sum_log":10,"sum_log2":50},"egress":{"w":3,"sum_log":14,"sum_log2":66}}}
          EOF
          cat > e0b.json <<'EOF'
          {"metrics":{"cohort_count":3,"finite_cohort_count":2,"passenger_mass":6,"finite_posterior_mass":5,"finite_posterior_share":0.8333333333,"no_route_support_mass":1,"time_or_service_incompatible_mass":0,"station_only_supported_mass":0,"weighted_mean_route_entropy":0.4,"weighted_mean_top_route_probability":0.7,"weighted_mean_min_local_beam_retained_fraction":0.97,"mass_conservation_pass":true},"factor_stats":{"access":{"w":5,"sum_log":26,"sum_log2":136},"transfer":{"w":4,"sum_log":20,"sum_log2":101},"egress":{"w":5,"sum_log":24,"sum_log2":118}}}
          EOF
          python "$GITHUB_WORKSPACE/scripts/rail_hz_r1b_distributed_exact_20260905.py" merge-e0 --input e0a.json --input e0b.json --output e0-global.json
          python - <<'PY'
          import json
          x=json.load(open('e0-global.json',encoding='utf-8'))
          assert x['mass_conservation_pass']
          assert x['metrics']['passenger_mass']==10
          assert x['metrics']['finite_posterior_mass']==8
          assert x['factor_stats']['access']['w']==8
          print('E0 sufficient-statistic merge PASS')
          PY
          python - <<'PY'
          import scripts.rail_hz_r1b_distributed_exact_20260905 as d
          items=[
            {'metrics':{'cohort_count':2,'passenger_mass':4,'finite_posterior_mass':3,'finite_posterior_share':.75,'no_route_support_mass':0,'time_or_service_incompatible_mass':1,'became_finite_mass':0,'lost_finite_mass':0,'finite_both_mass':3,'top_route_changed_mass':1,'top_boarding_chain_changed_mass':2,'weighted_mean_route_entropy':.2,'weighted_mean_route_entropy_change_among_finite_both':.01,'weighted_mean_top_route_probability':.8,'weighted_mean_top_route_probability_change_among_finite_both':-.01}},
            {'metrics':{'cohort_count':3,'passenger_mass':6,'finite_posterior_mass':5,'finite_posterior_share':5/6,'no_route_support_mass':1,'time_or_service_incompatible_mass':0,'became_finite_mass':1,'lost_finite_mass':0,'finite_both_mass':4,'top_route_changed_mass':2,'top_boarding_chain_changed_mass':1,'weighted_mean_route_entropy':.4,'weighted_mean_route_entropy_change_among_finite_both':.02,'weighted_mean_top_route_probability':.7,'weighted_mean_top_route_probability_change_among_finite_both':-.02}},
          ]
          x=d._merge_e1_metrics(items)
          assert x['mass_conservation_pass'] and x['passenger_mass']==10 and x['top_route_changed_mass']==3
          print('E1 metric merge PASS')
          PY

      - name: Qualify future R1C launch contract and R1B science reporter
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/prep"
          cp cohorts.parquet contract_cohorts.parquet
          cat > r1b.json <<'EOF'
          {"service_date":"2019-01-04","status":"COMPLETED_FORMAL_R1B_FULL_SERVICE_DAY_UPDATE","scope":{"time":"FULL_SERVICE_DAY_0400_TO_NEXT_0400","network":"FULL_NETWORK","passenger_subsample":false,"transfer_count_cap":null,"boarding_skip_count_cap":null},"mass_conservation":{"E0_pass":true,"E1_pass":true,"passenger_mass":10},"E0":{"finite_posterior_mass":8,"finite_posterior_share":0.8,"no_route_support_mass":1,"time_or_service_incompatible_mass":1,"weighted_mean_route_entropy":0.3},"E1":{"finite_posterior_mass":9,"finite_posterior_share":0.9,"no_route_support_mass":1,"time_or_service_incompatible_mass":0,"became_finite_mass":1,"lost_finite_mass":0,"finite_both_mass":8,"top_route_changed_mass":2,"top_route_changed_share_among_finite_both":0.25,"top_boarding_chain_changed_mass":3,"top_boarding_chain_changed_share_among_finite_both":0.375,"weighted_mean_route_entropy":0.25,"weighted_mean_route_entropy_change_among_finite_both":-0.05},"service_timing_update":{"root_count":10,"roots_shifted_nonzero":4,"root_shifted_share":0.4,"usage_weighted_mean_abs_shift_sec":21,"offset_histogram":{"0":6,"30":4}},"kernels_before":{"access":{"median_sec":180,"sigma":0.9,"evidence_class":"BROAD"},"transfer":{"median_sec":180,"sigma":0.85,"evidence_class":"BROAD"},"egress":{"median_sec":120,"sigma":0.8,"evidence_class":"BROAD"}},"kernels_after":{"access":{"median_sec":170,"sigma":0.8,"evidence_class":"UPDATED"},"transfer":{"median_sec":190,"sigma":0.82,"evidence_class":"UPDATED"},"egress":{"median_sec":110,"sigma":0.75,"evidence_class":"UPDATED"}},"bidirectional_evidence":{"passenger_posterior_updates_temporal_kernels":true,"passenger_posterior_updates_service_timing":true,"updated_state_redistributes_route_posterior":true,"updated_state_redistributes_boarding_posterior":true}}
          EOF
          cat > qualification.json <<'EOF'
          {"date":"2019-01-04","status":"QUALIFIED_SINGLE_FULL_SERVICE_DAY_R1B","hard_integrity_gates":{"a":true,"b":true},"scientific_bidirectional_gates":{"passenger_updates_temporal_kernels":true,"passenger_updates_service_timing":true,"route_or_boarding_redistribution":true}}
          EOF
          cat > routes.json <<'EOF'
          {"status":"QUALIFIED_LINE_AWARE_ROUTE_SUPPORT"}
          EOF
          cat > roots.json <<'EOF'
          {"source_date":"2019-01-04","status":"QUALIFIED_CANDIDATE_SERVICE_ROOT_COMPLETION"}
          EOF
          python "$GITHUB_WORKSPACE/scripts/rail_hz_r1c_full_service_day_input_contract_20260905.py" \
            --r1b r1b.json --qualification qualification.json --cohorts contract_cohorts.parquet --routes routes.json --roots roots.json --output r1c-contract.json
          python "$GITHUB_WORKSPACE/scripts/rail_hz_single_day_r1b_science_report_20260905.py" \
            --r1b r1b.json --qualification qualification.json --output science-report.json
          python - <<'PY'
          import json
          c=json.load(open('r1c-contract.json',encoding='utf-8'))
          r=json.load(open('science-report.json',encoding='utf-8'))
          assert c['status']=='QUALIFIED_FOR_SINGLE_DAY_FULL_SERVICE_DAY_R1C'
          assert r['posterior_coverage']['finite_share_change']==0.1
          assert r['service_world_update']['roots_shifted_nonzero']==4
          print('R1C contract PASS; R1B reporter PASS')
          PY

      - name: Emit qualification marker
        shell: bash
        run: |
          echo 'QUALIFIED_SINGLE_DAY_PARALLEL_PREP_INFRASTRUCTURE'
          echo 'No formal R1C or additional Hangzhou service day was executed.'

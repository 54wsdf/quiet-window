name: Rail HZ Single Full-Service-Day R1B Distributed E0 2026-09-05

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rail-hz-single-day-r1b-distributed-e0-20260905.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
  DOMAIN_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_full_service_day_domain_20260905
  SINGLE_DAY_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_2019-01-04_20260905
  OUT_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_r1b_distributed_2019-01-04_20260905
  TARGET_DATE: '2019-01-04'
  PYTHONPATH: ${{ github.workspace }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet numpy pandas pyarrow
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          python -m py_compile scripts/rail_hz_r1b_distributed_exact_20260905.py scripts/rail_hz_expanded_route_support_v3_branch_aware_20260905.py
      - name: Restore storage and prepare exact full-day partition
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/rclone.conf"; umask 077; printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          mkdir -p "$RUNNER_TEMP/e0/parts" && cd "$RUNNER_TEMP/e0"
          rclone copyto "$R:$DOMAIN_DRIVE/cohorts/$TARGET_DATE.journey_cohorts.parquet" cohorts.parquet --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$SINGLE_DAY_DRIVE/relative_service_prior_v2.json" prior.json --config "$C" --retries 6 --low-level-retries 15
          rclone copyto "$R:$SINGLE_DAY_DRIVE/record_$TARGET_DATE.service_roots.json" roots.json --config "$C" --retries 6 --low-level-retries 15
          rclone copyto "$R:$SINGLE_DAY_DRIVE/HZ_SINGLE_FULL_SERVICE_DAY_2019-01-04_QUALIFICATION_20260905.json" prequal.json --config "$C" --retries 6 --low-level-retries 15
          python "$GITHUB_WORKSPACE/scripts/rail_hz_expanded_route_support_v3_branch_aware_20260905.py" --prior prior.json --output routes.json --k 32
          python "$GITHUB_WORKSPACE/scripts/rail_hz_r1b_distributed_exact_20260905.py" split --source cohorts.parquet --out-dir parts --shards 8 --manifest split.json
          python - <<'PY'
          import json
          q=json.load(open('prequal.json')); s=json.load(open('split.json')); r=json.load(open('routes.json'))
          assert q['status']=='QUALIFIED_SINGLE_FULL_SERVICE_DAY_PRE_R1B'
          assert r['status']=='QUALIFIED_LINE_AWARE_ROUTE_SUPPORT'
          assert s['row_conservation_pass'] and s['shards']==8
          assert abs(s['split_passenger_mass']-q['service_init']['passenger_domain']['all_consecutive_valid_journeys'])<1e-9
          print('distributed E0 input qualified',s['split_rows'],s['split_passenger_mass'])
          PY
          rclone copy parts "$R:$OUT_DRIVE/shards" --config "$C" --retries 6 --low-level-retries 15 --transfers 8
          rclone copy split.json "$R:$OUT_DRIVE/static" --config "$C" --retries 6 --low-level-retries 15
          rclone copy routes.json "$R:$OUT_DRIVE/static" --config "$C" --retries 6 --low-level-retries 15
          shred -u "$C" 2>/dev/null || rm -f "$C"

  e0:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet numpy pandas pyarrow
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - name: Compute one exact E0 shard
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/rclone.conf"; umask 077; printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          I=$(printf '%02d' ${{ matrix.shard }})
          mkdir -p "$RUNNER_TEMP/e0shard" && cd "$RUNNER_TEMP/e0shard"
          rclone copyto "$R:$OUT_DRIVE/shards/part-$I.parquet" cohorts.parquet --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$R:$OUT_DRIVE/static/routes.json" routes.json --config "$C" --retries 6 --low-level-retries 15
          rclone copyto "$R:$SINGLE_DAY_DRIVE/record_$TARGET_DATE.service_roots.json" roots.json --config "$C" --retries 6 --low-level-retries 15
          python "$GITHUB_WORKSPACE/scripts/rail_hz_r1b_distributed_exact_20260905.py" e0-shard --cohorts cohorts.parquet --routes routes.json --roots roots.json --sidecar "e0-$I.sidecar.parquet" --output "e0-$I.json" --beam 16
          rclone copy "e0-$I.json" "$R:$OUT_DRIVE/e0" --config "$C" --retries 6 --low-level-retries 15
          rclone copy "e0-$I.sidecar.parquet" "$R:$OUT_DRIVE/e0_sidecars" --config "$C" --retries 6 --low-level-retries 15 --transfers 1
          shred -u "$C" 2>/dev/null || rm -f "$C"

  merge-e0:
    needs: e0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet numpy pandas pyarrow
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - name: Merge complete E0 sufficient statistics
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/rclone.conf"; umask 077; printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"; test -n "$R"
          mkdir -p "$RUNNER_TEMP/e0merge/e0" && cd "$RUNNER_TEMP/e0merge"
          rclone copy "$R:$OUT_DRIVE/e0" e0 --config "$C" --retries 6 --low-level-retries 15
          rclone copyto "$R:$SINGLE_DAY_DRIVE/HZ_SINGLE_FULL_SERVICE_DAY_2019-01-04_QUALIFICATION_20260905.json" prequal.json --config "$C" --retries 6 --low-level-retries 15
          test "$(find e0 -maxdepth 1 -name 'e0-*.json' | wc -l)" -eq 8
          args=(); for f in $(find e0 -maxdepth 1 -name 'e0-*.json' | sort); do args+=(--input "$f"); done
          python "$GITHUB_WORKSPACE/scripts/rail_hz_r1b_distributed_exact_20260905.py" merge-e0 "${args[@]}" --output E0_GLOBAL.json
          python - <<'PY'
          import json
          x=json.load(open('E0_GLOBAL.json')); q=json.load(open('prequal.json'))
          expected=q['service_init']['passenger_domain']['all_consecutive_valid_journeys']
          assert x['mass_conservation_pass']
          assert abs(x['metrics']['passenger_mass']-expected)<1e-9
          assert x['shard_count']==8
          print(json.dumps({'status':'QUALIFIED_SINGLE_DAY_DISTRIBUTED_E0','passenger_mass':x['metrics']['passenger_mass'],'finite_share':x['metrics']['finite_posterior_share'],'no_route_mass':x['metrics']['no_route_support_mass'],'time_or_service_incompatible_mass':x['metrics']['time_or_service_incompatible_mass'],'kernels1':x['kernels1']},ensure_ascii=False,indent=2))
          PY
          rclone copy E0_GLOBAL.json "$R:$OUT_DRIVE/global" --config "$C" --retries 6 --low-level-retries 15
          shred -u "$C" 2>/dev/null || rm -f "$C"

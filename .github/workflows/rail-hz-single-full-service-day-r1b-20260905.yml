name: Rail HZ Single Full-Service-Day R1B 2026-09-05

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rail-hz-single-full-service-day-r1b-20260905.yml'
      - 'scripts/rail_hz_r1b_full_service_day_joint_update_20260905.py'
      - 'scripts/rail_hz_expanded_route_support_20260905.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rail-hz-single-full-service-day-r1b-20260905
  cancel-in-progress: false

jobs:
  r1b-one-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      DOMAIN_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_full_service_day_domain_20260905
      SINGLE_DAY_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_2019-01-04_20260905
      OUT_DRIVE: rail_transit/CN_HZ_Tianchi_2019/derived_single_full_service_day_r1b_2019-01-04_20260905
      TARGET_DATE: '2019-01-04'
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout worker code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate R1B engine and install runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/rail_hz_expanded_route_support_20260905.py
          python -m py_compile scripts/rail_hz_r1b_full_service_day_joint_update_20260905.py
          python -m pip install --disable-pip-version-check --quiet numpy pandas pyarrow
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Restore protected storage configuration
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GDRIVE_CONFIG_B64:-}" || { echo 'Missing GDRIVE_RCLONE_CONFIG_B64' >&2; exit 3; }
          C="$RUNNER_TEMP/rclone.conf"
          umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$C"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$C")"
          test -n "$R"
          echo "config_file=$C" >> "$GITHUB_OUTPUT"
          echo "remote_name=$R" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/hz_r1b/temp"

      - name: Load and verify only the qualified 2019-01-04 substrate
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
          REMOTE_NAME: ${{ steps.storage.outputs.remote_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hz_r1b"
          rclone copyto "$REMOTE_NAME:$DOMAIN_DRIVE/cohorts/$TARGET_DATE.journey_cohorts.parquet" journey_cohorts.parquet --config "$CONFIG_FILE" --retries 6 --low-level-retries 15 --transfers 1
          rclone copyto "$REMOTE_NAME:$SINGLE_DAY_DRIVE/relative_service_prior_v2.json" relative_service_prior_v2.json --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          rclone copyto "$REMOTE_NAME:$SINGLE_DAY_DRIVE/record_$TARGET_DATE.service_roots.json" service_roots.json --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          rclone copyto "$REMOTE_NAME:$SINGLE_DAY_DRIVE/HZ_SINGLE_FULL_SERVICE_DAY_2019-01-04_QUALIFICATION_20260905.json" pre_r1b_qualification.json --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          python - <<'PY'
          import json, os
          import pyarrow.parquet as pq
          d=os.environ['TARGET_DATE']
          q=json.load(open('pre_r1b_qualification.json',encoding='utf-8'))
          roots=json.load(open('service_roots.json',encoding='utf-8'))
          assert q['date']==d and q['status']=='QUALIFIED_SINGLE_FULL_SERVICE_DAY_PRE_R1B', q
          assert roots['source_date']==d and roots['status']=='QUALIFIED_CANDIDATE_SERVICE_ROOT_COMPLETION', roots.get('status')
          pf=pq.ParquetFile('journey_cohorts.parquet')
          assert pf.metadata.num_rows==q['service_init']['passenger_domain']['exact_second_cohort_count'], (pf.metadata.num_rows,q['service_init']['passenger_domain']['exact_second_cohort_count'])
          print('single-day R1B substrate verified:', d, 'cohorts=',pf.metadata.num_rows,'roots=',roots['root_count_total'])
          PY

      - name: Build full-network line-aware K32 route support
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hz_r1b"
          python "$GITHUB_WORKSPACE/scripts/rail_hz_expanded_route_support_20260905.py" \
            --prior relative_service_prior_v2.json \
            --output expanded_route_support_k32.json \
            --k 32
          python - <<'PY'
          import json
          x=json.load(open('expanded_route_support_k32.json',encoding='utf-8'))
          assert x['status']=='QUALIFIED_LINE_AWARE_ROUTE_SUPPORT', x['status']
          assert x['integrity_gates']['all_endpoint_surfaces_reachable']
          assert x['integrity_gates']['no_transfer_count_filter']
          print('route support qualified:', x['route_pair_count'], x['candidate_count'], 'max_transfer=',x['max_transfer_count_present'])
          PY

      - name: Execute one full-service-day R1B joint update
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hz_r1b"
          python "$GITHUB_WORKSPACE/scripts/rail_hz_r1b_full_service_day_joint_update_20260905.py" day \
            --cohorts journey_cohorts.parquet \
            --routes expanded_route_support_k32.json \
            --roots service_roots.json \
            --output "$TARGET_DATE.r1b.json" \
            --temp-dir temp \
            --beam 16

      - name: Qualify R1B semantics without overfitting a magnitude gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hz_r1b"
          python - <<'PY'
          import json, os
          d=os.environ['TARGET_DATE']
          x=json.load(open(f'{d}.r1b.json',encoding='utf-8'))
          hard={
            'completed_formal_full_day_update':x['status']=='COMPLETED_FORMAL_R1B_FULL_SERVICE_DAY_UPDATE',
            'correct_service_date':x['service_date']==d,
            'full_service_day':x['scope']['time']=='FULL_SERVICE_DAY_0400_TO_NEXT_0400',
            'full_network':x['scope']['network']=='FULL_NETWORK',
            'no_passenger_subsample':not x['scope']['passenger_subsample'],
            'no_transfer_count_cap':x['scope']['transfer_count_cap'] is None,
            'no_boarding_skip_cap':x['scope']['boarding_skip_count_cap'] is None,
            'E0_mass_conservation':x['mass_conservation']['E0_pass'],
            'E1_mass_conservation':x['mass_conservation']['E1_pass'],
            'positive_passenger_mass':x['mass_conservation']['passenger_mass']>0,
            'finite_state_metrics_present':x['E0']['finite_posterior_share'] is not None and x['E1']['finite_posterior_share'] is not None,
          }
          scientific={
            'passenger_updates_temporal_kernels':x['bidirectional_evidence']['passenger_posterior_updates_temporal_kernels'],
            'passenger_updates_service_timing':x['bidirectional_evidence']['passenger_posterior_updates_service_timing'],
            'route_redistribution':x['bidirectional_evidence']['updated_state_redistributes_route_posterior'],
            'boarding_redistribution':x['bidirectional_evidence']['updated_state_redistributes_boarding_posterior'],
            'route_or_boarding_redistribution':x['bidirectional_evidence']['updated_state_redistributes_route_posterior'] or x['bidirectional_evidence']['updated_state_redistributes_boarding_posterior'],
          }
          result={
            'schema':'rail.hz-single-full-service-day-r1b-qualification.v1',
            'date':d,
            'status':'QUALIFIED_SINGLE_FULL_SERVICE_DAY_R1B' if all(hard.values()) and scientific['passenger_updates_temporal_kernels'] and scientific['passenger_updates_service_timing'] and scientific['route_or_boarding_redistribution'] else 'R1B_EXECUTED_SCIENTIFIC_GATE_REQUIRES_DIAGNOSIS',
            'hard_integrity_gates':hard,
            'scientific_bidirectional_gates':scientific,
            'E0':x['E0'],
            'E1':x['E1'],
            'service_timing_update':{
              'roots_shifted_nonzero':x['service_timing_update']['roots_shifted_nonzero'],
              'root_shifted_share':x['service_timing_update']['root_shifted_share'],
              'usage_weighted_mean_abs_shift_sec':x['service_timing_update']['usage_weighted_mean_abs_shift_sec'],
              'offset_histogram':x['service_timing_update']['offset_histogram'],
            },
            'kernel_update':x['kernel_update'],
            'next_stage':'SINGLE_DAY_R1C_FULL_SERVICE_DAY' if all(hard.values()) and scientific['passenger_updates_temporal_kernels'] and scientific['passenger_updates_service_timing'] and scientific['route_or_boarding_redistribution'] else 'R1B_DIAGNOSIS_SAME_DAY',
            'interpretation':'Small update magnitudes are not failure gates. Only missing bidirectional mechanism evidence or violated integrity requires diagnosis before R1C.'
          }
          open('HZ_SINGLE_FULL_SERVICE_DAY_2019-01-04_R1B_QUALIFICATION_20260905.json','w',encoding='utf-8').write(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps({
            'status':result['status'],
            'hard_integrity_gates':hard,
            'scientific_bidirectional_gates':scientific,
            'E0_finite_share':x['E0']['finite_posterior_share'],
            'E1_finite_share':x['E1']['finite_posterior_share'],
            'E0_no_route_mass':x['E0']['no_route_support_mass'],
            'E0_time_or_service_incompatible_mass':x['E0']['time_or_service_incompatible_mass'],
            'roots_shifted_nonzero':x['service_timing_update']['roots_shifted_nonzero'],
            'route_changed_mass':x['E1']['top_route_changed_mass'],
            'boarding_changed_mass':x['E1']['top_boarding_chain_changed_mass'],
          },ensure_ascii=False,indent=2))
          if not all(hard.values()): raise SystemExit(2)
          PY

      - name: Persist one-day R1B products
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
          REMOTE_NAME: ${{ steps.storage.outputs.remote_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hz_r1b"
          rclone copy expanded_route_support_k32.json "$REMOTE_NAME:$OUT_DRIVE" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          rclone copy "$TARGET_DATE.r1b.json" "$REMOTE_NAME:$OUT_DRIVE" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          rclone copy HZ_SINGLE_FULL_SERVICE_DAY_2019-01-04_R1B_QUALIFICATION_20260905.json "$REMOTE_NAME:$OUT_DRIVE" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15

      - name: Clean protected configuration
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then
            shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"
          fi

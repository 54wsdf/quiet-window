name: Rail Operation Datasets

on:
  push:
    branches: [main]
    paths: ['.github/workflows/rail-operation-datasets.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}

jobs:
  figshare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {record: '28891607', id: italian_railway_operations_2024, path: '01_rail/IT_Railway/02_actual_operations/2024_H1'}
          - {record: '15087882', id: china_hsr_operations_2019_2020, path: '01_rail/CN_HSR/02_actual_operations/2019_2020'}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: 枚举 Figshare 全文件并直传
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GDRIVE_CONFIG_B64:-}" || exit 3
          python -m pip install --disable-pip-version-check requests
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          CFG="$RUNNER_TEMP/rclone.conf"; umask 077; printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$CFG"
          R="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$CFG")"; test -n "$R"
          python scripts/fetchers/research_record_direct.py --provider figshare --record-id '${{ matrix.record }}' --dataset-id '${{ matrix.id }}' --drive-path '${{ matrix.path }}' --config "$CFG" --remote "$R"
          shred -u "$CFG" 2>/dev/null || rm -f "$CFG"

name: Rail Source Discovery Debug

on:
  push:
    branches: [main]
    paths: ['.github/workflows/rail-source-discovery-debug.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numbat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect TfL crowding root implementation
        shell: bash
        run: |
          set -euo pipefail
          URL='https://crowding.data.tfl.gov.uk/'
          curl --compressed -fLsS --retry 3 -A 'Mozilla/5.0' "$URL" -o /tmp/tfl.html
          echo "bytes=$(wc -c < /tmp/tfl.html)"
          echo '===== href/src attributes ====='
          grep -Eio 'src="[^"]+"|href="[^"]+"' /tmp/tfl.html | head -n 300 || true
          echo '===== root html ====='
          cat /tmp/tfl.html

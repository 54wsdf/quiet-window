name: Rail TfL Extra Discovery

on:
  push:
    branches: [main]
    paths: ['.github/workflows/rail-tfl-extra-discovery.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Inventory TfL public S3 demand prefixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.parse, urllib.request, xml.etree.ElementTree as ET
          HOST='https://s3-eu-west-1.amazonaws.com/crowding.data.tfl.gov.uk/'
          NS={'s3':'http://s3.amazonaws.com/doc/2006-03-01/'}
          prefixes=['Annual Station Counts/','Network Demand/','RODS/']
          def get(params):
              url=HOST+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':'quiet-window-public-data-worker/3.0'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return ET.fromstring(r.read())
          for prefix in prefixes:
              token=None; rows=[]
              while True:
                  params={'list-type':'2','prefix':prefix,'max-keys':'1000'}
                  if token: params['continuation-token']=token
                  doc=get(params)
                  for c in doc.findall('.//s3:Contents',NS):
                      key=c.findtext('s3:Key',default='',namespaces=NS) or ''
                      size=int(c.findtext('s3:Size',default='0',namespaces=NS) or '0')
                      if key!=prefix and size>0: rows.append((key,size))
                  if doc.findtext('s3:IsTruncated',default='false',namespaces=NS)!='true': break
                  token=doc.findtext('s3:NextContinuationToken',default='',namespaces=NS)
                  if not token: raise RuntimeError('pagination stalled')
              print('====',prefix,'====')
              print('FILES',len(rows),'BYTES',sum(s for _,s in rows))
              exts={}
              for k,s in rows:
                  ext=k.rsplit('.',1)[-1].lower() if '.' in k.rsplit('/',1)[-1] else '(none)'
                  exts[ext]=exts.get(ext,0)+1
              print('EXTENSIONS',exts)
              for k,s in rows[:250]: print(s,k)
          PY

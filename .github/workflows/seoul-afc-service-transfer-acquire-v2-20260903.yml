name: Seoul AFC Service Transfer Acquire v2 2026-09-03

on:
  push:
    paths:
      - '.github/workflows/seoul-afc-service-transfer-acquire-v2-20260903.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      ROOT_DRIVE: ResearchData/rail_transit/metro_transfer_afc_ats_bridge/20260903/seoul
    steps:
      - uses: actions/checkout@v5

      - name: Prepare runtime
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GDRIVE_CONFIG_B64:-}" || exit 3
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone jq file
          python -m pip install --disable-pip-version-check requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium >/tmp/playwright-install.log 2>&1
          CONFIG_FILE="$RUNNER_TEMP/rclone.conf"; umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$CONFIG_FILE"
          REMOTE_NAME="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$CONFIG_FILE")"; test -n "$REMOTE_NAME"
          echo "config_file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"
          echo "remote_name=$REMOTE_NAME" >> "$GITHUB_OUTPUT"

      - name: Acquire published files
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/seoul-acquire"
          mkdir -p "$OUT"
          python - <<'PY'
          import hashlib, json, os, zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          out=Path(os.environ['OUT']); rows=[]
          UA='quiet-window-public-data-worker/1.0'

          def digest(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(8*1024*1024),b''): h.update(b)
              return h.hexdigest()

          def validate(p):
              p=Path(p); n=p.stat().st_size
              if n<=0: raise RuntimeError(f'zero byte: {p.name}')
              head=p.read_bytes()[:16]
              if head.lstrip().lower().startswith((b'<html',b'<!doctype')): raise RuntimeError(f'HTML payload: {p.name}')
              if p.suffix.lower()=='.zip':
                  if not head.startswith(b'PK'): raise RuntimeError(f'not ZIP magic: {p.name}')
                  with zipfile.ZipFile(p) as z:
                      if not z.infolist(): raise RuntimeError(f'empty ZIP: {p.name}')

          def record(p,dataset_id,landing,coverage,role,selector):
              p=Path(p); validate(p)
              m={'schema':'quiet-window-acquisition-manifest-v1','state':'DOWNLOADED_TEMP','dataset_id':dataset_id,
                 'provider_landing_url':landing,'public_ui_selector':selector,'time_coverage':coverage,'evidence_role':role,
                 'retrieved_at_utc':datetime.now(timezone.utc).isoformat(),'original_filename':p.name,
                 'bytes':p.stat().st_size,'sha256':digest(p),'github_repository':os.getenv('GITHUB_REPOSITORY'),'github_run_id':os.getenv('GITHUB_RUN_ID')}
              mp=p.with_name(p.name+'.manifest.json'); mp.write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding='utf-8')
              rows.append({'dataset_id':dataset_id,'filename':p.name,'bytes':m['bytes'],'sha256':m['sha256'],'coverage':coverage,'role':role})

          def tdata(data_id,file_id,expected,dataset_id,coverage,role):
              landing=f'https://t-data.seoul.go.kr/dataprovide/trafficdataviewfile.do?data_id={data_id}'
              s=requests.Session(); s.headers['User-Agent']=UA
              r=s.get(landing,timeout=60); r.raise_for_status()
              soup=BeautifulSoup(r.text,'html.parser')
              opt=soup.select_one(f'#filedata_selectbox option[value="{file_id}"]')
              if not opt or opt.get_text(strip=True)!=expected: raise RuntimeError(f'public selector contract changed for {expected}')
              url=f'https://t-data.seoul.go.kr/dataprovide/download.do?id={file_id}'
              target=out/expected
              with s.get(url,headers={'Referer':landing},stream=True,timeout=(30,3600),allow_redirects=True) as q:
                  q.raise_for_status()
                  with target.open('wb') as f:
                      for b in q.iter_content(8*1024*1024):
                          if b: f.write(b)
              record(target,dataset_id,landing,coverage,role,{'option_value':file_id,'option_text':expected,'download_contract':'published /dataprovide/download.do?id=<option-value>'})

          def open_data(page,landing,link_text,expected,dataset_id,coverage,role):
              page.goto(landing,wait_until='domcontentloaded',timeout=120000)
              # Match the actual file-row anchor, not generic dataset text.
              link=page.locator('a').filter(has_text=link_text).first
              link.wait_for(state='visible',timeout=120000)
              with page.expect_download(timeout=180000) as di: link.click()
              target=out/expected; di.value.save_as(str(target))
              record(target,dataset_id,landing,coverage,role,{'visible_link_text':link_text,'download_contract':'published file-row downloadFile control'})

          # Same-date passenger + direct subway operational status.
          tdata('20006','15480','TAIMS_20260902.zip','KR_SEOUL_TDATA_CARD_20260902','2026-09-02','fine_passenger_card_bundle')
          tdata('20007','15474','subarr_20260902.zip','KR_SEOUL_TDATA_SUBWAY_STATUS_20260902','2026-09-02','direct_operational_subway_status')
          tdata('20007','15481','BMS_20260902.zip','KR_SEOUL_TDATA_BMS_REFERENCE_20260902','2026-09-02','service_reference_companion')

          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True); ctx=browser.new_context(accept_downloads=True)
              open_data(ctx.new_page(),'https://data.seoul.go.kr/dataList/OA-22521/F/1/datasetView.do','서울교통공사_수도권 도시철도 환승 데이터_20250317.csv','서울교통공사_수도권 도시철도 환승 데이터_20250317.csv','KR_SEOUL_METRO_DIRECTIONAL_TRANSFER_20250317','2025-03-17 snapshot','directional_car_door_transfer')
              open_data(ctx.new_page(),'https://data.seoul.go.kr/dataList/OA-21221/F/1/datasetView.do','kscc_dx_trnsf_path_sum_20260825.zip','kscc_dx_trnsf_path_sum_20260825.zip','KR_SEOUL_TRANSFER_OBSERVED_AGG_20260825','2026-08-25','observed_transfer_count_time_aggregate')
              ctx.close(); browser.close()

          summary={'state':'DOWNLOADED_TEMP','retrieved_at_utc':datetime.now(timezone.utc).isoformat(),'files':rows}
          (out/'acquisition_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'downloaded':rows},ensure_ascii=False))
          PY

      - name: Inventory archives without data rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'seoul-acquire'; inv={}
          for p in out.glob('*.zip'):
              with zipfile.ZipFile(p) as z:
                  infos=z.infolist(); inv[p.name]=[{'name':x.filename,'bytes':x.file_size} for x in infos[:300]]
          (out/'archive_inventory.json').write_text(json.dumps(inv,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:{'members':len(v),'first_names':[x['name'] for x in v[:20]]} for k,v in inv.items()},ensure_ascii=False))
          PY

      - name: Copy raw bytes and manifests to Google Drive
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
          REMOTE_NAME: ${{ steps.storage.outputs.remote_name }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/seoul-acquire"
          cv() { local s="$1" d="$2"; rclone copyto "$s" "$REMOTE_NAME:$ROOT_DRIVE/$d" --config "$CONFIG_FILE" --retries 8 --low-level-retries 20 --transfers 1 --checkers 4; local l r; l="$(stat -c '%s' "$s")"; r="$(rclone size "$REMOTE_NAME:$ROOT_DRIVE/$d" --config "$CONFIG_FILE" --json | jq -r '.bytes')"; test "$l" = "$r"; }
          cv "$OUT/TAIMS_20260902.zip" "passenger/20260902/TAIMS_20260902.zip"
          cv "$OUT/subarr_20260902.zip" "service/20260902/subarr_20260902.zip"
          cv "$OUT/BMS_20260902.zip" "service/20260902/BMS_20260902.zip"
          cv "$OUT/서울교통공사_수도권 도시철도 환승 데이터_20250317.csv" "transfer/static/서울교통공사_수도권 도시철도 환승 데이터_20250317.csv"
          cv "$OUT/kscc_dx_trnsf_path_sum_20260825.zip" "transfer/observed_aggregate/20260825/kscc_dx_trnsf_path_sum_20260825.zip"
          cv "$OUT/archive_inventory.json" "99_manifests/archive_inventory.json"
          for m in "$OUT"/*.manifest.json; do cv "$m" "99_manifests/$(basename "$m")"; done

      - name: Freeze ACQUIRED manifests
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
          REMOTE_NAME: ${{ steps.storage.outputs.remote_name }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/seoul-acquire"
          python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'seoul-acquire'; root=os.environ['ROOT_DRIVE']
          rel={
           'TAIMS_20260902.zip':'passenger/20260902/TAIMS_20260902.zip','subarr_20260902.zip':'service/20260902/subarr_20260902.zip','BMS_20260902.zip':'service/20260902/BMS_20260902.zip',
           '서울교통공사_수도권 도시철도 환승 데이터_20250317.csv':'transfer/static/서울교통공사_수도권 도시철도 환승 데이터_20250317.csv','kscc_dx_trnsf_path_sum_20260825.zip':'transfer/observed_aggregate/20260825/kscc_dx_trnsf_path_sum_20260825.zip'}
          for name,r in rel.items():
              p=out/(name+'.manifest.json'); d=json.loads(p.read_text(encoding='utf-8')); d['state']='ACQUIRED'; d['durable_storage']={'backend':'Google Drive via rclone','path':root+'/'+r,'verified_by':'remote_size'}; p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          s=json.loads((out/'acquisition_summary.json').read_text(encoding='utf-8')); s['state']='ACQUIRED'; s['durable_root']=root; (out/'acquisition_summary.json').write_text(json.dumps(s,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          for m in "$OUT"/*.manifest.json; do rclone copyto "$m" "$REMOTE_NAME:$ROOT_DRIVE/99_manifests/$(basename "$m")" --config "$CONFIG_FILE" --retries 5 --low-level-retries 10; done
          rclone copyto "$OUT/acquisition_summary.json" "$REMOTE_NAME:$ROOT_DRIVE/99_manifests/acquisition_summary.json" --config "$CONFIG_FILE" --retries 5 --low-level-retries 10
          echo 'SEOUL_ACQUISITION_DURABLE_GATE_PASS'

      - name: Clean configuration
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"; fi

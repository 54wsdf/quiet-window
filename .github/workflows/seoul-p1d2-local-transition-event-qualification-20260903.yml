name: Seoul P1D2 Local Transition Event Qualification 2026-09-03

on:
  push:
    paths:
      - '.github/workflows/seoul-p1d2-local-transition-event-qualification-20260903.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      ROOT_DRIVE: ResearchData/rail_transit/metro_transfer_afc_ats_bridge/20260903/seoul
    steps:
      - uses: actions/checkout@v5
      - name: Restore matched service
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone jq
          CONFIG_FILE="$RUNNER_TEMP/rclone.conf"; umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$CONFIG_FILE"
          REMOTE_NAME="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$CONFIG_FILE")"; test -n "$REMOTE_NAME"
          echo "config_file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"; echo "remote_name=$REMOTE_NAME" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/p1d2"; cd "$RUNNER_TEMP/p1d2"
          rclone copyto "$REMOTE_NAME:$ROOT_DRIVE/service/20260830/BMS_20260830.zip" BMS.zip --config "$CONFIG_FILE" --retries 6 --low-level-retries 15

      - name: Extract local ARR to DEP transitions in AM window
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/p1d2"
          python - <<'PY'
          import csv,io,json,re,statistics,unicodedata,zipfile
          from collections import Counter,defaultdict
          from datetime import datetime,timezone
          from pathlib import Path

          def detect(raw):
              for e in ('utf-8-sig','utf-8','cp949','euc-kr'):
                  try: raw.decode(e); return e
                  except UnicodeDecodeError: pass
              return 'cp949'
          def zr(z,n):
              f=z.open(n);h=f.read(262144);f.close();e=detect(h)
              return io.TextIOWrapper(z.open(n),encoding=e,errors='replace',newline='')
          def hdr(s):return unicodedata.normalize('NFKC',str(s).replace('\ufeff','')).strip().lower()
          def parse(s):
              d=''.join(x for x in str(s or '') if x.isdigit())
              try:return datetime.strptime(d[:14],'%Y%m%d%H%M%S') if len(d)>=14 else None
              except ValueError:return None
          def qs(a):
              a=sorted(float(x) for x in a)
              if not a:return None
              def q(p):return a[round((len(a)-1)*p)]
              return {'n':len(a),'min':a[0],'p10':q(.1),'median':q(.5),'p90':q(.9),'p99':q(.99),'max':a[-1]}

          pat=re.compile(r'subarr_(260829(\d{6}))')
          obs=defaultdict(list); rows=0; all_state=Counter(); shard_times=[]
          with zipfile.ZipFile('BMS.zip') as z:
              infos=[]
              for x in z.infolist():
                  m=pat.search(x.filename)
                  if not m:continue
                  hh=m.group(2)
                  if '070000'<=hh<'100000':
                      infos.append(x); shard_times.append(datetime.strptime('20'+m.group(1),'%Y%m%d%H%M%S'))
              shard_times.sort(); poll=[(b-a).total_seconds() for a,b in zip(shard_times,shard_times[1:])]
              for x in infos:
                  f=zr(z,x.filename);r=csv.DictReader(f);r.fieldnames=[hdr(k) for k in (r.fieldnames or [])]
                  for row in r:
                      rows+=1
                      state=(row.get('arvl_cd') or '').strip(); all_state[state]+=1
                      if state not in {'0','1','2'}:continue
                      t=parse(row.get('recptn_dt'));line=(row.get('subway_id') or '').strip();train=(row.get('btrain_no') or '').strip();station=(row.get('statn_id') or '').strip()
                      if not (t and line and train and station):continue
                      obs[(line,train,station)].append((t,state))
                  f.close()

          # Collapse only exact duplicate state observations in time order. Boundary leftovers are retained but never forced into a pair.
          key_stats=Counter(); transition_seq=Counter(); all_pairs=[]; events=[]; pair_by_limit={}
          for limit in (90,120,180,300):
              pairs=[]
              for key,items in obs.items():
                  items=sorted(items)
                  trans=[]
                  for t,s in items:
                      if not trans or trans[-1][1]!=s: trans.append((t,s))
                  # Scan each arrival transition and pair to the first subsequent departure before another arrival.
                  i=0
                  while i<len(trans):
                      ta,sa=trans[i]
                      if sa!='1': i+=1; continue
                      dep=None
                      j=i+1
                      while j<len(trans):
                          td,sd=trans[j]
                          if sd=='1': break
                          if sd=='2':
                              d=(td-ta).total_seconds()
                              if 0<=d<=limit: dep=(td,d)
                              break
                          j+=1
                      if dep is not None:pairs.append(dep[1])
                      i+=1
              pair_by_limit[str(limit)]={'count':len(pairs),'dwell_sec':qs(pairs)}

          # Selected 300 sec extraction with per-event output and diagnostics.
          orphan_arr=0; orphan_dep=0; multi_cycles=0; cycle_counts=Counter(); repeat_pair_same_time=0
          seen_events=set()
          for key,items in obs.items():
              items=sorted(items)
              trans=[]
              for t,s in items:
                  if not trans or trans[-1][1]!=s:trans.append((t,s))
              transition_seq['>'.join(s for _,s in trans[:12])]+=1
              local=[]; used_dep=set()
              for i,(ta,sa) in enumerate(trans):
                  if sa!='1':continue
                  found=None
                  for td,sd in trans[i+1:]:
                      if sd=='1':break
                      if sd=='2':
                          d=(td-ta).total_seconds()
                          if 0<=d<=300:found=(td,d)
                          break
                  if found:
                      td,d=found
                      evkey=(key,ta,td)
                      if evkey in seen_events: repeat_pair_same_time+=1
                      else:
                          seen_events.add(evkey);local.append((ta,td,d));all_pairs.append(d)
                  else:orphan_arr+=1
              # Departures that do not serve as selected pair endpoints.
              paired_dep={d for _,d,_ in local}
              orphan_dep+=sum(1 for t,s in trans if s=='2' and t not in paired_dep)
              if len(local)>1:multi_cycles+=1
              cycle_counts[len(local)]+=1
              line,train,station=key
              for idx,(a,d,dwell) in enumerate(local):
                  events.append({'evidence_class':'DIRECT_OPERATIONAL_STATUS_EVENT_CANDIDATE','subway_id':line,'btrain_no':train,'statn_id':station,'local_cycle_index':idx,'arrival_detect_time':a.strftime('%Y%m%d%H%M%S'),'departure_detect_time':d.strftime('%Y%m%d%H%M%S'),'dwell_detect_seconds':dwell,'pair_rule':'local_state1_to_first_state2_before_next_state1','max_dwell_seconds':300})

          counts=[pair_by_limit[str(x)]['count'] for x in (90,120,180,300)]
          spread_120_300=(max(counts[1:])-min(counts[1:]))/max(1,statistics.mean(counts[1:]))
          # 180 vs 300 is more meaningful for robustness after excluding a deliberately tight 90s sensitivity bound.
          c180=pair_by_limit['180']['count']; c300=pair_by_limit['300']['count']; delta_180_300=abs(c300-c180)/max(1,c300)
          dwell=qs(all_pairs)
          supported=bool(len(events)>=3000 and dwell and dwell['p99']<=300 and delta_180_300<=0.15)

          with open('am_local_transition_events_0700_1000.csv','w',encoding='utf-8',newline='') as f:
              if events:
                  w=csv.DictWriter(f,fieldnames=list(events[0]));w.writeheader();w.writerows(events)

          result={'schema':'mppd-n1-seoul-p1d2-local-transition-event-qualification-v1','window':'2026-08-29 07:00:00-10:00:00','archive_shards':len(infos),'snapshot_rows':rows,'poll_gap_sec':qs(poll),'all_arvl_cd_counts':dict(all_state),'base_keys':len(obs),'pair_by_dwell_limit':pair_by_limit,'selected_event_rows':len(events),'selected_dwell_sec':dwell,'orphan_arrival_transitions':orphan_arr,'orphan_departure_transitions':orphan_dep,'keys_with_multiple_local_cycles':multi_cycles,'selected_cycles_per_key':dict(cycle_counts),'duplicate_event_keys_detected':repeat_pair_same_time,'common_transition_sequences':dict(transition_seq.most_common(40)),'relative_spread_120_180_300':spread_120_300,'relative_count_delta_180_vs_300':delta_180_300,'evidence_class':'DIRECT_OPERATIONAL_STATUS_EVENT_CANDIDATE','qualification':{'local_transition_reconstruction_supported':supported,'physical_timestamp_boundary':'arrival/departure time is first observed state transition at approximately 10-second polling precision; do not relabel as proprietary ATS track-circuit timestamp','t5_pass':False,'t6_observed_genealogy':False}}
          Path('seoul_p1d2_local_transition_event_qualification_20260903.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('P1D2_CONCISE='+json.dumps({k:result[k] for k in ['archive_shards','snapshot_rows','poll_gap_sec','base_keys','pair_by_dwell_limit','selected_event_rows','selected_dwell_sec','orphan_arrival_transitions','orphan_departure_transitions','keys_with_multiple_local_cycles','selected_cycles_per_key','relative_spread_120_180_300','relative_count_delta_180_vs_300','qualification']},ensure_ascii=False))
          PY

      - name: Store results
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
          REMOTE_NAME: ${{ steps.storage.outputs.remote_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/p1d2"
          cpv(){ local s="$1" d="$2"; rclone copyto "$s" "$REMOTE_NAME:$ROOT_DRIVE/$d" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15; local l r; l="$(stat -c '%s' "$s")"; r="$(rclone size "$REMOTE_NAME:$ROOT_DRIVE/$d" --config "$CONFIG_FILE" --json|jq -r '.bytes')"; test "$l" = "$r"; }
          cpv seoul_p1d2_local_transition_event_qualification_20260903.json 99_manifests/seoul_p1d2_local_transition_event_qualification_20260903.json
          cpv am_local_transition_events_0700_1000.csv processed/service_events/20260829/am_local_transition_events_0700_1000.csv
          echo SEOUL_P1D2_DURABLE_PASS

      - name: Clean configuration
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"; fi

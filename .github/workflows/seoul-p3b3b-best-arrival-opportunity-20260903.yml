name: Seoul P3B3B Best-Arrival Transfer Opportunity 2026-09-03

on:
  push:
    paths:
      - '.github/workflows/seoul-p3b3b-best-arrival-opportunity-20260903.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      ROOT_DRIVE: ResearchData/rail_transit/metro_transfer_afc_ats_bridge/20260903/seoul
    steps:
      - uses: actions/checkout@v5
      - name: Restore qualified layers
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone jq
          CONFIG_FILE="$RUNNER_TEMP/rclone.conf"; umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$CONFIG_FILE"
          REMOTE_NAME="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$CONFIG_FILE")"; test -n "$REMOTE_NAME"
          echo "config_file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"; echo "remote_name=$REMOTE_NAME" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/p3b3b"; cd "$RUNNER_TEMP/p3b3b"
          rclone copyto "$REMOTE_NAME:$ROOT_DRIVE/passenger/20260902/TAIMS_20260902.zip" TAIMS.zip --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          rclone copyto "$REMOTE_NAME:$ROOT_DRIVE/99_manifests/seoul_p1c_line_aware_crosswalk_20260903.json" p1c.json --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          rclone copyto "$REMOTE_NAME:$ROOT_DRIVE/processed/service_events/20260829/am_fresh_service_event_candidates_0700_1000.csv" paired.csv --config "$CONFIG_FILE" --retries 6 --low-level-retries 15

      - name: Evaluate destination-best service opportunities
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/p3b3b"
          python - <<'PY'
          import csv,io,json,statistics,zipfile
          from collections import Counter,defaultdict
          from datetime import datetime,timedelta,timezone
          from pathlib import Path

          RAIL={'201','202','203','204','205','206','208','209','210','231','232','235','236','237','290'}
          STRICT={'A_TRANSFER_CODE_LINE_NAME','B_UNIQUE_NAME','C_NAME_PREFIX_LINE'}
          IN_LINE='1008';OUT_LINE='1002';IN_TRANSFER='1008000814';OUT_TRANSFER='1002000216'
          TRANSFER_VALUES=[0,120,158,300];ENTRY_GUARDS=[0,60,120]
          def detect(raw):
              for e in ('utf-8-sig','utf-8','cp949','euc-kr'):
                  try:raw.decode(e);return e
                  except UnicodeDecodeError:pass
              return 'cp949'
          def zr(z,n):
              f=z.open(n);h=f.read(262144);f.close();e=detect(h)
              return io.TextIOWrapper(z.open(n),encoding=e,errors='replace',newline='')
          def z4(s):
              d=''.join(ch for ch in str(s or '') if ch.isdigit())
              return d.zfill(4) if d and len(d)<=4 else (d[-4:] if d else '')
          def dt(v):
              d=''.join(ch for ch in str(v or '') if ch.isdigit())
              try:return datetime.strptime(d[:14],'%Y%m%d%H%M%S') if len(d)>=14 else None
              except:return None
          def q(a,p):
              if not a:return None
              b=sorted(a);return b[round((len(b)-1)*p)]
          def summ(a):
              if not a:return None
              return {'n':len(a),'min':min(a),'median':q(a,.5),'p90':q(a,.9),'p99':q(a,.99),'max':max(a)}

          p1c=json.loads(Path('p1c.json').read_text(encoding='utf-8'))
          cw={x['out_stn_num']:x for x in p1c['canonical_entries'] if x.get('tier') in STRICT}
          trains=defaultdict(lambda:defaultdict(list))
          with open('paired.csv',encoding='utf-8',newline='') as f:
              for row in csv.DictReader(f):
                  line=(row.get('subway_id') or '').strip()
                  if line not in {IN_LINE,OUT_LINE}:continue
                  tr=(row.get('btrain_no') or '').strip();st=(row.get('statn_id') or '').strip();a=dt(row.get('arrival_detect_time'));d=dt(row.get('departure_detect_time'))
                  if tr and st and a and d:trains[(line,tr)][st].append((a,d))
          for k in trains:
              for st in trains[k]:trains[k][st]=sorted(set(trains[k][st]))
          inbound=defaultdict(list);outbound=defaultdict(list)
          for (line,tr),sts in trains.items():
              if line==IN_LINE and IN_TRANSFER in sts:
                  for ta,td in sts[IN_TRANSFER]:
                      for os,evs in sts.items():
                          if os==IN_TRANSFER:continue
                          for oa,od in evs:
                              if od<ta and 0<(ta-od).total_seconds()<=7200:
                                  inbound[os].append((od,ta,tr));break
              if line==OUT_LINE and OUT_TRANSFER in sts:
                  for ta,td in sts[OUT_TRANSFER]:
                      for ds,evs in sts.items():
                          if ds==OUT_TRANSFER:continue
                          for da,dd in evs:
                              if da>td and 0<(da-td).total_seconds()<=7200:
                                  outbound[ds].append((td,da,tr));break
          for st in inbound:inbound[st]=sorted(set(inbound[st]))
          for st in outbound:outbound[st]=sorted(set(outbound[st]))

          passengers=[]
          with zipfile.ZipFile('TAIMS.zip') as z:
              f=zr(z,'VW_KSCC_DX_CARD.csv');r=csv.DictReader(f)
              for row in r:
                  if (row.get('TRNS_MNS_CD') or '').strip() not in RAIL:continue
                  a=cw.get(z4(row.get('RIDE_BSST_ID')));b=cw.get(z4(row.get('ALGH_BSST_ID')))
                  if not a or not b or a['service_subway_id']!=IN_LINE or b['service_subway_id']!=OUT_LINE:continue
                  t0=dt(row.get('RIDE_DTM'));t1=dt(row.get('ALGH_DTM'))
                  if not t0 or not (t0.date().isoformat()=='2026-08-29' and (t0.hour==7 or (t0.hour==8 and t0.minute<30))):continue
                  if not t1 or t1<t0 or (t1-t0).total_seconds()>10800:continue
                  os=a['service_statn_id'];ds=b['service_statn_id']
                  if os in inbound and ds in outbound:passengers.append((t0,t1,os,ds))
              f.close()

          def select_chain(p,guard,tv):
              t0,t1,os,ds=p
              # Among all services departing origin after guard, choose one reaching the interchange earliest.
              ins=[x for x in inbound[os] if x[0]>=t0+timedelta(seconds=guard)]
              if not ins:return None,'NO_INCOMING'
              idep,iarr,itrain=min(ins,key=lambda x:(x[1],x[0],x[2]))
              # Among all destination-compatible services departing after transfer threshold, choose earliest destination arrival.
              outs=[x for x in outbound[ds] if x[0]>=iarr+timedelta(seconds=tv)]
              if not outs:return None,'NO_OUTGOING'
              odep,darr,otrain=min(outs,key=lambda x:(x[1],x[0],x[2]))
              return {'idep':idep,'iarr':iarr,'itrain':itrain,'odep':odep,'darr':darr,'otrain':otrain,'exit_compatible':darr<=t1+timedelta(seconds=59)},None

          scenario={};cache={}
          for g in ENTRY_GUARDS:
              for tv in TRANSFER_VALUES:
                  k=f'g{g}_t{tv}';c=Counter();wait=[];hist=Counter();rows=[]
                  for p in passengers:
                      rec,err=select_chain(p,g,tv)
                      if err:c[err]+=1;rows.append(None);continue
                      rows.append(rec);c['CHAIN']+=1;c['EXIT_OK']+=int(rec['exit_compatible']);wait.append((rec['odep']-rec['iarr']).total_seconds());hist[rec['darr'].strftime('%H:%M')]+=1
                  n=c['CHAIN'];scenario[k]={'passenger_rows':len(passengers),'chain_rows':n,'chain_share':n/len(passengers) if passengers else None,'exit_time_compatible_rows':c['EXIT_OK'],'exit_time_compatible_share':c['EXIT_OK']/n if n else None,'no_incoming_rows':c['NO_INCOMING'],'no_outgoing_rows':c['NO_OUTGOING'],'transfer_wait_sec':summ(wait),'destination_arrival_minute_top20':dict(hist.most_common(20))};cache[k]=rows

          comparisons={}
          for g in ENTRY_GUARDS:
              base=cache[f'g{g}_t0']
              for tv in [120,158,300]:
                  alt=cache[f'g{g}_t{tv}'];both=0;lost=0;changed=0;minute_changed=0;added=[];dep_shift=[];monotonic_violations=0
                  for b,a in zip(base,alt):
                      if b is None:continue
                      if a is None:lost+=1;continue
                      both+=1;changed+=int((b['otrain'],b['odep'])!=(a['otrain'],a['odep']));minute_changed+=int(b['darr'].strftime('%H:%M')!=a['darr'].strftime('%H:%M'))
                      da=(a['darr']-b['darr']).total_seconds();added.append(da);dep_shift.append((a['odep']-b['odep']).total_seconds());monotonic_violations+=int(da<0)
                  comparisons[f'g{g}_t0_vs_t{tv}']={'both_chain_rows':both,'lost_chain_rows':lost,'outgoing_service_changed_rows':changed,'outgoing_service_changed_share':changed/both if both else None,'destination_arrival_minute_changed_rows':minute_changed,'destination_arrival_minute_changed_share':minute_changed/both if both else None,'added_destination_arrival_sec':summ(added),'outgoing_departure_shift_sec':summ(dep_shift),'monotonicity_violation_rows':monotonic_violations}

          primary=comparisons['g60_t0_vs_t158']
          effect=primary['outgoing_service_changed_share'] or 0
          decision='PHYSICAL_TRANSFER_GATE_MATERIALLY_CHANGES_DESTINATION_BEST_SERVICE_OPPORTUNITY' if effect>=0.20 else ('PHYSICAL_TRANSFER_GATE_HAS_BOUNDED_DESTINATION_BEST_EFFECT' if effect>=0.05 else 'PHYSICAL_TRANSFER_GATE_SMALL_EFFECT_IN_BOUNDED_DESTINATION_BEST_SCENARIO')
          valid=all(v['monotonicity_violation_rows']==0 for v in comparisons.values())
          result={'schema':'mppd-n1-seoul-p3b3b-best-arrival-opportunity-v1','generated_at_utc':datetime.now(timezone.utc).isoformat(),'candidate':{'incoming_line':'1008','outgoing_line':'1002','station_ko':'잠실','station_en':'Jamsil','physical_shortest_transfer_sec':158},'analysis_window':'AFC entry 2026-08-29 07:00-08:29; service events 07:00-10:00','qualified_passenger_rows':len(passengers),'scenario_definition':'For each candidate passenger, select the eligible incoming same-train segment that reaches Jamsil earliest after the gate-entry guard. Among all destination-compatible outgoing same-train segments whose Jamsil departure satisfies the transfer constraint, select the service that reaches the passenger destination earliest. This allows the circular line to choose direction by realized destination arrival rather than by first departure.','scenarios':scenario,'paired_comparisons':comparisons,'primary_comparison':'entry guard 60 s; 0 s transfer versus 158 s physical shortest-transfer lower bound','monotonicity_gate_pass':valid,'decision':decision,'evidence_boundary':['Public AFC times are minute-quantized; gate-entry guards are sensitivity assumptions, not observed platform access time.','The 158-second constraint is a physical shortest lower bound for recommended transfer movement, not an empirical walking distribution.','Destination-best service opportunity is not observed passenger train assignment.','Exit-time compatibility does not model egress walking.','No T6 observed passenger genealogy.']}
          Path('seoul_p3b3b_best_arrival_opportunity_20260903.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('P3B3B_CONCISE='+json.dumps({'n':len(passengers),'primary':primary,'decision':decision,'monotonic':valid,'g60_t0':scenario['g60_t0'],'g60_t158':scenario['g60_t158'],'sens0':comparisons['g0_t0_vs_t158'],'sens120':comparisons['g120_t0_vs_t158']},ensure_ascii=False))
          PY

      - name: Store result
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
          REMOTE_NAME: ${{ steps.storage.outputs.remote_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/p3b3b"
          F=seoul_p3b3b_best_arrival_opportunity_20260903.json;D="$REMOTE_NAME:$ROOT_DRIVE/99_manifests/$F"
          rclone copyto "$F" "$D" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          L="$(stat -c '%s' "$F")";R="$(rclone size "$D" --config "$CONFIG_FILE" --json|jq -r '.bytes')";test "$L" = "$R"
          echo SEOUL_P3B3B_DURABLE_PASS

      - name: Clean configuration
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"; fi

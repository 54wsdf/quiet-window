name: Seoul R1D Perturbation Case Screen 2026-09-03

on:
  push:
    paths:
      - '.github/workflows/seoul-r1d-perturbation-case-screen-20260903.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      ROOT_DRIVE: ResearchData/rail_transit/metro_transfer_afc_ats_bridge/20260903/seoul
    steps:
      - uses: actions/checkout@v5

      - name: Restore same-day layers
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GDRIVE_CONFIG_B64:-}" || exit 2
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone jq
          CONFIG_FILE="$RUNNER_TEMP/rclone.conf";umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$CONFIG_FILE"
          REMOTE_NAME="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$CONFIG_FILE")";test -n "$REMOTE_NAME"
          echo "config_file=$CONFIG_FILE" >> "$GITHUB_OUTPUT";echo "remote_name=$REMOTE_NAME" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/r1d";cd "$RUNNER_TEMP/r1d"
          rclone copyto "$REMOTE_NAME:$ROOT_DRIVE/passenger/20260902/TAIMS_20260902.zip" TAIMS.zip --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          rclone copyto "$REMOTE_NAME:$ROOT_DRIVE/service/20260830/BMS_20260830.zip" BMS.zip --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          rclone copyto "$REMOTE_NAME:$ROOT_DRIVE/99_manifests/seoul_p1c_line_aware_crosswalk_20260903.json" p1c.json --config "$CONFIG_FILE" --retries 6 --low-level-retries 15

      - name: Screen line-direction regimes
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r1d"
          python - <<'PY'
          from __future__ import annotations
          import csv,io,json,math,re,statistics,unicodedata,zipfile
          from collections import Counter,defaultdict
          from datetime import datetime,timedelta,timezone
          from pathlib import Path

          START=datetime(2026,8,29,7,0,0);END=datetime(2026,8,29,10,0,0);FRESH=120
          RAIL={'201','202','203','204','205','206','208','209','210','231','232','235','236','237','290'}
          STRICT={'A_TRANSFER_CODE_LINE_NAME','B_UNIQUE_NAME','C_NAME_PREFIX_LINE'}

          def detect(raw):
              for e in ('utf-8-sig','utf-8','cp949','euc-kr'):
                  try:raw.decode(e);return e
                  except UnicodeDecodeError:pass
              return 'cp949'
          def zr(z,n):
              f=z.open(n);h=f.read(262144);f.close();e=detect(h)
              return io.TextIOWrapper(z.open(n),encoding=e,errors='replace',newline='')
          def hdr(s):return unicodedata.normalize('NFKC',str(s).replace('\ufeff','')).strip().lower()
          def z4(s):
              d=''.join(ch for ch in str(s or '') if ch.isdigit())
              return d.zfill(4) if d and len(d)<=4 else (d[-4:] if d else '')
          def dt(v):
              d=''.join(ch for ch in str(v or '') if ch.isdigit())
              try:return datetime.strptime(d[:14],'%Y%m%d%H%M%S') if len(d)>=14 else None
              except:return None
          def seqnum(v):
              d=''.join(ch for ch in str(v or '') if ch.isdigit())
              return int(d) if d else None
          def q(a,p):
              if not a:return None
              b=sorted(a);return b[round((len(b)-1)*p)]
          def summ(a):
              if not a:return None
              return {'n':len(a),'min':min(a),'median':q(a,.5),'p75':q(a,.75),'p90':q(a,.9),'p95':q(a,.95),'max':max(a)}
          def pearson(x,y):
              if len(x)<3:return 0.0
              mx=sum(x)/len(x);my=sum(y)/len(y);vx=sum((a-mx)**2 for a in x);vy=sum((b-my)**2 for b in y)
              if vx<=0 or vy<=0:return 0.0
              return sum((a-mx)*(b-my) for a,b in zip(x,y))/math.sqrt(vx*vy)
          def classify(sts,seq):
              p=sorted((seq[s],t.timestamp()) for s,t in sts.items() if s in seq and seq[s] is not None)
              if len(p)<4:return None
              c=pearson([x for x,y in p],[y for x,y in p])
              if abs(c)<.35:return None
              return 'INC' if c>0 else 'DEC'
          def cv(a):
              return statistics.pstdev(a)/statistics.mean(a) if len(a)>=2 and statistics.mean(a)>0 else None
          def winlabel(t):
              base=t.replace(minute=(t.minute//30)*30,second=0,microsecond=0)
              return base.strftime('%H:%M')+'-'+(base+timedelta(minutes=30)).strftime('%H:%M')

          p1c=json.loads(Path('p1c.json').read_text(encoding='utf-8'))
          entries=[x for x in p1c['canonical_entries'] if x.get('tier') in STRICT and x.get('service_subway_id') and x.get('service_statn_id')]
          station_meta=defaultdict(dict);cw={}
          for x in entries:
              line=x['service_subway_id'];st=x['service_statn_id'];station_meta[line][st]={'seq':seqnum(x.get('service_statn_sn')),'name':x.get('dv_name')};cw[x['out_stn_num']]=x

          # AFC destination pulse mass by mapped terminal line, regardless of origin line.
          afc_line=Counter();afc_line_stations=defaultdict(Counter);afc_same_line=Counter()
          with zipfile.ZipFile('TAIMS.zip') as z:
              f=zr(z,'VW_KSCC_DX_CARD.csv');r=csv.DictReader(f)
              for row in r:
                  if (row.get('TRNS_MNS_CD') or '').strip() not in RAIL:continue
                  a=cw.get(z4(row.get('RIDE_BSST_ID')));b=cw.get(z4(row.get('ALGH_BSST_ID')))
                  if not b:continue
                  t1=dt(row.get('ALGH_DTM'))
                  if not t1 or not START<=t1<END:continue
                  line=b['service_subway_id'];afc_line[line]+=1;afc_line_stations[line][b['service_statn_id']]+=1
                  if a and a['service_subway_id']==line:afc_same_line[line]+=1
              f.close()

          # Fresh arrival/departure state transitions for all lines.
          pat=re.compile(r'subarr_(260829(\d{6}))');obs=defaultdict(dict);snapshot=0
          with zipfile.ZipFile('BMS.zip') as z:
              infos=[]
              for x in z.infolist():
                  m=pat.search(x.filename)
                  if m and '070000'<=m.group(2)<'100000':infos.append((x,datetime.strptime('20'+m.group(1),'%Y%m%d%H%M%S')))
              for x,shard_t in infos:
                  f=zr(z,x.filename);r=csv.DictReader(f);r.fieldnames=[hdr(k) for k in (r.fieldnames or [])]
                  for row in r:
                      snapshot+=1
                      line=(row.get('subway_id') or '').strip();state=(row.get('arvl_cd') or '').strip()
                      if line not in station_meta or state not in {'0','1','2'}:continue
                      t=dt(row.get('recptn_dt'));tr=(row.get('btrain_no') or '').strip();st=(row.get('statn_id') or '').strip()
                      if not t or not tr or st not in station_meta[line]:continue
                      age=(shard_t-t).total_seconds();key=(line,tr,st);sig=(t,state);old=obs[key].get(sig)
                      if old is None or abs(age)<abs(old):obs[key][sig]=age
                  f.close()

          arrival=[];departure=[]
          for (line,tr,st),d in obs.items():
              items=sorted((t,s,a) for (t,s),a in d.items() if -30<=a<=FRESH);trans=[]
              for t,s,a in items:
                  if not trans or trans[-1][1]!=s:trans.append((t,s,a))
              prev=None
              for t,s,a in trans:
                  if START<=t<END and s=='1' and prev!='1':arrival.append((line,tr,st,t))
                  if START<=t<END and s=='2' and prev!='2':departure.append((line,tr,st,t))
                  prev=s

          by_line_train=defaultdict(lambda:defaultdict(dict));dep_line=Counter();arr_line=Counter()
          for line,tr,st,t in arrival:
              old=by_line_train[line][tr].get(st)
              if old is None or t<old:by_line_train[line][tr][st]=t
              arr_line[line]+=1
          for line,tr,st,t in departure:dep_line[line]+=1

          rows=[];window_rows=[]
          for line,trains in by_line_train.items():
              seq={s:v['seq'] for s,v in station_meta[line].items()};dirs={tr:classify(sts,seq) for tr,sts in trains.items()};dirs={tr:d for tr,d in dirs.items() if d}
              stations_per=[len(sts) for tr,sts in trains.items() if tr in dirs]
              for direction in ('INC','DEC'):
                  trs=[tr for tr,d in dirs.items() if d==direction]
                  cov=Counter(s for tr in trs for s in trains[tr]);ref=cov.most_common(1)[0][0] if cov else None
                  ref_events=sorted((tr,trains[tr][ref]) for tr in trs if ref in trains[tr]) if ref else []
                  times=[t for tr,t in ref_events]
                  gaps=[(b-a).total_seconds() for a,b in zip(times,times[1:]) if 60<=(b-a).total_seconds()<=1800]
                  residual=[];residual_records=[]
                  for i in range(1,len(times)-1):
                      pred=times[i-1]+(times[i+1]-times[i-1])/2
                      e=abs((times[i]-pred).total_seconds());residual.append(e);residual_records.append((times[i],e))
                  rsum=summ(residual);gsum=summ(gaps)
                  line_row={'line':line,'direction':direction,'reference_station_id':ref,'reference_station_name':station_meta[line].get(ref,{}).get('name') if ref else None,'classified_train_count':len(trs),'reference_train_event_count':len(times),'arrival_event_count_line':arr_line[line],'departure_event_count_line':dep_line[line],'median_stations_per_classified_train':statistics.median(stations_per) if stations_per else None,'afc_exit_rows_0700_1000':afc_line[line],'afc_same_line_rows_0700_1000':afc_same_line[line],'afc_exit_station_count':len(afc_line_stations[line]),'headway_sec':gsum,'headway_cv':cv(gaps),'leave_one_train_regular_midpoint_error_sec':rsum,'regular_midpoint_error_gt60_share':sum(e>60 for e in residual)/len(residual) if residual else None,'regular_midpoint_error_gt120_share':sum(e>120 for e in residual)/len(residual) if residual else None}
                  if rsum and afc_line[line]>0:
                      line_row['screen_score']=math.log1p(afc_line[line])*(rsum['p90'] or 0)*min(1.0,len(times)/15)
                  else:line_row['screen_score']=0.0
                  rows.append(line_row)
                  bywin=defaultdict(list)
                  for t,e in residual_records:bywin[winlabel(t)].append(e)
                  for w,es in bywin.items():
                      if len(es)<2:continue
                      window_rows.append({'line':line,'direction':direction,'window':w,'reference_station_id':ref,'reference_station_name':line_row['reference_station_name'],'n_midpoint_tests':len(es),'midpoint_error_sec':summ(es),'error_gt60_share':sum(e>60 for e in es)/len(es),'error_gt120_share':sum(e>120 for e in es)/len(es),'afc_exit_rows_line_0700_1000':afc_line[line],'classified_train_count':len(trs)})

          rows.sort(key=lambda x:(x['screen_score'],x['afc_exit_rows_0700_1000']),reverse=True)
          window_rows.sort(key=lambda x:((x['midpoint_error_sec']['p90'] or 0)*math.log1p(x['afc_exit_rows_line_0700_1000']),x['n_midpoint_tests']),reverse=True)
          candidates=[x for x in rows if x['reference_train_event_count']>=10 and x['afc_exit_rows_0700_1000']>=1000 and x['leave_one_train_regular_midpoint_error_sec'] and x['leave_one_train_regular_midpoint_error_sec']['p90']>=60]
          result={'schema':'seoul-r1d-perturbation-case-screen-v1','generated_at_utc':datetime.now(timezone.utc).isoformat(),'business_date':'2026-08-29','window':'07:00-10:00','method':'For each line and direction that can be recovered from direct arrival trajectories, choose the most-covered reference station and evaluate actual train irregularity using leave-one-train-out midpoint interpolation between neighboring direct train arrivals. This is a case-selection diagnostic, not a performance result. AFC exit mass counts all rail passengers whose mapped destination is on the line, including trips that may have transferred before the destination line.','snapshot_rows_scanned':snapshot,'line_direction_profiles':rows,'candidate_profiles':candidates,'top_30min_perturbation_windows':window_rows[:30],'selection_rule':'Prefer line-directions with >=10 reference train events, >=1000 AFC exit rows in 07:00-10:00, healthy trajectory station coverage, and p90 regular-midpoint error >=60 s. Final R1D stress test must still report the random-holdout regular-regime control.','evidence_boundary':['Direct operational states are used only to quantify challenge irregularity and later held-out truth; they are not AFC-inferred ATS.','AFC timestamps remain minute-quantized.','High-irregularity case selection creates a stress-test cohort and must not replace random holdout reporting.']}
          Path('seoul_r1d_perturbation_case_screen_20260903.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SEOUL_R1D_SCREEN='+json.dumps({'candidate_count':len(candidates),'top_candidates':candidates[:12],'top_windows':window_rows[:12]},ensure_ascii=False))
          PY

      - name: Store aggregate result durably
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.restore.outputs.config_file }}
          REMOTE_NAME: ${{ steps.restore.outputs.remote_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r1d"
          F=seoul_r1d_perturbation_case_screen_20260903.json;D="$REMOTE_NAME:$ROOT_DRIVE/99_manifests/$F"
          rclone copyto "$F" "$D" --config "$CONFIG_FILE" --retries 6 --low-level-retries 15
          L="$(stat -c '%s' "$F")";R="$(rclone size "$D" --config "$CONFIG_FILE" --json|jq -r '.bytes')";test "$L" = "$R"
          echo SEOUL_R1D_SCREEN_DURABLE_PASS

      - name: Clean configuration
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.restore.outputs.config_file }}
        run: |
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"; fi

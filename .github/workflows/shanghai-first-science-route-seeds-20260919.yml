name: Shanghai First-Science Structural Route Seeds 2026-09-19

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      PARQUET_DRIVE: transport_data_lake/01_rail/CN_Shanghai_Metro_5min_station_counts/10_mppd_formal_journeys_20260919/parquet_v1/builds/35428783632
    steps:
      - uses: actions/checkout@v5
      - name: Run bounded tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'duckdb>=1.1,<2'
          cd scripts
          python -m unittest -v test_shanghai_first_science_route_seeds.py
          python -m py_compile shanghai_first_science_route_seeds.py shanghai_route_frontier.py
      - name: Prepare runtime and protected Drive
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'duckdb>=1.1,<2'
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          CONFIG_FILE="$RUNNER_TEMP/rclone.conf"; umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$CONFIG_FILE"
          REMOTE_NAME="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$CONFIG_FILE")"
          test -n "$REMOTE_NAME"
          echo "config_file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"
          echo "remote_name=$REMOTE_NAME" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/route-seeds/formal" "$RUNNER_TEMP/route-seeds/static" "$RUNNER_TEMP/route-seeds/output"
      - name: Download qualified formal journey Parquet mirrors
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
          REMOTE_NAME: ${{ steps.storage.outputs.remote_name }}
        run: |
          set -euo pipefail
          declare -A BYTES=( [20160701]=72698566 [20160802]=67836155 [20160901]=68075378 )
          declare -A SHA=( [20160701]=0ac5815739f001640af78053723dafb2d0fde5fbb8c965983a29e5edd39bcfd0 [20160802]=bddc44435a4aae9ff85fad952e81a91ec94a9e676d1a9abb538374ca0881912b [20160901]=0bddd2f51a3f77056fbf0a8e0d148dec3c2667312b970c3abb7017012b43d5a5 )
          for day in 20160701 20160802 20160901; do
            f="SPTCC-${day}.formal_mppd_journeys.parquet"
            src="$PARQUET_DRIVE/${day}/$f"
            dst="$RUNNER_TEMP/route-seeds/formal/$f"
            rclone copyto "$REMOTE_NAME:$src" "$dst" --config "$CONFIG_FILE" --retries 6 --low-level-retries 20
            test "$(stat -c%s "$dst")" -eq "${BYTES[$day]}"
            test "$(sha256sum "$dst" | awk '{print $1}')" = "${SHA[$day]}"
          done
      - name: Fetch pinned structural snapshot
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/jeevanyue/metro/bb78b72ecadc57e0c8deedf9731a78a65ab62ef4'
          curl -fsSL "$BASE/train/base/station.txt" -o "$RUNNER_TEMP/route-seeds/static/station.txt"
          curl -fsSL "$BASE/connections_by_station_name.json" -o "$RUNNER_TEMP/route-seeds/static/connections_by_station_name.json"
      - name: Aggregate support and replay structural seeds
        shell: bash
        run: |
          set -euo pipefail
          python scripts/shanghai_first_science_route_seeds.py \
            --journey-dir "$RUNNER_TEMP/route-seeds/formal" \
            --station "$RUNNER_TEMP/route-seeds/static/station.txt" \
            --connections "$RUNNER_TEMP/route-seeds/static/connections_by_station_name.json" \
            --out-dir "$RUNNER_TEMP/route-seeds/output"
      - name: Persist bounded route seeds to protected Drive
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
          REMOTE_NAME: ${{ steps.storage.outputs.remote_name }}
        run: |
          set -euo pipefail
          OUT_DRIVE="transport_data_lake/01_rail/CN_Shanghai_Metro_5min_station_counts/12_mppd_service_screening_20260919/route_seeds/builds/$GITHUB_RUN_ID"
          rclone copy "$RUNNER_TEMP/route-seeds/output" "$REMOTE_NAME:$OUT_DRIVE" --config "$CONFIG_FILE" --retries 6 --low-level-retries 20
          rclone check "$RUNNER_TEMP/route-seeds/output" "$REMOTE_NAME:$OUT_DRIVE" --config "$CONFIG_FILE" --size-only --one-way

      - uses: actions/upload-artifact@v4
        with:
          name: shanghai-first-science-structural-route-seeds
          path: ${{ runner.temp }}/route-seeds/output/*
          if-no-files-found: error
          retention-days: 14
      - name: Cleanup protected inputs
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
        run: |
          rm -rf "$RUNNER_TEMP/route-seeds/formal"
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"; fi

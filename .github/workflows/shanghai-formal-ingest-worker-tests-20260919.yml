name: Shanghai Formal Ingest Worker Tests 2026-09-19

on:
  push:
    paths:
      - 'scripts/shanghai_sptcc_formal_ingest.py'
      - 'scripts/test_shanghai_sptcc_formal_ingest.py'
      - '.github/workflows/shanghai-formal-ingest-worker-tests-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run bounded worker tests
        shell: bash
        run: |
          set -euo pipefail
          cd scripts
          python -m unittest -v test_shanghai_sptcc_formal_ingest.py
          python -m py_compile shanghai_sptcc_formal_ingest.py

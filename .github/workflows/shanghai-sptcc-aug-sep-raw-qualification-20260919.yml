name: Shanghai SPTCC Aug-Sep Raw Qualification 2026-09-19

on:
  push:
    paths:
      - '.github/workflows/shanghai-sptcc-aug-sep-raw-qualification-20260919.yml'
      - 'scripts/shanghai_sptcc_raw_qualification.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - day: '20160802'
            source_file: 'SPTCC-20160802.csv'
            expected_bytes: '848528365'
            expected_rows: '14789536'
            expected_metro: '9729530'
          - day: '20160901'
            source_file: 'SPTCC-20160901.csv'
            expected_bytes: '866509391'
            expected_rows: '15122570'
            expected_metro: '9778560'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GDRIVE_CONFIG_B64: ${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      SOURCE_DRIVE: transport_data_lake/01_rail/CN_Shanghai_Metro_5min_station_counts/source_data
      OUT_DRIVE: transport_data_lake/01_rail/CN_Shanghai_Metro_5min_station_counts/09_mppd_raw_qualification_20260919
    steps:
      - uses: actions/checkout@v5
      - name: Prepare rclone
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          CONFIG_FILE="$RUNNER_TEMP/rclone.conf"; umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$CONFIG_FILE"
          REMOTE_NAME="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$CONFIG_FILE")"
          test -n "$REMOTE_NAME"
          echo "config_file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"
          echo "remote_name=$REMOTE_NAME" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/rawq/input" "$RUNNER_TEMP/rawq/output"
      - name: Download one raw day
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
          REMOTE_NAME: ${{ steps.storage.outputs.remote_name }}
        run: |
          set -euo pipefail
          rclone copyto "$REMOTE_NAME:$SOURCE_DRIVE/${{ matrix.source_file }}"             "$RUNNER_TEMP/rawq/input/${{ matrix.source_file }}"             --config "$CONFIG_FILE" --retries 6 --low-level-retries 20 --transfers 1 --checkers 4             --drive-chunk-size 128M --stats 60s --stats-one-line
          test "$(stat -c%s "$RUNNER_TEMP/rawq/input/${{ matrix.source_file }}")" -eq "${{ matrix.expected_bytes }}"
      - name: Qualify raw day
        shell: bash
        run: |
          set -euo pipefail
          python scripts/shanghai_sptcc_raw_qualification.py             --raw "$RUNNER_TEMP/rawq/input/${{ matrix.source_file }}"             --out "$RUNNER_TEMP/rawq/output"             --expected-bytes "${{ matrix.expected_bytes }}"             --expected-data-rows "${{ matrix.expected_rows }}"             --expected-metro-rows "${{ matrix.expected_metro }}"
      - name: Persist aggregate qualification
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
          REMOTE_NAME: ${{ steps.storage.outputs.remote_name }}
        run: |
          set -euo pipefail
          BUILD="$OUT_DRIVE/builds/$GITHUB_RUN_ID/${{ matrix.day }}"
          rclone copy "$RUNNER_TEMP/rawq/output" "$REMOTE_NAME:$BUILD" --config "$CONFIG_FILE" --retries 6 --low-level-retries 20
          rclone check "$RUNNER_TEMP/rawq/output" "$REMOTE_NAME:$BUILD" --config "$CONFIG_FILE" --size-only --one-way
      - uses: actions/upload-artifact@v4
        with:
          name: shanghai-sptcc-${{ matrix.day }}-raw-qualification
          path: ${{ runner.temp }}/rawq/output/*
          if-no-files-found: error
          retention-days: 14
      - name: Cleanup
        if: always()
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.storage.outputs.config_file }}
        run: |
          rm -rf "$RUNNER_TEMP/rawq/input"
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"; fi

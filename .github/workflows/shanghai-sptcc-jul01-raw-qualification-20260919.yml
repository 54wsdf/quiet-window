name: Shanghai SPTCC Jul01 Raw Qualification 2026-09-19

on:
  push:
    paths:
      - '.github/workflows/shanghai-sptcc-jul01-raw-qualification-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GDRIVE_CONFIG_B64: \${{ secrets.GDRIVE_RCLONE_CONFIG_B64 }}
      SOURCE_DRIVE: transport_data_lake/01_rail/CN_Shanghai_Metro_5min_station_counts/source_data
      OUT_DRIVE: transport_data_lake/01_rail/CN_Shanghai_Metro_5min_station_counts/09_mppd_raw_qualification_20260919
      SOURCE_FILE: SPTCC-20160701.csv
      EXPECTED_BYTES: '904976558'
      EXPECTED_DATA_ROWS: '15772842'
      EXPECTED_METRO_ROWS: '10308569'

    steps:
      - name: Prepare rclone
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          test -n "\${GDRIVE_CONFIG_B64:-}" || { echo "missing rclone secret" >&2; exit 3; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          CONFIG_FILE="$RUNNER_TEMP/rclone.conf"
          umask 077
          printf '%s' "$GDRIVE_CONFIG_B64" | base64 --decode > "$CONFIG_FILE"
          REMOTE_NAME="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$CONFIG_FILE")"
          test -n "$REMOTE_NAME"
          echo "config_file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"
          echo "remote_name=$REMOTE_NAME" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/rawq/input" "$RUNNER_TEMP/rawq/output"

      - name: Download Jul01 raw AFC
        shell: bash
        env:
          CONFIG_FILE: \${{ steps.storage.outputs.config_file }}
          REMOTE_NAME: \${{ steps.storage.outputs.remote_name }}
        run: |
          set -euo pipefail
          rclone copyto "$REMOTE_NAME:$SOURCE_DRIVE/$SOURCE_FILE" \
            "$RUNNER_TEMP/rawq/input/$SOURCE_FILE" \
            --config "$CONFIG_FILE" --retries 6 --low-level-retries 20 \
            --transfers 1 --checkers 4 --drive-chunk-size 128M \
            --stats 60s --stats-one-line
          test "$(stat -c%s "$RUNNER_TEMP/rawq/input/$SOURCE_FILE")" -eq "$EXPECTED_BYTES"

      - name: Qualify raw schema and station universe
        shell: bash
        run: |
          set -euo pipefail
          RAW="$RUNNER_TEMP/rawq/input/$SOURCE_FILE"
          OUT="$RUNNER_TEMP/rawq/output"
          export RAW OUT EXPECTED_BYTES EXPECTED_DATA_ROWS EXPECTED_METRO_ROWS
          python - <<'PY'
          import csv, hashlib, json, os, re
          from collections import Counter
          from pathlib import Path

          raw=Path(os.environ['RAW']); out=Path(os.environ['OUT']); out.mkdir(parents=True,exist_ok=True)
          expected_bytes=int(os.environ['EXPECTED_BYTES'])
          expected_rows=int(os.environ['EXPECTED_DATA_ROWS'])
          expected_metro=int(os.environ['EXPECTED_METRO_ROWS'])

          post_anchor = [
            "11号线迪士尼","11号线康新公路","11号线秀沿路",
            "12号线漕宝路","12号线大木桥路","12号线东兰路","12号线顾戴路","12号线桂林公园",
            "12号线汉中路","12号线虹漕路","12号线虹梅路","12号线虹莘路","12号线嘉善路","12号线龙漕路",
            "12号线龙华","12号线龙华中路","12号线南京西路","12号线七莘路","12号线陕西南路",
            "13号线汉中路","13号线淮海中路","13号线江宁路","13号线马当路","13号线南京西路",
            "13号线世博大道","13号线世博会博物馆","13号线新天地","13号线自然博物馆"
          ]
          pa=set(post_anchor)

          h=hashlib.sha256()
          with raw.open('rb') as f:
              for block in iter(lambda:f.read(8*1024*1024), b''): h.update(block)

          physical_rows=0; data_rows=0; metro_rows=0; malformed=0; header_rows=0
          stations=Counter(); lines=Counter(); fare=Counter(); dates=Counter()
          post_counts=Counter(); card_ids=set()
          min_dt=None; max_dt=None
          header_tokens={"卡ID","卡号","刷卡日期","交易日期","刷卡时间","刷卡站点","刷卡乘车类型","card_id"}

          with raw.open('r',encoding='gb18030',errors='strict',newline='') as f:
              rd=csv.reader(f)
              for row in rd:
                  physical_rows+=1
                  if not row: continue
                  if physical_rows==1 and header_tokens.intersection(x.strip() for x in row):
                      header_rows=1
                      continue
                  data_rows+=1
                  if len(row)!=7:
                      malformed+=1
                      continue
                  card,date,time,station,vehicle,money,prop=[x.strip().replace('\ufeff','') for x in row]
                  if vehicle!='地铁': continue
                  metro_rows+=1
                  card_ids.add(card)
                  stations[station]+=1
                  m=re.match(r'^(\d+)号线',station)
                  lines[m.group(1).zfill(2) if m else 'UNPARSED']+=1
                  dates[date]+=1
                  if station in pa: post_counts[station]+=1
                  try:
                      x=float(money)
                      if x==0: fare['zero']+=1
                      elif x>0: fare['positive']+=1
                      else: fare['negative']+=1
                  except Exception:
                      fare['unparsed']+=1
                  dt=f"{date} {time}"
                  if min_dt is None or dt<min_dt:min_dt=dt
                  if max_dt is None or dt>max_dt:max_dt=dt

          token_rows=[{"station_token":k,"events":v} for k,v in sorted(stations.items())]
          with (out/'station_token_counts.csv').open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['station_token','events']); w.writeheader(); w.writerows(token_rows)
          post_rows=[{"station_token":k,"events":post_counts.get(k,0),"present":post_counts.get(k,0)>0} for k in post_anchor]
          with (out/'post_anchor_token_counts.csv').open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['station_token','events','present']); w.writeheader(); w.writerows(post_rows)

          result={
            "schema":"mppd.shanghai.sptcc.raw-qualification.v1",
            "source_file":raw.name,
            "source_bytes":raw.stat().st_size,
            "sha256":h.hexdigest(),
            "encoding":"gb18030_strict",
            "physical_csv_rows":physical_rows,
            "header_rows":header_rows,
            "data_rows":data_rows,
            "malformed_7col_rows":malformed,
            "metro_rows":metro_rows,
            "unique_metro_cards":len(card_ids),
            "metro_station_tokens":len(stations),
            "metro_line_prefix_counts":dict(sorted(lines.items())),
            "metro_date_counts":dict(sorted(dates.items())),
            "metro_time_range":[min_dt,max_dt],
            "metro_fare_sign_counts":dict(fare),
            "post_anchor_registry_tokens_expected":len(post_anchor),
            "post_anchor_registry_tokens_present":sum(1 for k in post_anchor if post_counts.get(k,0)>0),
            "post_anchor_registry_event_mass":sum(post_counts.values()),
            "post_anchor_present_tokens":[k for k in post_anchor if post_counts.get(k,0)>0],
            "post_anchor_absent_tokens":[k for k in post_anchor if post_counts.get(k,0)==0],
            "expected_checks":{
              "bytes":{"expected":expected_bytes,"actual":raw.stat().st_size,"pass":raw.stat().st_size==expected_bytes},
              "data_rows":{"expected":expected_rows,"actual":data_rows,"pass":data_rows==expected_rows},
              "metro_rows":{"expected":expected_metro,"actual":metro_rows,"pass":metro_rows==expected_metro}
            },
            "privacy":"No card identifier, raw row, or cross-event passenger linkage is persisted in outputs.",
            "claim_boundary":"Raw-source qualification only; no pairing, virtual-transfer stitching, route inference or passenger-service posterior."
          }
          (out/'qualification.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if not all(x["pass"] for x in result["expected_checks"].values()):
              raise SystemExit("expected source-scale check failed")
          PY

      - name: Persist aggregate qualification to Drive
        shell: bash
        env:
          CONFIG_FILE: \${{ steps.storage.outputs.config_file }}
          REMOTE_NAME: \${{ steps.storage.outputs.remote_name }}
        run: |
          set -euo pipefail
          BUILD="$OUT_DRIVE/builds/$GITHUB_RUN_ID"
          rclone copy "$RUNNER_TEMP/rawq/output" "$REMOTE_NAME:$BUILD" \
            --config "$CONFIG_FILE" --retries 6 --low-level-retries 20 --transfers 3 --checkers 6
          rclone check "$RUNNER_TEMP/rawq/output" "$REMOTE_NAME:$BUILD" \
            --config "$CONFIG_FILE" --size-only --one-way --checkers 6
          printf '{"state":"QUALIFIED","github_run_id":"%s","github_sha":"%s","source_file":"%s","build_path":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SOURCE_FILE" "$BUILD" > "$RUNNER_TEMP/LATEST_QUALIFIED.json"
          rclone copyto "$RUNNER_TEMP/LATEST_QUALIFIED.json" "$REMOTE_NAME:$OUT_DRIVE/LATEST_QUALIFIED.json" \
            --config "$CONFIG_FILE" --retries 6 --low-level-retries 20

      - name: Upload aggregate artifact
        uses: actions/upload-artifact@v4
        with:
          name: shanghai-sptcc-jul01-raw-qualification
          path: \${{ runner.temp }}/rawq/output/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove raw and protected config
        if: always()
        shell: bash
        env:
          CONFIG_FILE: \${{ steps.storage.outputs.config_file }}
        run: |
          rm -rf "$RUNNER_TEMP/rawq/input"
          if [[ -n "\${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then
            shred -u "$CONFIG_FILE" 2>/dev/null || rm -f "$CONFIG_FILE"
          fi
